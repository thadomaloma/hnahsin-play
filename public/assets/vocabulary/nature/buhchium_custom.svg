<!-- Custom SVG for Hnahsin Vocabulary -->
<!-- Mizo: buhchiûm -->
<!-- English: Pupa -->
<!-- Category: nature -->
<!-- License: Project-owned (CC0 compatible) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Nature template: Natural element -->
  <defs>
    <style>
      .sky { fill: #87CEEB; }
      .ground { fill: #8FBC8F; }
      .sun { fill: #FFD700; }
      .tree { fill: #228B22; }
      .trunk { fill: #8B4513; }
    </style>
  </defs>
  <!-- Sky -->
  <rect class="sky" width="200" height="120"/>
  <!-- Ground -->
  <rect class="ground" y="120" width="200" height="80"/>
  <!-- Sun -->
  <circle class="sun" cx="160" cy="40" r="25"/>
  <!-- Tree/plant -->
  <rect class="trunk" x="95" y="110" width="10" height="50"/>
  <ellipse class="tree" cx="100" cy="100" rx="30" ry="35"/>
  <!-- Nature label -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">buhchiûm</text>
</svg>