<!-- Custom SVG for Hnahsin Vocabulary -->
<!-- Mizo: arbawm -->
<!-- English: Chicken coop -->
<!-- Category: household -->
<!-- License: Project-owned (CC0 compatible) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Household template: Home/object -->
  <defs>
    <style>
      .wall { fill: #DEB887; }
      .roof { fill: #A0522D; }
      .door { fill: #8B4513; }
      .window { fill: #87CEEB; }
      .frame { stroke: #5D4037; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <!-- House base -->
  <rect class="wall" x="40" y="80" width="120" height="80"/>
  <!-- Roof -->
  <polygon class="roof" points="30,80 100,20 170,80"/>
  <!-- Door -->
  <rect class="door" x="90" y="120" width="20" height="40"/>
  <!-- Window -->
  <rect class="window" x="55" y="100" width="25" height="25"/>
  <line class="frame" x1="67.5" y1="100" x2="67.5" y2="125"/>
  <line class="frame" x1="55" y1="112.5" x2="80" y2="112.5"/>
  <!-- Household label -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">arbawm</text>
</svg>