    kids.push(box(HEDDLE_X - 0.5, HEDDLE_X + 0.5, -10.5, 10.5, rodZ, rodZ + 1, { pal: WOOD, part: 'hnahchawi', bias: 300 }));
    // The shed stick (thembupui): a wide flat bamboo bar through the warp
    kids.push(box(STICK_X - 1.8, STICK_X + 1.8, -10.5, 10.5, pz(STICK_X) + 0.1, pz(STICK_X) + 0.8, { pal: BAMBOO, part: 'thembupui', bias: 200,
      decals: { zp: [{ pts: [[STICK_X - 1.8, -10.5, pz(STICK_X) + 0.85], [STICK_X + 1.8, -10.5, pz(STICK_X) + 0.85]], stroke: BAMBOO.d, open: true, w: .3 }, { pts: [[STICK_X - 1.8, 0, pz(STICK_X) + 0.85], [STICK_X + 1.8, 0, pz(STICK_X) + 0.85]], stroke: BAMBOO.d, open: true, w: .3 }] } }));
    // Pattern rods (themte): thin rods past the heddle, raised for the puan's design
    if (s.pattern) kids.push(group([10, 13, 16, 19].map(x => box(x - .3, x + .3, -9.5, 9.5, pz(x) + .9, pz(x) + 1.4, { pal: WOOD })), { part: 'themte', bias: 240 }));
    // The reed (tuirek): a comb that keeps the warp threads evenly spaced
    const RX = -4, teeth = [];
    for (let y = -WY - .5; y <= WY + .5; y += 1) teeth.push({ pts: [[RX + .5, y, pz(RX) - 1.2], [RX + .5, y, pz(RX) + 1.6]], stroke: CANE.d, open: true, w: .3 });
    kids.push(box(RX - .5, RX + .5, -10, 10, pz(RX) + 1.6, pz(RX) + 2.4, { pal: CANE, part: 'tuirek', bias: 260 }));
    kids.push(box(RX - .5, RX + .5, -10, 10, pz(RX) - 2, pz(RX) - 1.2, { pal: CANE, part: 'tuirek', bias: 90 }));
    kids.push(group(teeth.map(t => line(t.pts, { col: CANE.d, w: .35, ink: false })), { part: 'tuirek', bias: 255 }));
    // The breast beam (themkhawl), with the woven cloth rolled round it
    kids.push(box(BEAM_X - 1.2, BEAM_X + 1.2, -10.5, 10.5, pz(BEAM_X) - 2, pz(BEAM_X), { pal: WOOD, part: 'themkhawl', bias: 350 }));
    const rolled = s.finish >= 0 ? 0 : Math.max(0, s.rows.length - SHOW);
    if (rolled) {
      const R = 0.8 + Math.min(2.6, rolled * 0.06), c = s.rows[rolled - 1].c, z = pz(BEAM_X) - 1;
      const recent = s.rows.slice(Math.max(0, rolled - 5), rolled).map(r => r.c);
      kids.push(box(BEAM_X - 1.2 - R * 0.6, BEAM_X + 1.2 + R * 0.4, -WY - 0.4, WY + 0.4, z - R * 0.7, z + 1 + R, { pal: shade(COL[c]), part: 'puan', bias: 380,
        decals: { zp: recent.map((rc, i) => ({ pts: [[BEAM_X - 1.2 - R * 0.6 + i * 0.5, -WY - 0.4, z + 1.05 + R], [BEAM_X - 0.9 - R * 0.6 + i * 0.5, -WY - 0.4, z + 1.05 + R], [BEAM_X - 0.9 - R * 0.6 + i * 0.5, WY + 0.4, z + 1.05 + R], [BEAM_X - 1.2 - R * 0.6 + i * 0.5, WY + 0.4, z + 1.05 + R]], fill: COL[rc], w: 0.2 })) } }));
    }
    // The woven rows in view, run together into bands, with the pattern on top
    let x = BEAM_X + 0.6, i0 = 0;
    const vis = M.vis;
    while (i0 < vis.length) {
      let i1 = i0;
      while (i1 + 1 < vis.length && vis[i1 + 1].c === vis[i0].c) i1++;
      const xa = x + i0 * ROW, xb = x + (i1 + 1) * ROW;
      kids.push(poly([[xa, -WY - 0.4, pz(xa) + 0.06], [xb, -WY - 0.4, pz(xb) + 0.06], [xb, WY + 0.4, pz(xb) + 0.06], [xa, WY + 0.4, pz(xa) + 0.06]], { fill: COL[vis[i0].c], w: 0.5, part: 'puan', bias: 400 }));
      i0 = i1 + 1;
    }
    vis.forEach((r, i) => {
      if (!r.m) return;
      const xa = x + i * ROW, xm = xa + ROW / 2, n = s.rows.length - vis.length + i, z = pz(xm) + 0.12;
      for (let j = 0; j < 5; j++) {
        const y = -6 + j * 3 + (n % 2) * 1.5, hw = 0.9, hx = ROW * 0.5;
        kids.push(poly([[xm - hx, y, z], [xm, y + hw, z], [xm + hx, y, z], [xm, y - hw, z]], { fill: motifCol(r), w: 0.25, part: 'ziarâng', bias: 450 }));
      }
    });
    // The beater (thempui): a long flat weaving sword, pointed at both ends, that packs each row in
    const bz0 = pz(M.bx) + 0.2;
    kids.push(box(M.bx, M.bx + 2.4, -12, 12, bz0, bz0 + .9, { pal: DARK, part: 'thempui', bias: 500,
      decals: { zp: [{ pts: [[M.bx + 1.2, -12, bz0 + .95], [M.bx + 1.2, 12, bz0 + .95]], stroke: DARK.l, open: true, w: .3 }] } }));
    kids.push(group([-1, 1].map(e => poly([[M.bx, e * 12, bz0 + .9], [M.bx + 2.4, e * 12, bz0 + .9], [M.bx + 1.2, e * 14, bz0 + .5]], { fill: DARK.m, w: .5 })), { part: 'thempui', bias: 501 }));
    // The shuttle (khawhtlang) with the yarn wound on it, and the yarn it lays as it crosses
    const sx = M.fell + 2.4, sz = pz(sx) + 1.4;
    kids.push(group([
      box(sx - 0.6, sx + 0.6, M.sy - 5, M.sy + 5, sz, sz + 0.9, { pal: WOOD }),
      box(sx - 0.85, sx + 0.85, M.sy - 2.4, M.sy + 2.4, sz - 0.25, sz + 1.15, { pal: shade(COL[s.yarn]) }),
    ], { part: 'khawhtlang', bias: 600 }));
    if (M.crossing) kids.push(line([[M.fell + 0.3, -s.side * (WY + 0.4), pz(M.fell) + 0.1], [sx, M.sy, sz + 0.4]], { col: COL[s.yarn], w: 0.45, ink: false, bias: 550 }));
    // The finished puan, folded, flies to the chest
    if (s.finish >= 0 && s.piece) {
      const k = s.finish, e = k * k * (3 - 2 * k), from = [-24, 0, 12], to = [-38, -24, 11 + s.done.length * 1.7 + 0.8];
      const c = Ink3D.lerp3(from, to, e); c[2] += Math.sin(k * Math.PI) * 22;
      const hw = 8 - 0.5 * e, hd = 5;
      const P = s.piece, top = P.famous ? famousDecals(P.famous, [c[1] - hd, c[1] + hd, c[0] - hw, c[0] + hw], (y, x) => [x, y, c[2] + 0.8], P.famous)
        : puanStripes(P.bands, [c[0] - hw, c[0] + hw, c[1] - hd, c[1] + hd], P.motif, (x, y) => [x, y, c[2] + 0.8]);
      kids.push(box(c[0] - hw, c[0] + hw, c[1] - hd, c[1] + hd, c[2] - 0.75, c[2] + 0.75, { pal: shade(COL[P.famous ? FAMOUS[P.famous].rows[0][0] : P.bands[0]]), part: P.famous || 'puan chei', bias: 2000, decals: { zp: top } }));
    }
    return { kids, M };
  }

  // ---------- the weaver ----------
  const PI = { h: 26, shirt: { l: '#6f9be0', m: '#3f6fb5', d: '#1c3560' }, lower: 'skirt', lowerPal: shade('#2a2522'), bands: [0.12, 0.18, 0.24], hair: '#cfcac2', bun: true };
  function weaver(s, M) {
    const pz = plane, hipAt = [-34, 0, 0];
    const lean = 0.05 + 0.05 * M.beat;
    let hands;
    if (M.crossing) {
      const lead = [M.fell + 1.2, Math.max(-WY, Math.min(WY, M.sy)), pz(M.fell) + 1.4];
      const rest = [M.fell - 1.2, -s.side * 4, pz(M.fell) + 0.8];
      hands = s.side > 0 ? [rest, lead] : [lead, rest];
    } else if (s.pass >= 0.5 && s.pass < 0.9) hands = [[M.bx + 1, -WY, pz(M.bx) + 1.5], [M.bx + 1, WY, pz(M.bx) + 1.5]];
    else hands = [[M.fell - 1, -5, pz(M.fell) + 0.9], [M.fell - 1, 5, pz(M.fell) + 0.9]];
    if (s.finish >= 0) hands = [[-26, -6, 14], [-26, 6, 14]];
    const kids = person(hipAt, 0, { ...PI, pose: 'sit', lean, hands, t: s.t });
    const arms = kids.splice(-4);   // drawn after the loom, so her hands are on the cloth
    // The backstrap (kawngvawn) round her back, tied to the breast beam, holds the warp tight
    const strapBack = line([[-33, -8.6, 7.6], [-37.5, -6, 7], [-40.2, 0, 7], [-37.5, 6, 7], [-33, 8.6, 7.6]], { col: STRAP, w: 2.4, bias: -50, part: 'kawngvawn' });
    const strapSides = [-1, 1].map(e => line([[BEAM_X, e * 10, pz(BEAM_X) - 1], [-33, e * 8.6, 7.6]], { col: STRAP, w: 2.2, bias: 50, part: 'kawngvawn' }));
    return [group([strapBack, ...kids, ...strapSides], { part: 'pi', at: [-34, 0, 8] }), group(arms, { part: 'pi', bias: 1000, shadow: false })];
  }

  function scene(s, cam) {
    const floorDec = [];
    for (let y = -30; y < 34; y += 8) floorDec.push({ pts: [[-49, y, 0.02], [61, y, 0.02]], stroke: PLANK, open: true });
    const slab = box(-52, 64, -34, 34, -8, 0, { pal: FLOOR, part: 'chhuat', decals: { zp: floorDec }, shadow: false });
    // Sunlight from the window on the floor
    const sun = backWall(cam, WALLS[2]) ? [poly([[10, -31, 0.06], [36, -31, 0.06], [46, -6, 0.06], [22, -6, 0.06]], { fill: '#fff3c4', glow: true, ink: false, opacity: 0.45, part: 'êng' })] : [];
    const mat = poly([[-46, -13, 0.05], [-20, -13, 0.05], [-20, 13, 0.05], [-46, 13, 0.05]], { fill: '#d8b56a', w: 0.7, part: 'chhuatphah' });
    const matLines = [];
    for (let x = -43; x < -20; x += 3) matLines.push(line([[x, -13, 0.08], [x, 13, 0.08]], { col: '#b08a4f', w: 0.45, ink: false, part: 'chhuatphah' }));
    const { kids, M } = loom(s);
    const post = box(50, 54, -2, 2, 0, 48, { pal: DARK });
    return {
      ground: [slab], groundDecals: [mat, ...matLines, ...sun], clip: [[-52, -34, 0], [64, -34, 0], [64, 34, 0], [-52, 34, 0]],
      items: [...room(s, cam), post, group(kids, { at: [8, 0, 12] }), ...weaver(s, M)],
    };
  }

  const tint = () => c => c;
  const sky = () => `<rect x="-140" y="-140" width="280" height="260" fill="#f3efe6"/>`;
  const over = () => '';

  // ---------- labels ----------
  const LABEL_GROUPS = ['Loom', 'Weaving', 'Puans', 'Room', 'Colours'];
  function anchors(s, cam) {
    const M = moment(s), a = [], pz = plane;
    const L = (part, p, n) => a.push({ part, p, n, g: 'Loom' }), R = (part, p, n) => a.push({ part, p, n, g: 'Room' });
    if (M.vis.length) L('puan', [M.fell - 3, 0, pz(M.fell) + 0.3], [0, 0, 1]);
    if (M.vis.some(r => r.m)) L('ziarâng', [M.fell - 1.5, 4.5, pz(M.fell) + 0.3], [0, 0, 1]);
    const W = (part, p, n) => a.push({ part, p, n, g: 'Weaving' });
    W('khawhtlang', [M.fell + 2.4, M.sy, pz(M.fell) + 2.6]);
    W('thempui', [M.bx + 1, -12, pz(M.bx) + 1.2]);
    W('themkhawl', [BEAM_X, 10.5, pz(BEAM_X) - 1]);
    W('kawngvawn', [-40, 0, 7.5]);
    W('pi', [-33, 0, 24]);
    L('tuirek', [-4, 10, pz(-4) + 2.4]);
    L('hnahchawi', [HEDDLE_X, -10.5, pz(HEDDLE_X) + 5.6]);
    if (s.pattern) L('themte', [16, 9.5, pz(16) + 1.4]);
    L('thembupui', [STICK_X, 10.5, pz(STICK_X) + 0.8]);
    L('kaihbu', [36, -9.5, pz(36) + .5]);
    L('themtlang', [FAR_X, 10.5, pz(FAR_X) + 1.2]);
    L('hrui', [48, 6.5, 16.5]);
    for (const w of WALLS) if (backWall(cam, w)) R('bang', w.key === 'xn' ? [-49, 24, 34] : w.key === 'yn' ? [50, -31, 34] : w.key === 'xp' ? [61, 0, 34] : [0, 31, 34], w.n);
    if (backWall(cam, WALLS[2])) { R('tukverh', [22, -31, 30], [0, 1, 0]); R('êng', [30, -16, 0]); }
    if (backWall(cam, WALLS[0])) for (const h of HANG) a.push({ part: h.id, p: [-48.9, (h.y0 + h.y1) / 2, (h.z0 + h.z1) / 2], n: [1, 0, 0], g: 'Puans' });
    R('thingrem', [-38, -18, 5]);
    R('chhuatphah', [-24, 10, 0.1]); R('chhuat', [40, 20, 0], [0, 0, 1]); R('fawng', [-8, 27, 3]); R('zawhte', [4, 24, 7]);
    Object.keys(YARNS).forEach((c, i) => a.push({ part: c, p: yarnAt(i, 2), g: 'Colours' }));
    return a;
  }

  // The camera comes close to the cloth while a famous puan is woven, and steps back to see it fly to the chest
  function focus(s) {
    if (!s.plan) return null;
    return { p: [moment(s).fell + 2, 0, plane(moment(s).fell) + 2], zoom: 1.5 };
  }

  function tap(s, part) {
    if (YARN_IDS.includes(part)) { s.yarn = part; return 'rawng'; }   // pick this yarn
    if (part === 'pi') return s.pass >= 0 || s.auto ? 'tah' : 'ṭhu';
    if (part === 'zawhte') return 'muhil';
    if (part === 'puan chei') return 'mawi';
    if (FAMOUS[part]) { if (!s.plan) s.pick = part; return null; }   // tap a famous puan to pick it
    return null;
  }

  return {
    id: 'loom', name: 'Puan tah', sub: 'weaving a Mizo puan',
    view: { yaw: 55, pitch: 30, box: '-70 -82 142 128', centre: [0, -12], ink: 0.62 },   // a closer view, so finer lines
    words: ['puan', 'tah', 'puan chei', 'rawng', 'sen', 'dum', 'vâr', 'hring', 'dumpâwl', 'sendang', 'ziarâng', 'hrui', 'kawngvawn',
      'themkhawl', 'thempui', 'thembupui', 'hnahchawi', 'themte', 'tuirek', 'khawhtlang', 'themtlang', 'kaihbu', 'pi', 'ṭhu', 'chhuatphah', 'tukverh', 'bang', 'chhuat', 'fawng', 'thingrem', 'zawhte', 'muhil', 'êng', 'zo', 'mawi', 'eng',
      'puanchei', 'pawndum', 'ngotekherh', 'hmaram', 'tawlhlohpuan'],
    init, step, tint, scene, sky, over, anchors, tap, focus, labelGroups: LABEL_GROUPS,
    swatches: { label: 'Yarn colour', key: 'yarn', list: YARNS },
    actions: [
      { label: s => s.plan ? `Weaving ${s.plan.id}… ${s.plan.i}/${s.plan.rows.length}` : 'Weave this puan', word: s => s.plan ? null : s.pick, ready: s => !s.plan && s.finish < 0, run: s => startPlan(s) },
      { label: () => 'Next puan ›', word: () => null, ready: s => !s.plan, run: s => { s.pick = FAMOUS_IDS[(FAMOUS_IDS.indexOf(s.pick) + 1) % FAMOUS_IDS.length]; } },
      { label: s => s.pass >= 0 && !s.auto ? 'Weaving…' : 'Weave a row', word: () => 'tah', ready: s => !s.plan, run: s => startPass(s) },
      { label: s => s.auto ? 'Stop' : 'Keep weaving', word: () => null, run: s => { s.auto = !s.auto; if (s.auto) startPass(s); } },
      { label: s => s.pattern ? 'Plain rows' : 'Add a pattern', word: s => s.pattern ? null : 'ziarâng', ready: s => !s.plan, run: s => { s.pattern = !s.pattern; } },
      { label: () => 'Finish the puan', word: () => 'zo', ready: s => !s.plan && s.rows.length >= 8 && s.finish < 0, run: s => finish(s) },
    ],
  };
})();
</script>
<script>
// Bazar dâwr: a Mizo market stall, drawn with Ink3D. A bamboo stall with a striped awning and a
// woven back screen; the shopkeeper (dâwrkai) at the end of her counter beside the money tray;
// fruit (thei) in round baskets on a raised shelf and vegetables (thlai) on trays in front;
// bananas and a string of chillies hanging from the beam, a sign, a lamp; a sack of rice, eggs
// and fish by the stall; and Rova come to shop with his basket.
// Play: Rova gets a shopping list in Mizo numbers ("serthlum · pathum"); tap things to send them
// flying into his basket, then pay, and his coins fly to the tray. Or put something on the balance
// to see if it is heavy (rit) or light (zâng). Every word comes from the Hnahsin content.
const BAZAR = (() => {
  const { box, ball, cyl, line, poly, group, mix, lerp3 } = Ink3D;
  const person = (at, dir, o) => Ink3DPeople.person(at, dir, o);
  const shade = c => ({ l: mix(c, '#ffffff', 0.3), m: c, d: mix(c, '#000000', 0.55) });

  const STONE = { l: '#e6dcc6', m: '#cbbd9c', d: '#6e6146' };
  const BAMBOO = { l: '#d9e08a', m: '#b3ba62', d: '#5a5d2a' };
  const WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' };
  const DARK = { l: '#8a5a36', m: '#6b4429', d: '#33200f' };
  const CANE = { l: '#ecd08f', m: '#cfa862', d: '#6b5126' };
  const BRASS = { l: '#f3d27a', m: '#d4a93a', d: '#6e5212' };
  const SACK = { l: '#efe3c4', m: '#d6c49a', d: '#7a6a45' };
  const AWNINGS = { sen: '#d8434c', hring: '#2f9a55', 'dumpâwl': '#2f6fc0', eng: '#f2b431' };
  const TOP = 17;                                    // the counter's height
  const CX0 = -8, CX1 = 10, CY0 = -38, CY1 = 38;     // the counter
  const SHELF = 6;                                   // the back shelf stands this much above the counter

  // ---------- where things are ----------
  // Fruit and the big vegetables sit in round baskets on the back shelf; the small vegetables on
  // trays along the front. The shopkeeper stands at the far (left) end, where nothing hides her.
  const BACK = { zikhlum: -11, 'mâi': 1, serthlum: 13, theihai: 25 };
  const FRONT = { purun: -30, hmarcha: -18, bawkbawn: -6, fanghma: 6, alu: 18, sawhthing: 30 };
  const BX = -2, FX = 5;
  const spotOf = w => (w in BACK ? [BX, BACK[w], TOP + SHELF] : w in FRONT ? [FX, FRONT[w], TOP] : w === 'artui' ? [20, 46, 9] : w === 'sangha' ? [26, 46, 9] : w === 'balhla' ? [20, -26, 44] : [FX, 0, TOP]);
  const WEIGHT = { serthlum: 2, theihai: 2, alu: 2, purun: 1, hmarcha: .5, zikhlum: 3, 'mâi': 5, bawkbawn: 2, fanghma: 1.5, sawhthing: .5, artui: 1, sangha: 2.5, balhla: 2 };
  const ITEMS = [...Object.keys(BACK), ...Object.keys(FRONT), 'artui', 'sangha', 'balhla'];
  const LISTABLE = ['serthlum', 'theihai', 'alu', 'purun', 'zikhlum', 'mâi', 'bawkbawn', 'fanghma', 'artui', 'balhla', 'sangha'];
  const NUMBERS = ['pakhat', 'pahnih', 'pathum'];
  const COLOUR = { serthlum: '#f39a2b', theihai: '#f2b84a', alu: '#c9965e', purun: '#c46a9e', hmarcha: '#d8323a', zikhlum: '#7cc65a', 'mâi': '#f08a2c', bawkbawn: '#6b3a8f', fanghma: '#4f9e3c', sawhthing: '#d9b56a', artui: '#fbf3e4', sangha: '#9fb6c8', balhla: '#f2cf3a' };
  const ROVA_AT = [30, 2, 0], BASKET_AT = [27, -9, 0];
  const TRAY = [-4, -31];
  const SIGN_Y = 22;                                  // the sign hangs to one side, clear of the shopkeeper                             // the money tray, by the shopkeeper

  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const toward = (v, t, step) => (v < t ? Math.min(t, v + step) : Math.max(t, v - step));

  function init() {
    return {
      t: 0, awning: 'sen', open: 1, openT: 1, dusk: 0, duskT: 0,
      list: null, basket: {}, flying: [], coins: [], paid: 0, say: null, sayT: 0,
      onPan: null, tilt: 0, tiltT: 0, last: null, reach: 0, cheer: 0,
    };
  }
  function newList(s) {
    const pick = LISTABLE.slice().sort(() => Math.random() - .5).slice(0, 2);
    s.list = pick.map(w => [w, 1 + Math.floor(Math.random() * 3)]);
    s.basket = {};
    speak(s, 'Rova', 'chibai');
  }
  function speak(s, who, word) { s.say = { who, word }; s.sayT = 2.6; }

  function step(s, dt) {
    s.t += dt;
    s.open = toward(s.open, s.openT, dt * 1.6);
    s.dusk = toward(s.dusk, s.duskT, dt * 0.8);
    s.tilt = toward(s.tilt, s.tiltT, dt * 1.5);
    s.sayT = Math.max(0, s.sayT - dt);
    s.reach = Math.max(0, s.reach - dt * 2);
    s.cheer = Math.max(0, s.cheer - dt);
    // Things bought fly in an arc into Rova's basket; coins fly from Rova to the tray.
    for (const f of s.flying) f.k += dt / .6;
    s.flying = s.flying.filter(f => { if (f.k < 1) return true; s.basket[f.w] = (s.basket[f.w] || 0) + 1; return false; });
    for (const c of s.coins) c.k += dt / .7;
    s.coins = s.coins.filter(c => { if (c.k < 1) return true; s.paid++; return false; });
    return true;
  }
  const tint = s => c => mix(mix(c, '#ff9a5a', s.dusk * .15), '#1e2850', s.dusk * .38);

  // ---------- the produce ----------
  // k scales a pile (1 on the stall, smaller on the balance's pan).
  function produce(w, at, k = 1, bias = 0) {
    const [x, y, z] = at, out = [];
    const B = (dx, dy, dz, r, pal, o = {}) => out.push(ball([x + dx * k, y + dy * k, z + dz * k], r * k, { pal, ...o }));
    const L = (pts, col, wd, o = {}) => out.push(line(pts.map(([dx, dy, dz]) => [x + dx * k, y + dy * k, z + dz * k]), { col, w: wd * k, ...o }));
    const leaf = (dx, dy, dz) => L([[dx, dy, dz], [dx + .8, dy + .6, dz + 1.2]], '#4f9e3c', .9, { ink: false });
    switch (w) {
      case 'serthlum': [[-2.2, -1.6, 2], [2.2, -1.6, 2], [0, 1.8, 2], [-1, 0, 4.6], [1.6, .6, 4.4]].forEach(([a, b, c], i) => { B(a, b, c, 2.3, shade('#f39a2b')); if (i > 2) leaf(a, b, c + 2.2); }); break;
      case 'theihai': [[-2, -1.6, 2.2, '#9bc94a'], [2, -1.4, 2.2, '#f2b84a'], [0, 1.8, 2.2, '#f5a53a'], [0, 0, 4.8, '#e9c64a']].forEach(([a, b, c, col]) => B(a, b, c, 2.4, shade(col))); break;
      case 'zikhlum':
        B(0, 0, 3.6, 3.9, shade('#8fd06e'));
        for (const a of [0, 1.6, 3.2, 4.8]) B(Math.cos(a) * 2.4, Math.sin(a) * 2.4, 2.6, 2.2, shade('#5fa451'));
        break;
      case 'mâi':
        B(0, 0, 3.6, 4.2, shade('#f08a2c'));
        L([[0, 0, 7.6], [.6, .5, 9]], '#5a7a2a', 1.1);
        break;
      case 'purun': for (let i = 0; i < 6; i++) { const a = i % 3 - 1, b = i < 3 ? -1 : 1; B(a * 2.4, b * 1.6, 1.6, 1.6, shade('#c46a9e')); L([[a * 2.4, b * 1.6, 3.1], [a * 2.4 + .3, b * 1.6, 3.9]], '#7a8a3a', .4, { ink: false }); } break;
      case 'hmarcha': for (let i = 0; i < 7; i++) L([[-3 + i, -3, .8 + (i % 2) * .5], [-2.4 + i, 0, 1.2], [-3 + i + (i % 2), 3, .8]], i % 3 ? '#d8323a' : '#e8574a', 1.1); break;
      case 'bawkbawn': for (let i = 0; i < 3; i++) { L([[-3.2, -2 + i * 2, 1.5], [3, -2.4 + i * 2, 1.7]], '#6b3a8f', 2.6); L([[3, -2.4 + i * 2, 1.7], [4, -2.6 + i * 2, 1.8]], '#4f9e3c', 1.4, { ink: false }); } break;
      case 'fanghma': for (let i = 0; i < 3; i++) L([[-3.4, -2 + i * 2, 1.3], [3.4, -1.6 + i * 2, 1.3]], i % 2 ? '#5fae48' : '#3f8a34', 2.2); break;
      case 'alu': for (let i = 0; i < 6; i++) B((i % 3 - 1) * 2.5, (i < 3 ? -1 : 1) * 1.7, 1.5 + (i === 4 ? 1.8 : 0), 1.7, shade('#c9965e')); break;
      case 'sawhthing': for (let i = 0; i < 4; i++) L([[-2.5 + i * 1.6, -2, 1], [-1.5 + i * 1.6, 0, 1.6], [-2.2 + i * 1.6, 2.4, 1]], '#d9b56a', 1.4); break;
      case 'artui': for (let i = 0; i < 3; i++) B((i - 1) * 1.6, 0, 1.3, 1.3, null, { fill: '#fbf3e4', w: .5 }); break;
      case 'sangha': out.push(poly([[x - 3 * k, y, z + .3], [x, y - .9 * k, z + .3], [x + 3 * k, y, z + .3], [x, y + .9 * k, z + .3]], { fill: '#9fb6c8', w: .5 })); break;
      case 'balhla': for (let i = 0; i < 4; i++) L([[-1.5 + i, -1, 1], [-1 + i, 0, 1.6], [-1.5 + i, 1.4, 1]], '#f2cf3a', 1.6); break;
    }
    return group(out, { part: w, bias });
  }
  const tray = (x, y, z) => box(x - 4.4, x + 4.4, y - 5.4, y + 5.4, z, z + 1, { pal: CANE, part: 'fawng', bias: -20, decals: { zp: [{ pts: [[x - 4.4, y, z + 1.05], [x + 4.4, y, z + 1.05]], stroke: CANE.d, open: true, w: .4 }, { pts: [[x, y - 5.4, z + 1.05], [x, y + 5.4, z + 1.05]], stroke: CANE.d, open: true, w: .4 }] } });
  const roundBasket = (x, y, z) => cyl([x, y], z, z + 2.6, 4.6, 5.6, { pal: CANE, bands: [z + 1.3], capFill: '#8a6a32', part: 'fawng', bias: -10 });

  // ---------- the stall ----------
  function stall(s) {
    const items = [], A = AWNINGS[s.awning], o = s.open;
    // Bamboo posts
    for (const [x, h] of [[-24, 70], [16, 64]]) for (const y of [CY0 - 4, CY1 + 4]) items.push(cyl([x, y], 0, h, 1.4, 1.2, { pal: BAMBOO, bands: [12, 24, 36, 48, 60].filter(z => z < h), part: 'mau' }));
    // A woven bamboo screen at the back, so the stall reads against the busy market
    const weave = [];
    for (let z = 14; z < 58; z += 4) weave.push({ pts: [[-23.95, CY0 - 3, z], [-23.95, CY1 + 3, z]], stroke: CANE.d, open: true, w: .5 });
    for (let y = CY0; y < CY1 + 2; y += 5) weave.push({ pts: [[-23.95, y, 10], [-23.95, y, 60]], stroke: mix(CANE.d, CANE.m, .5), open: true, w: .35 });
    items.push(box(-25, -24, CY0 - 3, CY1 + 3, 10, 60, { pal: CANE, part: 'mau', decals: { xp: weave }, bias: -200 }));
    // The counter: a wooden table with a Mizo puan hanging down its front
    const bands = [['#2a2522', 2, 4], ['#c8323d', 4.5, 6.5], ['#2a2522', 7, 8], ['#f4efe4', 8.5, 9.3], ['#2f8a4a', 9.8, 11.2], ['#f4efe4', 11.7, 12.5], ['#c8323d', 13, 15]];
    const front = bands.map(([c, z0, z1]) => ({ pts: [[CX1 + .06, CY0, z0], [CX1 + .06, CY1, z0], [CX1 + .06, CY1, z1], [CX1 + .06, CY0, z1]], fill: c, w: .25, part: 'puan' }));
    for (let y = CY0 + 6; y < CY1; y += 12) front.push({ pts: [[CX1 + .07, y - 1.2, 10.5], [CX1 + .07, y, 12.2], [CX1 + .07, y + 1.2, 10.5], [CX1 + .07, y, 8.8]], fill: '#ffc94a', w: .25, part: 'puan' });
    items.push(box(CX0, CX1, CY0, CY1, 0, TOP - 1.2, { pal: shade('#7a2a30'), part: 'puan', decals: { xp: front }, bias: -60 }));
    items.push(box(CX0 - 1, CX1 + 1.4, CY0 - 1, CY1 + 1, TOP - 1.2, TOP, { pal: WOOD, part: 'dawhkân', bias: -50 }));
    // The back shelf: a step of dark planks
    items.push(box(BX - 5.2, BX + 5.2, CY0 + 20, CY1 - 7, TOP, TOP + SHELF, { pal: DARK, part: 'dawhkân', bias: -40 }));
    // Baskets of fruit and big vegetables on the shelf, trays of small vegetables in front
    for (const [w, y] of Object.entries(BACK)) { items.push(roundBasket(BX, y, TOP + SHELF)); items.push(produce(w, [BX, y, TOP + SHELF + 2.2], 1, 2)); }
    for (const [w, y] of Object.entries(FRONT)) { items.push(tray(FX, y, TOP)); items.push(produce(w, [FX, y, TOP + 1], 1, 2)); }
    // The money tray (by the shopkeeper) and the balance (at the near end)
    const coins = [box(TRAY[0] - 3.4, TRAY[0] + 3.4, TRAY[1] - 4, TRAY[1] + 4, TOP, TOP + 1.2, { pal: DARK })];
    for (let i = 0; i < Math.min(5 + s.paid, 14); i++) coins.push(cyl([TRAY[0] - 2 + (i % 3) * 2, TRAY[1] - 2.6 + Math.floor(i / 3) * 1.7], TOP + 1.2, TOP + 1.7 + (i % 2) * .4, .8, .8, { pal: BRASS, capFill: '#ffe08a' }));
    items.push(group(coins, { part: 'pawisa' }));
    items.push(...balance(s));
    // The awning: a sloping striped canvas with a scalloped front, which drops when the stall closes
    const back = [-26, 72], fr = [26, 64 - 22 * (1 - o)], yA = CY0 - 8, yB = CY1 + 8, th = 1.2;
    const strip = [];
    for (let i = 0; i < 10; i += 2) {
      const y0 = yA + (yB - yA) * i / 10, y1 = yA + (yB - yA) * (i + 1) / 10;
      strip.push({ pts: [[back[0], y0, back[1] + th + .05], [fr[0], y0, fr[1] + th + .05], [fr[0], y1, fr[1] + th + .05], [back[0], y1, back[1] + th + .05]], fill: '#fff8ec', w: .3 });
    }
    items.push(Ink3D.hexa([[back[0], yA, back[1]], [fr[0], yA, fr[1]], [fr[0], yB, fr[1]], [back[0], yB, back[1]],
      [back[0], yA, back[1] + th], [fr[0], yA, fr[1] + th], [fr[0], yB, fr[1] + th], [back[0], yB, back[1] + th]], { pal: shade(A), part: 'dâwr', decals: { zp: strip }, bias: 50 }));
    const sc = [];
    for (let i = 0; i < 10; i++) {
      const y0 = yA + (yB - yA) * i / 10, y1 = yA + (yB - yA) * (i + 1) / 10, ym = (y0 + y1) / 2, drop = 4 * o + 1;
      sc.push(poly([[fr[0], y0, fr[1]], [fr[0], y1, fr[1]], [fr[0] + .5, ym, fr[1] - drop]], { fill: i % 2 ? '#fff8ec' : A, w: .7 }));
    }
    items.push(group(sc, { part: 'dâwr', bias: 51 }));
    // A wooden sign hanging from the front beam ("dâwr" is written on it over the picture)
    const sz = fr[1] - 9 * o - 2;
    items.push(group([
      line([[fr[0] - .5, SIGN_Y - 7, fr[1] - 1], [fr[0] - .5, SIGN_Y - 7, sz + 7]], { col: '#7a6a55', w: .4, ink: false }),
      line([[fr[0] - .5, SIGN_Y + 7, fr[1] - 1], [fr[0] - .5, SIGN_Y + 7, sz + 7]], { col: '#7a6a55', w: .4, ink: false }),
      box(fr[0] - 1.2, fr[0] - .2, SIGN_Y - 10, SIGN_Y + 10, sz, sz + 7, { pal: WOOD }),
    ], { part: 'dâwr', bias: 55, shadow: false }));
    // A lamp, glowing at dusk
    const lampAt = [4, 0, 56 - 8 * (1 - o)];
    items.push(group([
      line([[4, 0, 68], [4, 0, lampAt[2] + 2]], { col: '#4b4038', w: .5, ink: false }),
      ball(lampAt, 2, { fill: mix('#efe6cf', '#ffd04d', s.dusk), glow: true }),
      ball(lampAt, 13, { fill: '#ffd36b', glow: true, ink: false, opacity: .32 * s.dusk, bias: .1, shadow: false }),
    ], { part: 'khawnvâr', shadow: false, bias: 60 }));
    // Bananas on a rope at one end of the beam, a string of chillies at the other, swaying a little
    const sw = Math.sin(s.t * 1.4) * .8, [bx, by, bz] = spotOf('balhla');
    const bananas = [line([[bx, by, fr[1] - 2], [bx + sw * .3, by, bz + 4]], { col: '#b98a4e', w: .6, part: 'hrui' })];
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 4 + (i % 2); bananas.push(line([[bx + sw, by, bz + 3], [bx + sw + Math.cos(a) * r * .7, by + Math.sin(a) * r * .7, bz - 2], [bx + sw + Math.cos(a) * r, by + Math.sin(a) * r, bz + 1.6]], { col: i % 2 ? '#f2cf3a' : '#e8c22a', w: 2.4 })); }
    bananas.push(ball([bx + sw, by, bz + 3.6], 1.3, { fill: '#7a5a2a', w: .5 }));
    items.push(group(bananas, { part: 'balhla', shadow: false, bias: 45 }));
    const cy = 30, cz = fr[1] - 2, chil = [line([[20, cy, cz], [20 - sw * .3, cy, cz - 20]], { col: '#b98a4e', w: .5, ink: false })];
    for (let i = 0; i < 9; i++) { const z = cz - 3 - i * 2, s2 = i % 2 ? 1 : -1; chil.push(line([[20, cy, z], [20 + s2 * 1.6, cy + s2 * .5, z - 2.2]], { col: i % 3 ? '#d8323a' : '#c21f2b', w: 1.4 })); }
    items.push(group(chil, { part: 'hmarcha', shadow: false, bias: 45 }));
    // A closed stall: a cloth over the produce
    if (o < .5) items.push(box(CX0 - 1.4, CX1 + 1.8, CY0 - 1.4, CY1 + 1.4, TOP, TOP + SHELF + 5, { pal: shade('#e9dcc0'), part: 'puan', bias: 40 }));
    // By the stall: a sack of rice, and a stool with eggs in a basket and fish on a banana leaf
    items.push(group([
      cyl([22, -46], 0, 11, 5, 4.2, { pal: SACK, bands: [3, 8] }),
      cyl([22, -46], 11, 12.5, 4.2, 5, { pal: SACK, capFill: '#f7f2e6' }),
      ...Array.from({ length: 5 }, (_, i) => ball([22 + (i % 3 - 1) * 1.6, -46 + (i < 3 ? -1 : 1) * 1.2, 12.6], .9, { fill: '#fbf7ee', ink: false })),
    ], { part: 'buhfai' }));
    items.push(box(16, 30, 40, 52, 0, 9, { pal: WOOD, part: 'dawhkân', bias: -5 }));
    const eggs = [cyl([20, 46], 9, 12.5, 3.4, 4.2, { pal: CANE, bands: [10.7], capFill: '#6b5126', part: 'kho' })];
    for (let i = 0; i < 6; i++) eggs.push(ball([20 + (i % 3 - 1) * 1.7, 46 + (i < 3 ? -1 : 1) * 1.3, 13 + (i > 3 ? .8 : 0)], 1.25, { fill: '#fbf3e4', w: .5 }));
    items.push(group(eggs, { part: 'artui' }));
    items.push(poly([[23.5, 41, 9.05], [29.6, 41, 9.05], [29.6, 51, 9.05], [23.5, 51, 9.05]], { fill: '#4f9e3c', w: .5, part: 'hnah' }));
    const fish = [];
    for (let i = 0; i < 2; i++) {
      const fx = 26.5 + (i ? .8 : -.8), fy = 46, fz = 9.4 + i * .6, d = i ? -1 : 1;
      fish.push(poly([[fx, fy - 4 * d, fz], [fx - 1, fy, fz], [fx, fy + 3 * d, fz], [fx + 1, fy, fz]], { fill: i ? '#a8bfd2' : '#8fa6ba', w: .5 }));
      fish.push(poly([[fx, fy + 3 * d, fz], [fx - 1.3, fy + 4.6 * d, fz], [fx + 1.3, fy + 4.6 * d, fz]], { fill: '#7f98ad', w: .5 }));
      fish.push(ball([fx, fy - 2.6 * d, fz + .2], .3, { fill: '#231e16', ink: false }));
    }
    items.push(group(fish, { part: 'sangha', bias: 1 }));
    return items;
  }

  function balance(s) {
    const X = BX, Y = CY1 - 1, Z = TOP, k = [];
    const a = s.tilt * .35, arm = 6;
    const pivot = [X, Y, Z + 13];
    // A heavy thing pulls its pan (the near one) down; a light one lets the weight win.
    const L = [X, Y - Math.cos(a) * arm, pivot[2] - Math.sin(a) * arm], R = [X, Y + Math.cos(a) * arm, pivot[2] + Math.sin(a) * arm];
    k.push(box(X - 3, X + 3, Y - 3.4, Y + 3.4, Z, Z + 1.2, { pal: DARK }));
    k.push(cyl([X, Y], Z + 1.2, pivot[2], .6, .5, { pal: BRASS }));
    k.push(ball(pivot, 1, { pal: BRASS }));
    k.push(line([L, R], { col: BRASS.m, w: 1 }));
    for (const P of [L, R]) {
      const pan = [P[0], P[1], P[2] - 6];
      k.push(line([P, [pan[0] + 1.8, pan[1], pan[2]]], { col: '#7a6a55', w: .3, ink: false }), line([P, [pan[0] - 1.8, pan[1], pan[2]]], { col: '#7a6a55', w: .3, ink: false }));
      k.push(cyl([pan[0], pan[1]], pan[2] - .6, pan[2], 2.6, 3, { pal: BRASS, capFill: '#f6dd8f' }));
    }
    k.push(cyl([R[0], R[1]], R[2] - 6, R[2] - 4.4, 1.1, .9, { pal: shade('#5a5754') }));
    if (s.onPan) k.push(produce(s.onPan, [L[0], L[1], L[2] - 6], .6, 5));
    return [group(k, { part: 'rit', at: [X, Y, Z + 6] })];
  }

  // ---------- people ----------
  const SELLER = { h: 29, shirt: { l: '#f27aa3', m: '#d8457b', d: '#7a1f43' }, lower: 'skirt', lowerPal: shade('#2a2522'), bands: [.2, .28, .36], hair: '#1d1b22', bun: true };
  const ROVA = { h: 25, shirt: { l: '#3f86da', m: '#1565c0', d: '#0b3a78' }, stripe: { l: '#ffd66b', m: '#ffc94a', d: '#8a6a12' }, lower: 'shorts', lowerPal: { l: '#24456b', m: '#0d2a4a', d: '#06162a' }, hair: '#1d1b22', shoes: '#ffffff' };
  function people(s) {
    const out = [];
    // The shopkeeper, at the far end of her counter beside the money tray. She reaches out when
    // she sells something and waves when she greets.
    const S = [-15, -31, 0], r = s.reach, hello = s.say && s.sayT > 0 && s.say.who === 'seller' ? Math.sin(s.t * 12) : 0;
    const hands = [[CX1 - 4 + 6 * r, -24 + 4 * r, TOP + 6 + 2 * r], [-6 + 3 * hello, -36, TOP + 10 + 8 * Math.abs(hello)]];
    out.push(group(person(S, Math.atan2(.35, 1), { ...SELLER, t: s.t, hands }), { part: 'dâwrkai' }));
    // Rova stands in front of the stall, turned three-quarters toward you; his basket (êm) at his side.
    const jump = Math.sin(Math.min(1, s.cheer) * Math.PI) * 3;
    out.push(group(person([ROVA_AT[0], ROVA_AT[1], jump], Math.atan2(.99, .15), { ...ROVA, pose: 'stand', t: s.t }), { part: 'Rova' }));
    const em = [cyl(BASKET_AT.slice(0, 2), 0, 9, 3.4, 5, { pal: CANE, bands: [3, 6], capFill: '#6b5126' })];
    let n = 0;
    for (const [w, c] of Object.entries(s.basket)) for (let i = 0; i < c; i++, n++) {
      const a = n * 2.1, rr = n < 3 ? 1.8 : 0;
      em.push(ball([BASKET_AT[0] + Math.cos(a) * rr, BASKET_AT[1] + Math.sin(a) * rr, 9.6 + Math.floor(n / 3) * 1.4], 1.4, { fill: COLOUR[w], w: .5 }));
    }
    out.push(group(em, { part: 'êm' }));
    // Things in the air: produce to the basket, coins to the tray
    for (const f of s.flying) {
      const [x, y, z] = spotOf(f.w), p = lerp3([x, y, z + 3], [BASKET_AT[0], BASKET_AT[1], 11], f.k);
      p[2] += Math.sin(f.k * Math.PI) * 16;
      out.push(ball(p, 1.7, { fill: COLOUR[f.w], w: .6, shadow: false, bias: 100 }));
    }
    for (const c of s.coins) {
      if (c.k < 0) continue;   // still waiting its turn
      const p = lerp3([ROVA_AT[0] - 2, ROVA_AT[1] - 4, 16], [TRAY[0], TRAY[1], TOP + 2], c.k);
      p[2] += Math.sin(c.k * Math.PI) * 18;
      out.push(cyl([p[0], p[1]], p[2], p[2] + .5, 1, 1, { pal: BRASS, capFill: '#ffe08a', shadow: false, bias: 100 }));
    }
    return out;
  }

  function scene(s, cam) {
    s._cam = cam;
    // A cobbled square: stones of two shades
    const dec = [];
    for (let x = -42; x < 54; x += 6) for (let y = -54; y < 56; y += 6) {
      const j = rnd(x, y);
      if (j > .45) dec.push(poly([[x + .6, y + .6, .03], [x + 5.2, y + .9, .03], [x + 5, y + 5.4, .03], [x + .4, y + 5, .03]], { fill: j > .8 ? '#d9cbac' : '#ddd1b6', ink: false }));
    }
    const slab = box(-44, 56, -56, 58, -5, 0, { pal: STONE, part: 'kawng', shadow: false });
    return { ground: [slab], groundDecals: dec, clip: [[-44, -56, 0], [56, -56, 0], [56, 58, 0], [-44, 58, 0]], items: [...stall(s), ...people(s)] };
  }

  // ---------- behind: a busy market under the hills ----------
  function sky(s) {
    const d = s.dusk, top = mix('#9fd3f3', '#26315e', d), low = mix('#fff1d6', '#e88b6a', d);
    let o = `<defs><linearGradient id="bzsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${low}"/></linearGradient></defs>`;
    o += `<rect x="-140" y="-140" width="280" height="260" fill="url(#bzsky)"/>`;
    const hill = (y, amp, col, ph) => `<path d="M-140 60${Array.from({ length: 29 }, (_, i) => { const x = -140 + i * 10; return `L${x} ${(y + Math.sin(x / 40 + ph) * amp).toFixed(1)}`; }).join('')}L140 60Z" fill="${mix(col, '#22284a', d * .7)}"/>`;
    o += hill(-62, 7, '#b5dcc0', 1) + hill(-50, 5, '#98cba6', 2.4);
    // A row of stalls far off, each with a striped roof
    for (let i = 0; i < 10; i++) {
      const x = -136 + i * 29, h = 14 + (i * 7 % 9), col = ['#e46a4e', '#57a26f', '#5786c4', '#f2b431', '#c2185b'][i % 5];
      o += `<rect x="${x}" y="${-30 - h}" width="24" height="${h}" fill="${mix('#efe2c4', '#2c2a48', d * .7)}"/>`;
      o += `<path d="M${x - 3} ${-30 - h}L${x + 12} ${-40 - h}L${x + 27} ${-30 - h}Z" fill="${mix(col, '#2c2a48', d * .6)}"/>`;
      o += `<path d="M${x + 4} ${-33 - h}L${x + 12} ${-38 - h}L${x + 20} ${-33 - h}" stroke="${mix('#ffffff', '#2c2a48', d * .6)}" stroke-width="1.2" fill="none" opacity=".7"/>`;
    }
    // People walking past the far stalls
    for (let i = 0; i < 5; i++) {
      const dir = i % 2 ? 1 : -1, x = ((s.t * (5 + i) * dir + i * 70) % 300 + 300) % 300 - 150, y = -28 + (i % 3) * 2;
      const col = mix(['#4f86c6', '#e0457b', '#57a26f', '#f2b431', '#7569e8'][i], '#2c2a48', .35 + d * .4), step = Math.sin(s.t * 6 + i) * 1.2;
      o += `<g opacity=".75" transform="translate(${x.toFixed(1)} ${y}) scale(.7) translate(${(-x).toFixed(1)} ${-y})"><circle cx="${x.toFixed(1)}" cy="${y - 11}" r="2.6" fill="${mix('#d9a47c', '#2c2a48', .3 + d * .4)}"/>` +
        `<rect x="${(x - 2.6).toFixed(1)}" y="${y - 8.6}" width="5.2" height="6" rx="2" fill="${col}"/>` +
        `<path d="M${(x - 1.2).toFixed(1)} ${y - 2.8}l${step.toFixed(1)} 3.6M${(x + 1.2).toFixed(1)} ${y - 2.8}l${(-step).toFixed(1)} 3.6" stroke="${mix('#5a4a3a', '#2c2a48', d * .4)}" stroke-width="1.2" stroke-linecap="round"/></g>`;
    }
    // Bunting across the top, flapping a little
    o += '<path d="M-140 -100Q0 -78 140 -100" stroke="#7a6a55" stroke-width=".8" fill="none"/>';
    for (let i = 0; i < 18; i++) {
      const x = -132 + i * 15.5, y = -99 + 22 * Math.sin(Math.PI * (x + 140) / 280) * .9, c = ['#f06292', '#ffc94a', '#6dbe5e', '#3c9fea', '#9c7cf0'][i % 5];
      const fl = Math.sin(s.t * 2 + i) * 1.2;
      o += `<path d="M${x} ${y}L${x + 10} ${y + 1}L${(x + 5 + fl).toFixed(1)} ${y + 10}Z" fill="${c}" stroke="#231e16" stroke-width=".5"/>`;
    }
    return o;
  }
  // Over the picture: the sign's lettering, speech bubbles and Rova's list.
  function over(s) {
    let o = '';
    const cam = s._cam;
    if (cam && Math.sin(cam.yaw * Math.PI / 180) > .15) {
      const fr = 64 - 22 * (1 - s.open), sz = fr - 9 * s.open - 2, [x, y] = cam.P([25.8, SIGN_Y, sz + 3.2]);
      o += `<text x="${x.toFixed(1)}" y="${(y + 2.2).toFixed(1)}" text-anchor="middle" font-size="5.4" font-weight="800" letter-spacing=".2" fill="#fff4d6" font-family="Baloo 2, Plus Jakarta Sans, sans-serif" pointer-events="none">dâwr</text>`;
    }
    if (s.list) {
      const rows = s.list.map(([w, n]) => { const got = s.basket[w] || 0; return `<tspan x="-72" dy="10.5" ${got >= n ? 'fill="#2e7d32"' : ''}>${got >= n ? '✓ ' : ''}${w} · ${NUMBERS[n - 1]}${got && got < n ? ` (${got})` : ''}</tspan>`; }).join('');
      o += `<g pointer-events="none"><rect x="-77" y="-101" width="100" height="${15 + 11 * s.list.length}" rx="5" fill="#fff8e6" stroke="#e9d9ad"/>` +
        `<text x="-72" y="-92.5" font-size="7" font-weight="800" fill="#c2185b" font-family="Plus Jakarta Sans, sans-serif">Rova's list</text>` +
        `<text x="-72" y="-91.5" font-size="8" font-weight="800" fill="#15213a" font-family="Plus Jakarta Sans, sans-serif">${rows}</text></g>`;
    }
    if (s.say && s.sayT > 0 && cam) {
      const at = s.say.who === 'Rova' ? [ROVA_AT[0], ROVA_AT[1], 31] : [-15, -31, 35];
      const [x, y] = cam.P(at), w = s.say.word.length * 6 + 14, a = Math.min(1, s.sayT * 2);
      o += `<g pointer-events="none" opacity="${a.toFixed(2)}"><rect x="${x - w / 2}" y="${y - 22}" width="${w}" height="16" rx="8" fill="#fff" stroke="#231e16" stroke-width=".8"/>` +
        `<path d="M${x - 3} ${y - 6.5}L${x} ${y - 1}L${x + 3} ${y - 6.5}Z" fill="#fff" stroke="#231e16" stroke-width=".8"/>` +
        `<text x="${x}" y="${y - 11}" text-anchor="middle" font-size="10" font-weight="800" fill="#c2185b" font-family="Plus Jakarta Sans, sans-serif">${s.say.word}</text></g>`;
    }
    return o;
  }

  // ---------- labels ----------
  // The camera comes close to the scales for a moment when something is weighed, and to the tray while coins fly
  function focus(s) {
    if (s.coins.length) return { p: [TRAY[0], TRAY[1], TOP], zoom: 1.5 };
    if (s.onPan && s.t - s.panAt < 2.6) return { p: [BX, CY1 - 1, TOP + 8], zoom: 1.5 };
    return null;
  }

  const LABEL_GROUPS = ['Stall', 'Fruit', 'Vegetables', 'People'];
  function anchors(s) {
    const a = [], at = (part, p, g, n) => a.push({ part, p, g, n });
    const up = (w, dz) => { const p = spotOf(w); return [p[0], p[1], p[2] + dz]; };
    at('dâwr', [4, 0, 72], 'Stall'); at('mau', [16, CY1 + 4, 32], 'Stall'); at('dawhkân', [CX1, -12, TOP], 'Stall');
    at('puan', [CX1, 12, 9], 'Stall', [1, 0, 0]); at('khawnvâr', [4, 0, 54], 'Stall'); at('rit', [BX, CY1 - 1, TOP + 14], 'Stall');
    at('pawisa', [TRAY[0], TRAY[1], TOP + 2], 'Stall'); at('kawng', [46, -30, 0], 'Stall'); at('fawng', [FX, FRONT.alu, TOP + .5], 'Stall');
    at('buhfai', [22, -46, 13], 'Stall');
    for (const w of ['serthlum', 'theihai']) at(w, up(w, 9), 'Fruit');
    at('balhla', [20, -26, 49], 'Fruit');
    for (const w of ['zikhlum', 'mâi']) at(w, up(w, 9), 'Vegetables');
    for (const w of ['purun', 'hmarcha', 'bawkbawn', 'fanghma', 'alu', 'sawhthing']) at(w, up(w, 3), 'Vegetables');
    at('artui', [20, 46, 14], 'People'); at('sangha', [26.5, 46, 10], 'People');
    at('dâwrkai', [-15, -31, 33], 'People'); at('Rova', [ROVA_AT[0], ROVA_AT[1], 28], 'People'); at('êm', [BASKET_AT[0], BASKET_AT[1], 10], 'People');
    if (s.open < .5) return a.filter(x => !(x.part in BACK) && !(x.part in FRONT));
    return a;
  }

  function tap(s, part) {
    if (part === 'kho' && s.list) part = 'artui';   // tapping the egg basket while shopping buys an egg
    if (part === 'hnah' && s.list) part = 'sangha';
    s.last = ITEMS.includes(part) ? part : s.last;
    if (part === 'dâwrkai') { speak(s, 'seller', 'chibai'); return 'zuar'; }
    if (part === 'Rova') { speak(s, 'Rova', 'chibai'); s.cheer = 1; return 'chibai'; }
    if (part === 'rit') return s.onPan ? (WEIGHT[s.onPan] > 2 ? 'rit' : 'zâng') : null;
    // With a shopping list, tapping a thing buys one.
    if (s.list && s.open > .5 && ITEMS.includes(part)) { s.flying.push({ w: part, k: 0 }); s.reach = 1; return 'pawisa'; }
    if (['serthlum', 'theihai', 'balhla'].includes(part)) return 'thei';
    if (['alu', 'purun', 'hmarcha', 'zikhlum', 'mâi', 'bawkbawn', 'fanghma', 'sawhthing'].includes(part)) return 'thlai';
    return null;
  }

  function pay(s) {
    if (!s.list) return;
    const ok = s.list.every(([w, n]) => (s.basket[w] || 0) === n) && Object.keys(s.basket).every(w => s.list.some(([x]) => x === w));
    if (ok) {
      const n = s.list.reduce((t, [, c]) => t + c, 0);
      for (let i = 0; i < n; i++) s.coins.push({ k: -i * .18 });
      speak(s, 'seller', 'lawmthu');
      s.cheer = 1.4;
      s.list = null; s.basket = {};
    } else speak(s, 'seller', 'Not yet…');
    return ok;
  }

  return {
    id: 'bazar', name: 'Bazar dâwr', sub: 'a stall at the market',
    view: { yaw: 60, pitch: 30, box: '-80 -104 160 138', centre: [0, -32], ink: .7 },   // close in, so the stall fills a phone
    words: ['bazar', 'dâwr', 'dâwrkai', 'zuar', 'pawisa', 'thei', 'thlai', 'balhla', 'serthlum', 'theihai', 'alu', 'purun', 'hmarcha', 'fanghma',
      'zikhlum', 'mâi', 'bawkbawn', 'sawhthing', 'artui', 'kho', 'sangha', 'hnah', 'êm', 'fawng', 'buhfai', 'rit', 'zâng', 'lawmthu', 'chibai',
      'khawnvâr', 'mau', 'hrui', 'puan', 'dawhkân', 'kawng', 'tlai', 'hawng', 'khar', 'pakhat', 'pahnih', 'pathum'],
    names: { Rova: 'Rova, come to shop' },
    init, step, tint, scene, sky, over, anchors, tap, focus, labelGroups: LABEL_GROUPS,
    swatches: { label: 'Awning', key: 'awning', list: AWNINGS },
    actions: [
      { label: s => (s.list ? 'New list' : 'Go shopping'), word: () => null, run: s => newList(s) },
      { label: () => 'Pay', word: () => 'pawisa', ready: s => !!s.list && Object.keys(s.basket).length > 0, run: s => pay(s) },
      { label: s => (s.onPan ? 'Take it off' : 'Weigh it'), word: s => (s.onPan ? null : 'rit'), ready: s => !!s.onPan || !!s.last,
        run: s => { if (s.onPan) { s.onPan = null; s.tiltT = 0; } else { s.onPan = s.last; s.panAt = s.t; s.tiltT = Math.max(-1, Math.min(1, (WEIGHT[s.last] - 2) / 2)); } } },
      { label: s => (s.openT ? 'Close the stall' : 'Open the stall'), word: s => (s.openT ? 'khar' : 'hawng'), run: s => { s.openT = s.openT ? 0 : 1; } },
      { label: s => (s.duskT ? 'Daytime' : 'Evening'), word: s => (s.duskT ? null : 'tlai'), run: s => { s.duskT = s.duskT ? 0 : 1; } },
    ],
  };
})();
</script>
<script>
// La siam: making thread, drawn with Ink3D. Before a Mizo woman wove a puan she made the thread
// herself from the cotton (la) grown in the jhum field. Six steps stand in a row on a bamboo
// verandah, in the order they are done, and nu takes the cotton from one to the next:
//   1 herawt (cotton gin): turned by its handle (herawt ban), the rollers pull the fibres through
//     and the seeds (la mu) drop out on her side
//   2 lasai (cotton bow): its string (lasai thal), plucked with a striker, fluffs the cotton and
//     shakes the dust out; the fluff is rolled round a stick into lachawn
//   3 hmui (spinning wheel): the iron spindle (hmuithlur) twists the roll into thread (la zai)
//     and winds it into a cone
//   4 ladawhkilh (skein pegs): the thread is wound into a skein (lamuai), which is boiled in rice
//     starch water (buhhawp tui)
//   5 suvel (yarn swift): the dried skein goes round the turning cage and is wound into a ball
//   6 lazarna (warping posts): walking back and forth, she lays the warp (sutpui) round the
//     posts in a figure-eight cross, counting the threads and placing the colour stripes.
// The names and how each tool works come from the developer (loom_words.json).
const LA = (() => {
  const { box, ball, cyl, line, poly, group, mix } = Ink3D;
  const person = (at, dir, o) => Ink3DPeople.person(at, dir, o);
  const shade = c => ({ l: mix(c, '#ffffff', 0.3), m: c, d: mix(c, '#000000', 0.55) });

  const FLOOR = { l: '#e2c48a', m: '#c9a865', d: '#6b5428' }, SLAT = '#a88a4c';
  const BAMBOO = { l: '#d9e08a', m: '#b3ba62', d: '#5a5d2a' };
  const WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' }, DARK = { l: '#8a5a36', m: '#6b4429', d: '#33200f' };
  const CANE = { l: '#ecd08f', m: '#cfa862', d: '#6b5126' }, IRON = { l: '#a7a39c', m: '#7d7a76', d: '#3a3836' };
  const COTTON = { l: '#ffffff', m: '#f1ede4', d: '#a9a293' }, THREAD = '#fbf7ee', RED = '#c8323d';
  const MAT = '#d8b56a';
  // The six steps, from left to right as you look at them
  const Y = [50, 30, 10, -10, -30, -50];
  const STEPS = [
    { tool: 'herawt', label: 'Clean the cotton', parts: ['herawt', 'herawt ban'] },
    { tool: 'lasai', label: 'Fluff the cotton', parts: ['lasai', 'lasai thal'] },
    { tool: 'hmui', label: 'Spin the thread', parts: ['hmui', 'hmuithlur'] },
    { tool: 'ladawhkilh', label: 'Make a skein', parts: ['ladawhkilh', 'buhhawp tui'] },
    { tool: 'suvel', label: 'Wind a ball', parts: ['suvel'] },
    { tool: 'lazarna', label: 'Lay the warp', parts: ['lazarna'] },
  ];
  const LAST = STEPS.length - 1;
  const WORK = 3.4;            // seconds a step takes
  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const toward = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
  // A thread between two points hangs in a gentle curve; pulled tight it hangs less.
  const sag = (a, b, d = .8) => Array.from({ length: 7 }, (_, i) => { const u = i / 6, p = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]; p[2] -= Math.sin(u * Math.PI) * d; return p; });
  const ring = (c, r, z, n = 16) => Array.from({ length: n + 1 }, (_, i) => { const a = i / n * Math.PI * 2; return [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r, z]; });

  function init() { return { t: 0, step: 0, pos: 0, k: 0, working: false, done: STEPS.map(() => false), auto: false }; }
  // How far each step's work has gone (0 not started, 1 done)
  const kOf = (s, i) => (s.done[i] ? 1 : i === s.step ? s.k : 0);
  const on = (s, i) => s.working && s.step === i;
  function startWork(s) { if (!s.working && !s.done[s.step] && Math.abs(s.pos - s.step) < .05) s.working = true; }
  function next(s) { if (s.done[s.step] && s.step < LAST) { s.step++; s.k = 0; } }
  function step(s, dt) {
    s.t += dt;
    s.pos = toward(s.pos, s.step, dt * 1.1);           // nu walks to the next step
    if (s.working) {
      s.k = Math.min(1, s.k + dt / WORK);
      if (s.k >= 1) { s.working = false; s.done[s.step] = true; }
    }
    if (s.auto && s.done[s.step] && s.step < LAST && (s.wait = (s.wait || 0) + dt) > .5) { s.wait = 0; next(s); }
    if (s.auto && !s.working && !s.done[s.step]) startWork(s);
    if (s.done.every(Boolean)) s.auto = false;
    return true;
  }
  const tint = () => c => c;

  // ---------- the steps ----------
  // 1 Herawt: two hardwood rollers on an upright frame, turned by the handle
  function herawt(s) {
    const y = Y[0], k = kOf(s, 0), work = on(s, 0), a = work ? s.t * 7 : .6, out = [];
    const tip = [-4.5 + Math.cos(a) * 3.2, y + 8.2, 15.5 + Math.sin(a) * 3.2];
    out.push(group([
      box(-6, -3, y - 7, y - 5, 0, 18, { pal: WOOD }), box(-6, -3, y + 5, y + 7, 0, 18, { pal: WOOD }),
      box(-7, -2, y - 8, y + 8, 0, 2, { pal: DARK }),
      box(-6.5, -2.5, y - 7.5, y + 7.5, 18, 19.5, { pal: DARK }),
      line([[-4.5, y - 5, 15.5], [-4.5, y + 5, 15.5]], { col: WOOD.l, w: 2.2 }),
      line([[-4.5, y - 5, 13], [-4.5, y + 5, 13]], { col: WOOD.m, w: 2.2 }),
    ], { part: 'herawt' }));
    out.push(group([
      line([[-4.5, y + 7, 15.5], tip], { col: DARK.m, w: 1 }),
      line([tip, [tip[0], y + 10.5, tip[2]]], { col: WOOD.l, w: 1.4 }),
    ], { part: 'herawt ban' }));
    // A basket of raw cotton by her, getting emptier
    const left = Math.round(6 * (1 - k));
    const bk = [cyl([-12, y - 3], 0, 5, 3.4, 4.4, { pal: CANE, bands: [2.5], capFill: '#8a6a32' })];
    for (let i = 0; i < left; i++) { const p = [-12 + (i % 3 - 1) * 1.8, y - 3 + (i < 3 ? -1 : 1) * 1.4, 5.8 + (i > 2 ? .6 : 0)]; bk.push(ball(p, 1.4, { pal: COTTON }), ball([p[0] + .5, p[1], p[2] + .2], .35, { fill: '#6b4e2a', ink: false })); }
    out.push(group(bk, { part: 'lapua' }));
    // The seeds drop out on her side; the clean fibres come through on the far side
    if (k > 0) {
      const seeds = [];
      for (let i = 0; i < Math.round(14 * k); i++) seeds.push(ball([-9.5 + rnd(i, 1) * 3, y - 12 + rnd(i, 2) * 3, .5], .55, { fill: '#5a3f22', w: .3 }));
      out.push(group(seeds, { part: 'la mu', shadow: false }));
      const lint = [];
      for (let i = 0; i < Math.round(8 * k) + 1; i++) lint.push(ball([0 + rnd(i, 3) * 4, y - 4 + rnd(i, 4) * 8, 1.4 + rnd(i, 5) * 1.6], 1.6 + rnd(i, 6), { pal: COTTON }));
      out.push(group(lint, { part: 'la' }));
    }
    if (work) out.push(ball([-7.5, y - 6 - (s.t * 6 % 6) * .8, 13 - (s.t * 6 % 6) * 2], .5, { fill: '#5a3f22', w: .3, shadow: false }));
    return { out, hands: [[-6.5, y - 2 + Math.sin(s.t * 3), 14.5], tip] };
  }

  // 2 Lasai: a bamboo bow held in the heap of cotton; the string, plucked with a striker, fluffs it
  function lasai(s) {
    const y = Y[1], k = kOf(s, 1), work = on(s, 1), out = [];
    out.push(poly([[-8, y - 8, .05], [6, y - 8, .05], [6, y + 8, .05], [-8, y + 8, .05]], { fill: MAT, w: .6, part: 'la' }));
    // The cotton heap: lumpy before, soft and big after; once rolled into lachawn only a little is left
    if (s.done[0]) {
      const heap = [], n = s.done[1] ? 4 : 7 + Math.round(5 * k), r = s.done[1] ? 1 : 1 + .3 * k;
      for (let i = 0; i < n; i++) heap.push(ball([-2 + (rnd(i, 7) - .5) * 7, y + (rnd(i, 8) - .5) * 9, 1.2 + rnd(i, 9) * 1.6], (1.2 + .7 * rnd(i, 10)) * r, { pal: COTTON }));
      out.push(group(heap, { part: 'la' }));
    }
    // The bow, held low in the heap
    const lift = work ? Math.sin(s.t * 3) * .8 : 0, bz = 8 + lift, ends = [[-3, y - 9, bz], [-3, y + 9, bz]];
    const arc = Array.from({ length: 9 }, (_, i) => { const u = i / 8; return [-3 - Math.sin(u * Math.PI) * 3.5, y - 9 + 18 * u, bz + Math.sin(u * Math.PI) * 2.6]; });
    out.push(group([line(arc, { col: BAMBOO.m, w: 1.8 })], { part: 'lasai', shadow: false }));
    const pl = work ? Math.sin(s.t * 40) * 1.1 : 0, mid = [-3 + pl, y + 1, bz - .2];
    out.push(group([line([ends[0], mid, ends[1]], { col: '#7a6a55', w: .45 })], { part: 'lasai thal', shadow: false, bias: 2 }));
    // The little wooden striker in her hand
    const hand = [-5.5, y + 1.5, bz + 2.6 + (work ? Math.abs(Math.sin(s.t * 20)) * 1.2 : 0)];
    out.push(group([line([hand, [mid[0] - .8, mid[1], mid[2] + .6]], { col: DARK.m, w: .9 })], { part: 'lasai', shadow: false, bias: 3 }));
    if (work) for (let i = 0; i < 7; i++) {
      // Fluff flies up; dust and bits of leaf fall out
      const ph = (s.t * .9 + i / 7) % 1;
      out.push(ball([-1 + (rnd(i, 11) - .5) * 8, y + (rnd(i, 12) - .5) * 10, 4 + ph * 11], .7 + ph, { fill: '#ffffff', ink: false, opacity: .8 * (1 - ph), shadow: false }));
      const fall = (s.t * 1.4 + i / 7) % 1;
      out.push(ball([-2 + (rnd(i, 13) - .5) * 9, y + (rnd(i, 14) - .5) * 10, 3.5 * (1 - fall)], .3, { fill: '#7a5a32', ink: false, shadow: false }));
    }
    // Rolled round a thin stick into soft hollow rolls, ready to spin
    if (s.done[1]) {
      const rolls = [];
      for (let i = 0; i < 4; i++) { const yy = y - 5.5 + i * 3; rolls.push(line([[2.2, yy, .9], [5.6, yy, .9]], { col: '#fbf8f0', w: 1.6 }), ball([5.7, yy, .9], .3, { fill: '#cfc6b4', ink: false })); }
      out.push(group(rolls, { part: 'lachawn' }));
    }
    return { out, hands: [[ends[0][0], ends[0][1], ends[0][2] + .5], hand] };
  }

  // 3 Hmui: a low wheel on a heavy base; the cord loop turns the iron spindle, which twists the
  // roll into thread and winds it on in a cone
  function hmui(s) {
    const y = Y[2], k = kOf(s, 2), work = on(s, 2), out = [];
    const C = [-2, y - 3, 10], R = 6.5, turn = work ? s.t * 4 : .3;
    const rim = ring([0, 0], R, 0, 24).map(([a, b]) => [C[0], C[1] + a, C[2] + b]);
    const spokes = [];
    for (let i = 0; i < 8; i++) { const a = turn + i / 8 * Math.PI * 2; spokes.push(line([C, [C[0], C[1] + Math.cos(a) * R, C[2] + Math.sin(a) * R]], { col: WOOD.l, w: .6, ink: false })); }
    const crank = [C[0] - 1.6, C[1] + Math.cos(turn) * 2.4, C[2] + Math.sin(turn) * 2.4];
    // Turning fast, the spokes fade into a soft blur
    const blur = work ? [poly(rim.slice(0, -1), { fill: WOOD.l, ink: false, opacity: .35 })] : [];
    out.push(group([
      box(-6, 3, y - 9, y + 7, 0, 2, { pal: DARK }),
      box(-3, -1, y - 4, y - 2, 2, 10, { pal: WOOD }),
      ...blur, line(rim, { col: WOOD.m, w: 1.2 }), ...(work ? spokes.map(l => ({ ...l, opacity: .45 })) : spokes), ball(C, .9, { pal: DARK }),
      line([[C[0] - .6, C[1], C[2]], crank], { col: DARK.m, w: .8 }),
      box(-2.4, -1.2, y + 3, y + 4.2, 2, 5.6, { pal: WOOD }),
    ], { part: 'hmui' }));
    // The cord loop from the wheel to the spindle
    out.push(line([[C[0], C[1] + R * .2, C[2] + R], [-1.8, y + 4, 5.2], [C[0], C[1] + R * .2, C[2] - R]], { col: '#7a6a55', w: .3, ink: false, part: 'hmui' }));
    // The spindle, and the cone of thread on it
    const sp = [line([[-1.8, y + 3, 5.2], [-1.8, y + 9.5, 5.2]], { col: IRON.m, w: .9 })];
    if (k > 0) [[5.6, 1], [6.8, .72], [8, .42]].forEach(([dy, f]) => sp.push(ball([-1.8, y + dy, 5.2], (.5 + 1.4 * k) * f, { pal: COTTON })));
    out.push(group(sp, { part: 'hmuithlur' }));
    // The thread runs from the spindle's tip to her left hand, which draws back with the lachawn
    let hand = [-7, y + 10, 8];
    if (s.done[1]) {
      if (work) { const d = s.t * .8 % 1; hand = [-7 - d * 3, y + 10.5, 8 + d * 2]; }
      out.push(group([line(sag([-1.8, y + 9.5, 5.2], hand, work ? .15 : .9), { col: THREAD, w: .35, ink: false })], { part: 'la zai', shadow: false, bias: 3 }));
      if (k < 1) out.push(group([line([hand, [hand[0] - 2.5, hand[1] + .5, hand[2] + .4]], { col: '#fbf8f0', w: 1.6 })], { part: 'lachawn', shadow: false, bias: 4 }));
    }
    return { out, hands: [hand, crank] };
  }

  // 4 Ladawhkilh: the thread is wound round upright pegs into a skein (lamuai), then boiled in
  // rice starch water (buhhawp tui)
  const POT = [6, Y[3] + 4];
  function ladawhkilh(s) {
    const y = Y[3], k = kOf(s, 3), work = on(s, 3), out = [];
    const wind = Math.min(1, k / .6), boiled = k >= .6;
    out.push(group([
      box(-7, 1, y - 6, y + 6, 0, 1.4, { pal: DARK }),
      cyl([-3, y - 4.5], 1.4, 11, .6, .5, { pal: WOOD }), cyl([-3, y + 4.5], 1.4, 11, .6, .5, { pal: WOOD }),
    ], { part: 'ladawhkilh' }));
    if (wind > 0 && !boiled) {
      const loop = [[-3.8, y - 4.5, 9], [-3.8, y + 4.5, 9], [-2.2, y + 4.5, 9], [-2.2, y - 4.5, 9], [-3.8, y - 4.5, 9]];
      out.push(group([line(loop, { col: THREAD, w: .5 + 1.6 * wind })], { part: 'lamuai', bias: 2 }));
    }
    // The cone from the spindle, getting smaller as it unwinds
    const cone = [-8, y + 6, 1.2];
    if (s.done[2] && k < .6) out.push(group([ball(cone, 1.6 * (1 - .6 * wind) + .3, { pal: COTTON }), line(sag(cone, [-3, y + (Math.sin(s.t * 5) > 0 ? 4.5 : -4.5), 9], .5), { col: THREAD, w: .3, ink: false })], { part: 'la zai' }));
    // The pot of rice water on its stones; the skein soaks in it
    const stone = shade('#8f8a80');
    out.push(group([ball([POT[0] - 2.4, POT[1] - 2.4, .8], 1.2, { pal: stone }), ball([POT[0] + 2.4, POT[1] - 2.2, .8], 1.2, { pal: stone }), ball([POT[0], POT[1] + 3, .8], 1.2, { pal: stone }),
      cyl(POT, 1.2, 7.2, 3.6, 3.2, { pal: shade('#8a5a36'), capFill: '#f2eee2' })], { part: 'buhhawp tui' }));
    if (boiled && !(s.done[3] && kOf(s, 4) > 0)) out.push(group([line(ring(POT, 2, 7.4, 14), { col: THREAD, w: 1.6 })], { part: 'lamuai', bias: 3 }));
    if (work && boiled) for (let i = 0; i < 4; i++) { const ph = (s.t * .7 + i / 4) % 1; out.push(ball([POT[0] + (rnd(i, 15) - .5) * 3, POT[1] + (rnd(i, 16) - .5) * 3, 8 + ph * 9], .8 + ph * 1.4, { fill: '#ffffff', ink: false, opacity: .55 * (1 - ph), shadow: false })); }
    const a = s.t * 5;
    return { out, hands: work && !boiled ? [[-3 + Math.cos(a) * 1.5, y + Math.sin(a) * 4.5, 9.5], [-6, y + 5, 7]] : [[POT[0] - 3, POT[1], 9], [-4, y, 10]] };
  }

  // 5 Suvel: a bamboo cage that turns on an upright pivot; the skein goes round it and is wound into a ball
  function suvel(s) {
    const y = Y[4], k = kOf(s, 4), work = on(s, 4), out = [];
    const C = [-1, y], turn = work ? s.t * 3 : .4, r = 3.6;
    const cage = [cyl(C, 0, 15, .6, .5, { pal: WOOD }), box(-4, 2, y - 3, y + 3, 0, 1, { pal: DARK })];
    for (let i = 0; i < 6; i++) { const a = turn + i * Math.PI / 3; cage.push(line([[C[0] + Math.cos(a) * r, C[1] + Math.sin(a) * r, 7], [C[0] + Math.cos(a) * r, C[1] + Math.sin(a) * r, 14]], { col: BAMBOO.m, w: 1 })); }
    cage.push(line(ring(C, r, 7, 12), { col: BAMBOO.d, w: .7 }), line(ring(C, r, 14, 12), { col: BAMBOO.d, w: .7 }));
    out.push(group(cage, { part: 'suvel' }));
    // The skein round the cage, thinner as it winds off
    if (s.done[3] && k < 1) out.push(group([line(ring(C, r + .3, 10.5, 16), { col: THREAD, w: .5 + 1.8 * (1 - k) })], { part: 'lamuai', bias: 2 }));
    // The ball in her hand grows; then it sits on the floor, ready for the warp and the shuttle
    const bh = work ? [-7.5 + Math.cos(s.t * 6) * .8, y + 5, 9 + Math.sin(s.t * 6) * .8] : k >= 1 ? [-6, y + 6, 1.6] : [-7.5, y + 5, 9];
    if (k > 0) {
      out.push(group([ball(bh, .5 + 1.2 * k, { pal: COTTON })], { part: 'la zai', bias: 4 }));
      if (k < 1) out.push(line(sag(bh, [C[0] - r, C[1] + 1, 10.5], work ? .1 : .7), { col: THREAD, w: .3, ink: false, part: 'la zai' }));
    }
    return { out, hands: [[bh[0] - .5, bh[1] - 1, bh[2]], [bh[0] - .5, bh[1] + 1, bh[2]]] };
  }

  // 6 Lazarna: posts on a long beam, as far apart as the puan is long. Walking back and forth she
  // lays the thread round them, crossing it between the middle pair (the cross the kaihbu holds later)
  const LZ = [-7, 1, 4, 18];
  function lazarna(s) {
    const y = Y[5], k = kOf(s, 5), work = on(s, 5), out = [];
    out.push(group([box(-9, 20, y - 1.5, y + 1.5, 0, 1.6, { pal: DARK }), ...LZ.map(x => cyl([x, y], 1.6, 10, .55, .45, { pal: BAMBOO }))], { part: 'lazarna' }));
    const n = Math.round(k * 16), warp = [];
    for (let i = 0; i < n; i++) {
      const z = 3 + i * .38, c = i % 2 ? .7 : -.7, red = i >= 6 && i < 9;   // a few red threads make a stripe
      warp.push(line([[LZ[0], y, z], [LZ[1], y + c, z], [LZ[2], y - c, z], [LZ[3], y, z]], { col: red ? RED : THREAD, w: .35, ink: false }));
    }
    if (warp.length) out.push(group(warp, { part: 'sutpui', bias: 2, shadow: false }));
    // She walks the thread from end to end: where is she now?
    const u = work ? .5 - .5 * Math.cos(s.t * 1.6) : 0, x = -12 + 26 * u;
    if (work) out.push(line(sag([x + 1.5, y + 4, 7], [Math.sin(s.t * 1.6) > 0 ? LZ[3] : LZ[0], y, 3 + n * .38], .6), { col: THREAD, w: .3, ink: false, part: 'la zai' }));
    return { out, walkX: x, back: work && Math.sin(s.t * 1.6) < 0, hands: [[x + 1.5, y + 3.6, 7], [x + 1.5, y + 4.4, 7]] };
  }
  const STATIONS = [herawt, lasai, hmui, ladawhkilh, suvel, lazarna];

  // ---------- nu, who does the work ----------
  const NU = { h: 25, shirt: { l: '#f48fb1', m: '#e0457b', d: '#7a1f43' }, lower: 'skirt', lowerPal: shade('#2a2522'), bands: [.24, .32, .4], hair: '#1d1b22', bun: true };
  function nu(s, st) {
    const i = Math.round(s.pos), between = Math.abs(s.pos - i) > .02, y = Y[0] + (Y[LAST] - Y[0]) * s.pos / LAST + 4;
    if (between) return [group(person([-15, y, 0], -Math.PI / 2, { ...NU, pose: 'walk', phase: s.t * 7, t: s.t }), { part: 'nu' })];
    const S = st[i];
    if (i === LAST && on(s, LAST)) return [group(person([S.walkX, Y[LAST] + 5, 0], S.back ? Math.PI : 0, { ...NU, pose: 'walk', phase: s.t * 5, t: s.t, hands: S.hands }), { part: 'nu' })];
    return [group(person([-15, y, 0], 0, { ...NU, pose: i <= 2 || i === 4 ? 'sit' : 'stand', hands: S.hands, t: s.t }), { part: 'nu' })];
  }

  function scene(s) {
    const slats = [];
    for (let x = -24; x < 24; x += 3) slats.push({ pts: [[x, -60, .02], [x, 60, .02]], stroke: SLAT, open: true });
    const deck = box(-26, 26, -62, 62, -5, 0, { pal: FLOOR, part: 'chhuat', decals: { zp: slats }, shadow: false });
    // A low bamboo railing along the back edge of the verandah
    const posts = [-59, -39, -20, 0, 20, 39, 59].map(y => cyl([-24.5, y], 0, 9, .9, .8, { pal: BAMBOO, bands: [4.5] }));
    const rails = [5, 8.4].map(z => line([[-24.5, -59, z], [-24.5, 59, z]], { col: BAMBOO.m, w: 1.3 }));
    const railing = group([...posts, ...rails], { part: 'mau', bias: -20 });
    const st = STATIONS.map(f => f(s));
    return {
      ground: [deck], groundDecals: [], clip: [[-26, -62, 0], [26, -62, 0], [26, 62, 0], [-26, 62, 0]],
      items: [railing, ...st.flatMap(x => x.out), ...nu(s, st)],
    };
  }

  // ---------- the hills and the cotton field behind ----------
  function sky() {
    let o = '<defs><linearGradient id="lasky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d8f5"/><stop offset="1" stop-color="#fff1d6"/></linearGradient></defs>';
    o += '<rect x="-140" y="-140" width="280" height="260" fill="url(#lasky)"/>';
    const hill = (y, amp, col, ph) => `<path d="M-140 60${Array.from({ length: 29 }, (_, i) => { const x = -140 + i * 10; return `L${x} ${(y + Math.sin(x / 38 + ph) * amp).toFixed(1)}`; }).join('')}L140 60Z" fill="${col}"/>`;
    o += hill(-70, 8, '#b5dcc0', .5) + hill(-56, 6, '#98cba6', 2);
    // A jhum field of cotton on the slope: little white bolls on green
    for (let i = 0; i < 46; i++) { const x = -136 + rnd(i, 21) * 95, y = -46 + rnd(i, 22) * 22; o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.3" fill="#ffffff" opacity=".9"/>`; }
    return o;
  }
  // The six steps along the top: done, now, to come. The names sit on two lines, turn about.
  function over(s) {
    let o = '<g pointer-events="none" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">' +
      '<rect x="-66" y="-91.5" width="132" height="32" rx="9" fill="#fffdf6" opacity=".82"/>';
    STEPS.forEach((st, i) => {
      const x = -55 + i * 22, done = s.done[i], now = i === s.step;
      if (i < LAST) o += `<path d="M${x + 7} -82H${x + 15}" stroke="#231e16" stroke-width=".7" stroke-dasharray="1.5 1.5"/>`;
      o += `<circle cx="${x}" cy="-82" r="6.5" fill="${done ? '#43a047' : now ? '#ffc94a' : '#ffffff'}" stroke="#231e16" stroke-width=".8"/>`;
      o += `<text x="${x}" y="-79.3" font-size="7" fill="${done ? '#ffffff' : '#231e16'}">${done ? '✓' : i + 1}</text>`;
      o += `<text x="${x}" y="${i % 2 ? -64 : -70}" font-size="5.4" fill="${now ? '#c2185b' : '#5d5547'}">${st.tool}</text>`;
    });
    return o + '</g>';
  }

  // ---------- labels ----------
  const LABEL_GROUPS = ['Tools', 'Cotton'];
  function anchors(s) {
    const a = [], T = (part, p) => a.push({ part, p, g: 'Tools' }), C = (part, p) => a.push({ part, p, g: 'Cotton' });
    T('herawt', [-4.5, Y[0] - 3, 19.5]); T('herawt ban', [-4.5, Y[0] + 10, 15.5]);
    T('lasai', [-6, Y[1] - 4, 10]); T('hmui', [-2, Y[2] - 3, 16.5]); T('hmuithlur', [-1.8, Y[2] + 8, 5.5]);
    T('ladawhkilh', [-3, Y[3] - 4.5, 11]); T('buhhawp tui', [POT[0], POT[1], 7.2]); T('suvel', [-1, Y[4], 15]);
    T('lazarna', [18, Y[5], 10]);
    C('lapua', [-12, Y[0] - 3, 7]);
    if (kOf(s, 0) > 0) { C('la mu', [-8, Y[0] - 10.5, .8]); C('la', [2, Y[0], 3.5]); }
    C('lasai thal', [-3, Y[1] + 5, 8]);
    if (s.done[1]) C('lachawn', [4, Y[1] + 1, 1.2]);
    if (kOf(s, 2) > 0) C('la zai', [-1.8, Y[2] + 6, 7]);
    if (kOf(s, 3) > 0 && !(s.done[3] && kOf(s, 4) > 0)) C('lamuai', kOf(s, 3) >= .6 ? [POT[0], POT[1], 7.6] : [-3, Y[3], 9.5]);
    else if (s.done[3] && kOf(s, 4) < 1) C('lamuai', [-1, Y[4] + 3.9, 10.5]);
    if (kOf(s, 5) > 0) C('sutpui', [11, Y[5], 3 + Math.round(kOf(s, 5) * 16) * .38]);
    a.push({ part: 'nu', p: [-15, Y[0] + (Y[LAST] - Y[0]) * s.pos / LAST + 4, 26], g: 'Tools' });
    return a;
  }

  // The camera follows nu while she works or walks, and steps back when she waits or is done
  function focus(s) {
    if (!(s.working || s.auto || Math.abs(s.pos - s.step) > .02)) return null;
    const y = Y[0] + (Y[LAST] - Y[0]) * s.pos / LAST;
    return { p: [s.pos > LAST - .5 ? 4 : -3, y, 15], zoom: 1.75 };
  }

  function tap(s, part) {
    // Tapping the tool nu is at sets it to work.
    if (STEPS[s.step].parts.includes(part)) { startWork(s); return null; }
    if (part === 'nu') return 'la';
    return null;
  }

  return {
    id: 'la', name: 'La siam', sub: 'making thread from cotton',
    view: { yaw: 58, pitch: 30, box: '-84 -92 168 136', centre: [0, -30], ink: .7 },
    words: ['la', 'lapua', 'la mu', 'herawt', 'herawt ban', 'lasai', 'lasai thal', 'lachawn', 'hmui', 'hmuithlur', 'la zai', 'ladawhkilh', 'lamuai', 'buhhawp tui', 'suvel', 'lazarna', 'sutpui', 'nu', 'mau', 'chhuat'],
    init, step, tint, scene, sky, over, anchors, tap, focus, labelGroups: LABEL_GROUPS,
    swatches: null,
    actions: [
      { label: s => (s.working ? STEPS[s.step].label + '…' : s.done[s.step] ? 'Done' : STEPS[s.step].label), word: s => STEPS[s.step].tool,
        ready: s => !s.working && !s.done[s.step] && Math.abs(s.pos - s.step) < .05, run: s => startWork(s) },
      { label: () => 'Next step', word: () => null, ready: s => s.done[s.step] && s.step < LAST, run: s => next(s) },
      { label: s => (s.auto ? 'Stop' : 'Do it all'), word: () => null, ready: s => !s.done.every(Boolean), run: s => { s.auto = !s.auto; } },
      { label: () => 'To the loom', word: () => 'sutpui', ready: s => s.done.every(Boolean), run: () => { location.hash = '#loom'; } },
      { label: () => 'Start again', word: () => null, run: s => Object.assign(s, init()) },
    ],
  };
})();
</script>
<script>
// Kumtluang: a year of life in an old Mizo village as one long scroll, January at the left end and
// December at the right, drawn with Ink3D. Drag (or play the year) to move through it: each month has its own
// scene, as the months' notes tell, and the sky, the weather and the grass change smoothly between them. The
// forest is cut (February) and dries while the village dances Chapchar Kut (March); the field is burnt and
// sown (April), sprouts in the first rain (May), is weeded in the rains (June); the yards turn to mud
// (July); the rice stands in the mist (August); the first crops are set out at Mim Kut (September); the
// village feasts at Khuangchawi (October), harvests (November) and threshes by the hearth (December), and the
// children feast at Pâwlkut (January). The picture tells it: at the top only the month's name, in English
// and Mizo; tap anyone or anything to see its name there. (The months' notes stay in MONTHS, for reference.)
// Words that are not in the Hnahsin content come from zonun_words.json.
const ZONUN = (() => {
  const { hexa, ball, cyl, line, poly, group, solid, spot, mix } = Ink3D;

  const WALL = { l: '#e9cf98', m: '#cdb070', d: '#7d6236' }, WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' }, POST = { l: '#9a6a40', m: '#7a5230', d: '#3e2918' };
  const EARTH = { l: '#c99a6b', m: '#a8774b', d: '#5a3d26' }, LEAF = { l: '#86c86e', m: '#5fa451', d: '#2f5a28' }, DARK_LEAF = { l: '#6fb35e', m: '#4c8c44', d: '#244a22' };
  const DRY_LEAF = { l: '#c9b06a', m: '#a88d4c', d: '#5a4a24' }, BARK = { l: '#9b7350', m: '#7a5636', d: '#3b2817' }, STONE = { l: '#c4c0b8', m: '#99948c', d: '#4a4743' };
  const THATCH = { l: '#e2c27a', m: '#c4a25a', d: '#6b5626' }, CANE = { l: '#e8c584', m: '#c9a05a', d: '#6b5126' }, IRON = { l: '#8d8a86', m: '#5a5754', d: '#2d2b29' };
  const HEN = { l: '#e39a57', m: '#c0733a', d: '#5c3417' }, PIG = { l: '#f7c1cb', m: '#e99aab', d: '#7a3f4c' }, DOG = { l: '#d9b98a', m: '#b8915e', d: '#5c4426' };
  const GOLD = { l: '#f2d36b', m: '#d9b13d', d: '#7a6018' }, DRUM = { l: '#d9a066', m: '#b0763e', d: '#55361d' }, SKIN_TOP = '#f1e3c4';
  const INSIDE = '#3a2c22', WATER = '#8cc5ee', BAMBOO = '#a3b55a', FLAME = ['#ffd84a', '#ff9a3c', '#e2483d'];

  // The people of the village, dressed as in old times: puan skirts and plain cloths
  const HAIR = '#1d1b22', GREY = '#cfcac2', PUAN = { l: '#d9474f', m: '#b8343d', d: '#5c1a1f' }, DARK = { l: '#5a5f6b', m: '#41454f', d: '#1f2128' };
  const WHITE = { l: '#fbf7ee', m: '#e6e0d2', d: '#8f887a' }, INDIGO = { l: '#7a8be0', m: '#4f5fc0', d: '#1f2660' };
  const NU = { h: 22, shirt: { l: '#f4e7d0', m: '#dccbb0', d: '#6d604c' }, lower: 'skirt', lowerPal: PUAN, bands: [0.24, 0.32, 0.4], hair: HAIR, bun: true };
  const PA = { h: 24, shirt: WHITE, lower: 'shorts', lowerPal: DARK, hair: HAIR };
  const PI = { h: 21, shirt: { l: '#e9e4f5', m: '#c9c0e0', d: '#5c5478' }, lower: 'skirt', lowerPal: { l: '#5f8f6a', m: '#3f6f4c', d: '#1d3524' }, bands: [0.2, 0.28], hair: GREY, bun: true };
  const PU = { h: 23, shirt: { l: '#f4efe4', m: '#d8d0bf', d: '#6d6556' }, lower: 'shorts', lowerPal: { l: '#7a6a58', m: '#5c4e40', d: '#2c241c' }, hair: GREY };
  const NAUPANG = { h: 14, shirt: { l: '#ffe08a', m: '#f2b431', d: '#6b4d12' }, lower: 'shorts', lowerPal: DARK, hair: HAIR };
  const NAUPANG2 = { h: 13, shirt: { l: '#f4e7d0', m: '#dccbb0', d: '#6d604c' }, lower: 'skirt', lowerPal: INDIGO, hair: HAIR, ponytail: true, tie: '#e0457b' };
  const NULA = { h: 21, shirt: { l: '#fff3b0', m: '#f2d36b', d: '#7a6420' }, lower: 'skirt', lowerPal: PUAN, bands: [0.2, 0.26, 0.32, 0.38], hair: HAIR, bun: true };
  const NULA2 = { h: 21, shirt: WHITE, lower: 'skirt', lowerPal: { l: '#3f3f4a', m: '#26262e', d: '#101014' }, bands: [0.22, 0.3, 0.38], hair: HAIR, bun: true };
  const TLANGVAL = { h: 24, shirt: WHITE, lower: 'shorts', lowerPal: { l: '#5a5f6b', m: '#2c2f36', d: '#121418' }, hair: HAIR };
  const LAL = { h: 25, shirt: { l: '#f7f2e6', m: '#e2d8c2', d: '#7a6f5a' }, lower: 'skirt', lowerPal: PUAN, bands: [0.2, 0.3, 0.4], hair: HAIR };

  // ---------- the months: their names, the notes on them (Mizo, then English), and how each one looks ----------
  // lo: what the jhum field is like · h: how tall the rice stands · rain, mist, haze: 0–1 · cold: a fire is lit ·
  // kut: the festival held at the square · at: the place to walk to for this month's main work
  const MONTHS = [
    { n: 'Pâwlkut', en: 'January', title: 'The Month of the Straw Festival', lo: 'pawl', cold: true, kut: 'pawlkut', at: 'kawtchhuah',
      sky: ['#a9cbe6', '#eef3f6'], grass: 'dry',
      life: 'Fur leh favang rim taka hna an thawh hnuah, buh leh thlai a lo thar fel a. Khawtlangin hlim takin "Pâwlkut" an hmang ṭhin. Naupang leh puitling an hlim tlang hle.',
      work: 'Buh zêm thiah, buh in lama phurh luh (buh runpui), leh kum thar tana inbuatsaihna hun a ni.',
      lifeEn: 'The harvest is fully gathered after months of hard labor during the monsoon and autumn. The community celebrates "Pâwlkut," a festival marking the abundance of grain and straw. It is a joyful time filled with feasts, especially for children and families.',
      workEn: 'Threshing grain, transporting rice to the village granaries (Buh Runpui), and preparing for the upcoming agricultural cycle.' },
    { n: 'Ramtuk', en: 'February', title: 'The Month of Preparing the Land', lo: 'ngaw', cold: true, at: 'lo',
      sky: ['#9fcdee', '#eaf5fc'], grass: 'dry',
      life: "Khua a vawt a reh ṭan a, thlasik a kiang chho ṭan. Ram thar (lo thar tur) tura tlangval leh mipuite an chhuah huk ṭhin avangin 'Ramtuk' tiin an vuah a ni.",
      work: 'Lo vah hnatlang a kal chho a. Thingzar sat thluin ram hnuai hna rim takin an thawk ṭan.',
      lifeEn: "The winter cold begins to fade as spring approaches. The village comes alive as men head out to the forests to clear new land for cultivation, which gives the month its name, 'Ramtuk'.",
      workEn: 'Clearing the jungle and cutting down trees (Lo vah) for the new Jhum fields. This is done through community work or helping one another.' },
    { n: 'Vau', en: 'March', title: 'The Month of the Vau Flower', lo: 'vah', bloom: true, kut: 'chapchar', at: 'kawtchhuah',
      sky: ['#8fd3ff', '#e3f4ff'], grass: 'dry',
      life: 'Vaube par leh thinghnah no a chhuak a, khua a lum chho ṭan. He thla hi Mizo kut pui ber "Chapchar Kut" hman thla a ni a, nula leh tlangval zai leh lamin kawtchhuah an khat ṭhin.',
      work: 'Lo vah hnuhnung buatsaih leh lo vah tawh sa ni sa hnuaia phorona hun a ni.',
      lifeEn: 'The Vaube orchid blooms beautifully across the hills, and the weather turns warmer. This is the month of "Chapchar Kut," the grandest Mizo festival. The village breaks into celebration with traditional dances and songs at the public squares.',
      workEn: 'Finishing the clearing of the jungle and leaving the felled trees and brush to dry thoroughly under the hot spring sun.' },
    { n: 'Ṭau', en: 'April', title: 'The Month of the Tau Fruit', lo: 'hal', haze: 0.8, wind: 1, at: 'lo',
      sky: ['#c9c0a2', '#f3dcb2'], grass: 'dry',
      life: 'Hmuntau a hmin hun a ni a, boruak a hul ṭha tawh hle.',
      work: 'Lo hal thla a ni. Lo an hal zawhin kangfai an theh a, buh chi tuh (chi phûm) hna khawtlangin an ṭan nghal ṭhin.',
      lifeEn: 'The wild Tau fruit matures, and the weather becomes very dry and windy.',
      workEn: 'Burning the dried Jhum fields (Lo hal). After the burning, the ashes are cleared away, and the entire village joins in sowing the rice seeds (Buh tuh) into the soil.' },
    { n: 'Ṭomir', en: 'May', title: 'The Month of Early Rains', lo: 'tiak', h: 0.12, rain: 0.35, at: 'lo',
      sky: ['#8fb4d2', '#dbe8f0'], grass: 'green',
      life: 'Ruahtui ṭo a lo tla ṭan a, thlai chin hrang hrang leh lo vah sa hnuai aṭangin chawm a lo ṭo chhuak ṭan.',
      work: 'Buh hmun tifai tura lo kal zut zut leh hlo thlawh hmasak ber tura inbuatsaih hun a ni.',
      lifeEn: 'The early monsoon showers arrive, bringing life back to the burnt hillsides. The newly planted crops and wild vegetation begin to sprout simultaneously.',
      workEn: 'Clearing weeds around the young rice plants and monitoring the Jhum fields as the first heavy weeding season approaches.' },
    { n: 'Nikir', en: 'June', title: 'The Month of the Solstice', lo: 'hring', h: 0.4, rain: 0.8, at: 'lo',
      sky: ['#7f99ae', '#c9d5dd'], grass: 'green',
      life: 'Ni a sei ber a (Summer Solstice), khua a lum vawrtap bawk. Ruah a sur nasa chho ṭan.',

    khua: "A Lushai village sat on a ridge, for the cool air and to be hard to attack, inside a stockade of timber (kulh) with sharp bamboo spikes outside it. Through the gate the street climbs to the open space at the top: the chief's house on one side, the zawlbuk opposite. The houses all face the street, with small gardens behind. Zokhua at Falkawn, near Aizawl, was built in 1992 to show such a village.",

  function roof(T, x0, x1, e, ze, ridge, hump, pal, part) {

    if (o.window) side.push({ pts: [[-L * 0.3, W + 0.12, FL + 7], [-L * 0.3 + 7, W + 0.12, FL + 7], [-L * 0.3 + 7, W + 0.12, FL + 12], [-L * 0.3, W + 0.12, FL + 12]], fill: INSIDE, part: 'tukverh' });
    if (o.cut) out.push(rbox(T, -L, wallEnd, -W, W, FL, FL + 4, { pal: WALL, part, skip: ['zp', 'zn'] }));   // cut away, to look inside
