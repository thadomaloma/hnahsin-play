  const NOTES = {"kawngvawn": "A strong strap of hide or cord round the weaver's back; leaning back pulls the warp tight.", "themkhawl": "The bar right in front of the weaver: the woven cloth rolls onto it, and the backstrap ties to it.", "thempui": "A long flat stick, thin and a little sharp, that beats each new row of weft tight.", "thembupui": "A wide flat bamboo bar that parts the upper and lower warp threads, opening the way for the shuttle.", "hnahchawi": "A thin straight rod tied with loops to every other warp thread; lifting it lifts them, so the threads cross.", "themte": "Thin rods added past the heddle to raise threads for the puan's design; four to seven for a fine pattern.", "tuirek": "A comb of bamboo or wood that keeps the warp threads evenly spaced.", "khawhtlang": "A slim stick with the weft wound on it, passed back and forth through the open shed.", "themtlang": "The big bar at the far end, tied to a wall or post, that holds every warp thread.", "kaihbu": "Two thin split bamboos near the warp beam that keep the warp threads from tangling.", "la": "Cotton grown in the jhum field, made into thread by hand before any weaving.", "lapua": "The cotton bolls picked from the plant and dried in the sun, with the seeds still inside.", "la mu": "The hard seeds, too big to pass between the gin's rollers; they drop out on the weaver's side.", "herawt": "Two hardwood rollers on an upright frame, geared together by carved spiral grooves. The cotton fibres are pulled through the gap; the seeds stay behind.", "lasai": "A strip of mature bamboo bent into an arch with a tight string. Held in the heap and plucked, it shakes the clumps into soft, airy fluff and the dust out.", "lasai thal": "The bow's tight cord, twisted from tough bark fibre or cane. Plucked with a little wooden striker, it buzzes \"per ri tek tek\".", "lachawn": "A handful of the fluffed cotton rolled round a thin bamboo stick into a soft hollow roll, ready to spin.", "hmui": "A low wheel on a heavy wooden base, used sitting on the floor. The right hand turns the wheel; a cord loop drives the spindle.", "hmuithlur": "The sharp, thin iron spindle. It twists the cotton into thread, then the thread is wound onto it into a full cone.", "la zai": "The cotton spun into a long, strong strand.", "ladawhkilh": "Upright wooden pegs. The thread from the spindle is wound round them into loose skeins (lamuai), so water, dye and starch reach every part.", "suvel": "A bamboo cage that turns on an upright pivot. The dried skein goes round it, and as the thread is pulled the cage spins, so it winds into a ball without tangling.", "lazarna": "Posts set apart as long as the puan will be. Walking back and forth, the weaver lays the starched thread round them in a figure-eight cross, counting each thread and placing the colour stripes.", "sutpui": "The long threads of the puan, laid out on the lazarna; the cross is later held by the kaihbu, and the warp goes onto the themkhawl and themtlang.", "buhhawp tui": "Thick rice water. The skeins are boiled in it, so the starch coats the thread and it does not fray or break on the loom; then they dry in the sun.", "eng": "The colour of turmeric and ripe rice; a bright thread in many puans.", "puanchei": "White, with red and black stripes and rows of patterns in green, yellow and black: sakei ha (tiger's teeth), disul (sungrass in the wind), kawkpuizikzial (the fern shoot), lenbuangthuam (forked branches) and fanghma mu. Once called \"Puan Lallukhum\". Worn at the big festivals, for the Cheraw (bamboo dance), and by a bride.", "pawndum": "Black, with bold red, yellow and white stripes across. A puan of mourning and of love for life: a bride takes one into marriage as her zawlken puan (\"I will cover you all your life, and wrap you in this at your death\"), and people bring one when someone dies, to share the family's sorrow.", "ngotekherh": "White and black. \"Ngo\" is white, and \"kherh\" the black lines woven both ways into a grid, with a wide black band in the middle (puanhruikhau). Once only for chiefs' and rich families; now men and women both wear it at festivals and big days.", "hmaram": "Deep indigo-black, dyed with ting (Assam indigo), with fine white patterns: fern shoots (kawkpuizikzial), stars and small flower borders. A short wrap worn by girls and young women, from the waist to the calves. A girl who could weave her own was counted a grown woman.", "tawlhlohpuan": "\"Tawlh lo\" means never stepping back. Black, with bold red, white and yellow stripes in the middle and sawtooth edges beside them. Once worn only by pasalṭha, the bravest warriors who never ran from a fight; now given to honour people who served the land.", "herawt ban": "The crank that turns the gin's rollers in opposite directions.", "lamuai": "A loose loop of thread, bundled so it can be boiled, dyed with ting or starched without tangling.", "hlo": "Weeds that grow up among the rice. Hlo thlawh, weeding, is the hardest work of June and July.", "buk": "A hut on posts in the jhum field. In August people sleep in it (buk riah) to guard the rice from wild animals and birds.", "sava hlauh": "Set up in the field to frighten the birds away from the rice.", "pher": "A woven mat: the paddy is beaten (vua) on it to thresh it.", "thlei": "To toss the grain in a flat basket, so the light husks blow away.", "tiak": "What the rice and the jungle do when the first rains come in May.", "tapchhak": "The fireplace in the house, where the family sit in the cold months.", "hal": "Lo hal: burning the dried jhum in April, before the sowing.", "buh in": "The house where the harvested paddy is kept.", "pâwl": "What is left of the rice in the field after the harvest. Pâwlkut and Pâwltlak are named for it. (From the notes on the months)", "lal in": "The biggest house in the village, built for the chief by his villagers, beside the open space at the top of the village. A passage runs along one side past small rooms for his married followers to a big room with several hearths; at the back is a verandah, the bāzāh, kept for the chief's family.", "zawlbuk": "The bachelors' hall, built by all the men of the village opposite the chief's house. The young men gather there in the evening to sing and tell stories, and sleep there; the boys keep it supplied with firewood. Inside is one big room with a square hearth in the middle and a sleeping platform across the far end. The village's mithun spend the night under its raised floor.", "khawnbawl": "One of the chief's ministers. Their houses stand near the chief's.", "khawnbawl in": "The house of one of the chief's advisers: bigger than an ordinary house, and near the chief's.", "upa": "The elders the chief chooses as his council. They meet in the chief's house of an evening to settle the village's disputes.", "thirdeng": "Every village had at least one. He makes and mends the village's daos, axes and hoes, and each household whose tools he mends gives him a basket of rice.", "pum": "The blacksmith's shed, in the middle of the widest street so a fire would not spread, with a log platform in front where people sit and talk. Its bellows are two hollow wooden cylinders with feathered pistons worked up and down, blowing through bamboo tubes into the charcoal fire.", "dolung": "The stone the blacksmith hammers hot iron on.", "meihawl": "Burnt wood that makes the forge fire hot.", "kulh": "A wall of timber all round the village, with sharp bamboo spikes in the ground outside it, against raiders.", "lungdawh": "A platform of stones built by the road at the village's entrance in memory of someone; the chief's is the lal lungdawh. Platforms of logs with posts hung with skulls, gourds, rags and old pots stood there too.", "sial": "The village's tame bison, a sign of wealth, killed for the great feasts; their skulls are hung up in memory.", "um": "A dried gourd used to carry water or beer, and hung on memorial posts.", "lu ruh": "The skulls of animals a hunter has killed, hung on the front wall of his house.", "sum": "A thick block of wood hollowed out at the top, set in the sumhmun. The paddy is pounded in it with the suk to take off the husks.", "suk": "The long heavy pole the paddy is pounded with in the sum.", "kailawn": "A log with steps cut into it, leading up to the house.", "tuium": "A length of thick bamboo used as a water pot, carried up from the spring in a basket and stood in a corner just inside the door.", "ramhual": "Men the chief chose to say where the jhums should be cut; they had first choice of land and gave him more paddy than others.", "sumhmun": "The open front of a house, named for the sum, the rice mortar that stands there, with the firewood and the hens' baskets."};   // what some things do (the loom's parts)
  // The things you can play with; #zokhua, #la, #loom, #bazar or #zonun in the address opens that one.
  const FIGS = [HOUSE, ZOKHUA, LA, LOOM, BAZAR, ZONUN];
  let fig = FIGS.find(f => '#' + f.id === location.hash) || FIGS[0];
  const $ = id => document.getElementById(id);
  const svg = $('svg'), skyEl = $('sky'), cvs = $('cvs'), ctx = cvs.getContext('2d'), stage = $('stage'), wordEl = $('word');
  let hits = [], paintedAt = null;   // what the canvas drew with a name (for taps), and its transform
  let VX, VY, VW, VH, st;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let yaw = fig.view.yaw, spin = false, labels = 0, pen = true, hl = null, hlUntil = 0;
  let stars = 0;
  try { stars = +localStorage.getItem('hn-things-stars') || 0; } catch (e) {}
  const showStars = () => { $('score').textContent = `⭐ ${stars}`; };
  showStars();

  // ---------- the caption under the figure ----------
  // also: one word or a list of words to show after it (a verb, or what a friend says).
  function say(m, also, cls) {
    const en = WORDS[m] || (fig.names && fig.names[m]) || '';
    const extra = [].concat(also || []).filter(w => WORDS[w]).map(w => `<span class="also">${w} · ${WORDS[w]}</span>`).join('');
    wordEl.className = 'word';
    wordEl.innerHTML = `<b>${m}</b><span>${en}</span>${extra}${NOTES[m] ? `<small class="what">${NOTES[m]}</small>` : ''}`;
    void wordEl.offsetWidth;
    wordEl.classList.add('pop');
    if (cls) wordEl.classList.add(cls);
  }

  // ---------- drawing ----------
  // The parts that can be named right now, facing you.
  const visibleAnchors = cam => fig.anchors(st, cam).filter(a => !a.n || Ink3D.dot(a.n, cam.view) >= 0.08);
  function labelLayer(cam) {
    const k = VW / (svg.clientWidth || 360);            // svg units per screen pixel
    const fs = 14 * k, pad = 5 * k, lh = 18 * k;   // Mizo only: a tap on a label shows the English
    const tags = [], seen = new Set();
    const only = fig.labelGroups ? fig.labelGroups[labels - 1] : null;
    for (const a of visibleAnchors(cam)) {
      if (seen.has(a.part) || (only && a.g && a.g !== only)) continue;
      seen.add(a.part);
      const s = view(a.s || cam.P(a.p));
      const m = a.part, w = m.length * 8.6 * k + pad * 2, h = lh + pad;
      const dx = s[0] - fig.view.centre[0], dy = s[1] - fig.view.centre[1], l = Math.hypot(dx, dy) || 1;
      tags.push({ m, s, w, h, x: s[0] + dx / l * 30 * k - w / 2, y: s[1] + dy / l * 30 * k - h / 2 });
    }
    // Push overlapping tags apart, and keep them inside the picture.
    for (let it = 0; it < 40; it++) {
      for (let i = 0; i < tags.length; i++) for (let j = i + 1; j < tags.length; j++) {
        const a = tags[i], b = tags[j];
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox > 0 && oy > 0) {
          if (oy < ox) { const m = (oy / 2 + 0.5) * (a.y < b.y ? -1 : 1); a.y += m; b.y -= m; }
          else { const m = (ox / 2 + 0.5) * (a.x < b.x ? -1 : 1); a.x += m; b.x -= m; }
        }
      }
      for (const t of tags) { t.x = Math.max(VX + 2, Math.min(VX + VW - t.w - 2, t.x)); t.y = Math.max(VY + 2, Math.min(VY + VH - t.h - 2, t.y)); }
    }
    return '<g class="labels">' + tags.map(t => {
      const cx = Math.max(t.x, Math.min(t.x + t.w, t.s[0])), cy = Math.max(t.y, Math.min(t.y + t.h, t.s[1]));
      return `<g data-p="${t.m}"><path d="M${t.s[0]} ${t.s[1]}L${cx} ${cy}" stroke="#231e16" stroke-width="${k * 1.3}"/><circle cx="${t.s[0]}" cy="${t.s[1]}" r="${k * 2.6}" fill="#231e16"/>` +
        `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="${7 * k}" fill="#fffdf8" stroke="#231e16" stroke-width="${k * 1.3}"/>` +
        `<text x="${t.x + t.w / 2}" y="${t.y + pad / 2 + lh * 0.78}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#1565c0" font-family="Plus Jakarta Sans, system-ui, sans-serif">${t.m}</text></g>`;
    }).join('') + '</g>';
  }
  // The name tag of what was just tapped: above the finger, kept inside the picture, the same size on any screen
  function tagLayer() {
    if (!tag || performance.now() > tag.until) { tag = null; return ''; }
    const k = VW / (svg.clientWidth || 360), f1 = 17 * k, f2 = 13 * k, pad = 8 * k;
    const w = Math.max(tag.word.length * f1 * 0.56, tag.en.length * f2 * 0.52) + pad * 2, h = (tag.en ? f1 + f2 + 6 * k : f1 + 2 * k) + pad * 1.4;
    const x = Math.max(VX + 4 * k, Math.min(VX + VW - w - 4 * k, tag.x - w / 2)), y = Math.max(VY + 4 * k, tag.y - h - 16 * k);
    const fade = Math.min(1, (tag.until - performance.now()) / 400), font = 'font-family="Plus Jakarta Sans, system-ui, sans-serif"';
    return `<g pointer-events="none" opacity="${fade.toFixed(2)}"><path d="M${tag.x - 5 * k} ${y + h - 1}L${tag.x} ${tag.y - 6 * k}L${tag.x + 5 * k} ${y + h - 1}Z" fill="#231e16"/>` +
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${8 * k}" fill="#fffdf8" stroke="#231e16" stroke-width="${1.4 * k}"/>` +
      `<text x="${x + pad}" y="${y + pad * 0.7 + f1 * 0.85}" font-size="${f1}" font-weight="800" fill="#1565c0" ${font}>${tag.word}</text>` +
      (tag.en ? `<text x="${x + pad}" y="${y + pad * 0.7 + f1 + f2 * 0.95}" font-size="${f2}" font-weight="700" fill="#5d5547" ${font}>${tag.en.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text>` : '') + '</g>';
  }

  // ---------- the camera follows the work ----------
  // A thing may name a point to look at closely (fig.focus → { p, zoom }); the camera glides there
  // and back out. Only the scene moves: the sky, the step dots and the labels' boxes stay put.
  const cv = { z: 1, x: 0, y: 0 };
  function aim(cam, dt) {
    const f = !labels && fig.focus ? fig.focus(st) : null, c = fig.view.centre;
    let z = 1, x = c[0], y = c[1];
    if (f) { const q = cam.P(f.p); z = f.zoom; x = q[0]; y = q[1]; }
    const k = reduce ? 1 : 1 - Math.exp(-dt * 2.6);
    cv.z += (z - cv.z) * k; cv.x += (x - cv.x) * k; cv.y += (y - cv.y) * k;
  }
  // Scene point → picture point, under the camera's zoom
  const view = q => { const c = fig.view.centre; return [c[0] + (q[0] - cv.x) * cv.z, c[1] + (q[1] - cv.y) * cv.z]; };
  const zoomed = () => Math.abs(cv.z - 1) > 0.004 || Math.abs(cv.x - fig.view.centre[0]) > 0.05 || Math.abs(cv.y - fig.view.centre[1]) > 0.05;
  function draw(dt = 1) {
    const cam = Ink3D.camera(yaw, fig.view.pitch);
    aim(cam, dt);
    // The canvas at the screen's sharpness (up to 2.5 pixels a point), mapped to the picture's units and the camera's zoom
    const dpr = Math.min(devicePixelRatio || 1, 2.5), w = Math.round(svg.clientWidth * dpr), h = Math.round(svg.clientHeight * dpr);

    const k = w / VW, c = fig.view.centre;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.setTransform(k, 0, 0, k, -VX * k, -VY * k);
    ctx.transform(cv.z, 0, 0, cv.z, c[0] - cv.x * cv.z, c[1] - cv.y * cv.z);
    hits = Ink3D.paint(ctx, fig.scene(st, cam), cam, { tint: fig.tint(st), hl, ink: fig.view.ink || 1, wobble: pen ? 0.45 * (fig.view.ink || 1) : 0, light: fig.light && fig.light(st), haze: fig.haze && fig.haze(st), smooth: fig.smooth });
    paintedAt = ctx.getTransform();
    skyEl.innerHTML = fig.sky(st);
    svg.innerHTML = fig.over(st) + (labels ? labelLayer(cam) : '') + tagLayer();
  }

  // ---------- the loop: 60 frames a second when the phone keeps up, 30 or fewer on a slow one, every frame while you drag ----------
  let last = performance.now(), lastDraw = 0, drag = null, cost = 8;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (spin && !drag) yaw = (yaw + dt * 18) % 360;
    fig.step(st, reduce ? dt * 0.4 : dt);
    if (hl && now > hlUntil) hl = null;
    // A drawing that takes long (an older phone) gets more time between pictures, so it never stutters.
    const gap = cost > 16 ? 48 : cost > 10 ? 40 : cost > 6 ? 32 : 15;
    if (drag || now - lastDraw > gap) {
      const t0 = performance.now();
      draw(Math.min(0.1, (now - lastDraw) / 1000)); lastDraw = now;
      cost = cost * 0.9 + (performance.now() - t0) * 0.1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- tap a part, or drag to turn ----------
  // The front picture (labels, the map) first, then the thing on the canvas, then the sky; a little round
  // the finger too, so a small part is easy to hit.
  const NEAR = [[0, 0], [8, 0], [-8, 0], [0, 8], [0, -8], [12, 12], [-12, 12], [12, -12], [-12, -12]];
  function inLayer(layer, x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      const p = el.closest && el.closest('[data-p]');
      if (p && layer.contains(p)) return p.dataset.p;
    }
    return null;
  }
  function partAt(x, y) {
    for (const [dx, dy] of NEAR) { const p = inLayer(svg, x + dx, y + dy); if (p) return p; }
    if (paintedAt) {
      const r = cvs.getBoundingClientRect();
      ctx.setTransform(paintedAt);
      for (const [dx, dy] of NEAR) {
        const p = Ink3D.hit(ctx, hits, (x + dx - r.left) * cvs.width / r.width, (y + dy - r.top) * cvs.height / r.height);
        if (p) return p;
      }
    }
    for (const [dx, dy] of NEAR) { const p = inLayer(skyEl, x + dx, y + dy); if (p) return p; }
    return null;
  }
  // A thing that is walked along (fig.pan, the village) slides under the finger instead of turning.
  const unitsPerPx = () => VW / (svg.clientWidth || 360);
  stage.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, yaw, moved: false, id: e.pointerId, from: null, vx: 0, lx: e.clientX, lt: e.timeStamp };
  });

      try { stage.setPointerCapture(e.pointerId); } catch (err) {}

    e.preventDefault(); fig.pan.by(st, e.key === 'ArrowRight' ? 60 : -60);
  });

  // id is the tapped part's name, with #n when there are several of a kind (the eggs).
  // A tap names what was tapped right there on the picture, for a moment: its Mizo word, and its English.
  let tag = null;
  function touched(id, x, y) {
    const part = id.split('#')[0];
    hl = id; hlUntil = performance.now() + 900;
    if (x != null && !find) {
      const r = svg.getBoundingClientRect();
      tag = { x: VX + (x - r.left) / r.width * VW, y: VY + (y - r.top) / r.height * VH, word: part, en: WORDS[part] || (fig.names && fig.names[part]) || '', until: performance.now() + 2400 };
    }
    $('hint').classList.add('gone');
    const also = fig.tap ? fig.tap(st, part, id) : null;
    drawActs();   // a tap can make a button ready (Weigh it, Pay) at once
    if (find) return checkFind(part, also);
    say(part, also);
  }

  // ---------- buttons ----------
  // Redrawn only when their words change (a button can also be not ready yet, like Finish).
  function drawActs() {
    const html = fig.actions.map((a, i) => {
      const w = a.word(st), off = a.ready && !a.ready(st);
      return `<button class="act" type="button" data-i="${i}"${off ? ' disabled' : ''}>${a.label(st)}${w ? `<span class="chip">${w}</span>` : ''}</button>`;
    }).join('');
    if ($('acts').dataset.html !== html) { $('acts').innerHTML = html; $('acts').dataset.html = html; }
  }
  $('acts').addEventListener('click', e => {
    const b = e.target.closest('.act'); if (!b || b.disabled) return;
    const a = fig.actions[+b.dataset.i], w = a.word(st);
    a.run(st);
    if (w && !find) say(w);
    drawActs(); drawInfo();
  });
  // A thing's own notes (fig.info), redrawn when they change; a button in them with data-go calls fig.go.
  function drawInfo() {
    const html = fig.info ? fig.info(st) : '';
    $('info').hidden = !html;
    if ($('info').dataset.html !== html) { $('info').innerHTML = html; $('info').dataset.html = html; }
  }
  $('info').addEventListener('click', e => {
    const w = e.target.closest('[data-say]');
    if (w) { say(w.dataset.say); wordEl.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); return; }
    const b = e.target.closest('[data-go]'); if (!b || !fig.go) return;
    fig.go(st, b.dataset.go); drawActs(); drawInfo();

  setInterval(() => { drawActs(); syncSwatches(); drawInfo(); }, 400);

  const toggle = (id, on) => $(id).setAttribute('aria-pressed', on);
  // Labels step through the figure's groups (House, Yard, …), then off.
  const showLabels = n => {
    const groups = fig.labelGroups || ['all'];
    labels = n % (groups.length + 1);
    toggle('t-labels', labels > 0);
    $('t-labels').textContent = labels && fig.labelGroups ? `Labels: ${groups[labels - 1]}` : 'Labels';
  };
  $('t-labels').onclick = () => showLabels(labels + 1);
  $('t-turn').onclick = () => { spin = !spin; toggle('t-turn', spin); };
  $('t-front').onclick = () => { spin = false; toggle('t-turn', false); yaw = fig.view.yaw; };
  $('t-pen').onclick = () => { pen = !pen; toggle('t-pen', pen); };

  // Colour swatches: a swatch named by a Mizo word says it when picked. A thing may have none.
  function drawSwatches() {
    const sw = fig.swatches;
    $('swlabel').style.display = $('swatches').style.display = sw ? '' : 'none';
    if (!sw) { $('swatches').innerHTML = ''; return; }
    $('swlabel').textContent = sw.label;
    $('swatches').innerHTML = Object.entries(sw.list).map(([k, c]) => `<button class="swatch" type="button" data-k="${k}" style="background:${c}" aria-label="${WORDS[k] ? `${k}, ${WORDS[k]}` : k}"></button>`).join('');
    syncSwatches();
  }
  const syncSwatches = () => document.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', st[fig.swatches.key] === x.dataset.k));
  $('swatches').addEventListener('click', e => {
    const b = e.target.closest('.swatch'); if (!b) return;
    st[fig.swatches.key] = b.dataset.k;
    syncSwatches();
    if (WORDS[b.dataset.k] && !find) say(b.dataset.k);
  });

  // ---------- Find it: tap the part that is named ----------
  let find = null;
  const ROUND = 8;
  function nextFind() {
    const pool = [...new Set(visibleAnchors(Ink3D.camera(yaw, fig.view.pitch)).map(a => a.part))].filter(p => WORDS[p] && p !== (find && find.word));   // names are not asked for
    find.word = pool[Math.floor(Math.random() * pool.length)];
    find.miss = 0;
    $('findw').textContent = find.word;
    $('findhint').textContent = '';
  }
  function startFind() {
    find = { word: null, found: 0 };
    showLabels(0);
    $('findbar').hidden = false; toggle('t-find', true);
    nextFind();
  }
  function stopFind() { find = null; $('findbar').hidden = true; toggle('t-find', false); }
  function checkFind(part, also) {
    if (part === find.word) {
      say(part, also, 'good');
      stars++; find.found++; showStars();
      try { localStorage.setItem('hn-things-stars', stars); } catch (e) {}
      if (find.found >= ROUND) {
        hnStat(`things/${fig.id}/win`, `Touch and learn: ${fig.sub} won`);
        $('findw').textContent = 'Well done!';
        $('findhint').textContent = `You found ${ROUND} things.`;
        find.word = null;
        setTimeout(() => { if (find && !find.word) { find.found = 0; nextFind(); } }, 2200);
      } else setTimeout(() => { if (find) nextFind(); }, 650);
    } else {
      say(part, also, 'bad');
      if (++find.miss >= 1 && find.word) $('findhint').textContent = `(${WORDS[find.word]})`;
    }
  }
  $('t-find').onclick = () => find ? stopFind() : startFind();
  $('skip').onclick = () => { if (find) nextFind(); };

  // ---------- choosing a thing ----------
  function useFig(f) {
    fig = f; st = f.init();
    [VX, VY, VW, VH] = f.view.box.split(' ').map(Number);
    svg.setAttribute('viewBox', f.view.box); skyEl.setAttribute('viewBox', f.view.box);
    svg.style.aspectRatio = `${VW} / ${VH}`;
    svg.setAttribute('aria-label', `${f.name}: ${f.sub}. Tap a part to see its Mizo name.`);
    $('fname').textContent = f.name;
    $('fsub').textContent = `· ${f.sub}`;
    yaw = f.view.yaw; spin = false; toggle('t-turn', false); hl = null;
    $('t-turn').hidden = $('t-front').hidden = !!f.pan;   // a village is walked along, not turned
    stage.classList.toggle('pan', !!f.pan);
    $('hint').textContent = f.hint || 'Tap anything · drag to turn'; $('hint').classList.remove('gone');
    cv.z = 1; [cv.x, cv.y] = f.view.centre;
    stopFind(); showLabels(0); tag = null;
    wordEl.className = 'word idle'; wordEl.innerHTML = '<b>Tap anything</b><span>to see its Mizo name</span>';
    $('acts').dataset.html = ''; drawActs(); drawSwatches(); drawInfo();
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === f.id));
    try { history.replaceState(null, '', '#' + f.id); } catch (e) {}
    hnStat(`things/${f.id}`, `Touch and learn: ${f.sub}`);
  }
  $('tabs').innerHTML = FIGS.map(f => `<button type="button" role="tab" data-id="${f.id}">${f.name}</button>`).join('');
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.id !== fig.id) useFig(FIGS.find(f => f.id === b.dataset.id)); });
  // La siam's last step sends the thread to the loom through the address.
  addEventListener('hashchange', () => { const f = FIGS.find(f => '#' + f.id === location.hash); if (f && f !== fig) useFig(f); });
  useFig(fig);
})();
</script>
