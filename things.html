<script>
// In hlui: an old Mizo house, as at Zokhua, the Mizo typical village at Falkawn, drawn with Ink3D. It follows
// the plan of a Lushai house in J. Shakespear's The Lushei Kuki Clans (1912) and the Mizo article Hmanlai
// Mizo In Sak Dan: a log ladder and platform up to the sumhmun (the verandah with the rice mortar, the
// firewood, and hens and hunting trophies on the front wall), a small sliding door with a high sill, and in the
// main room, along the uphill side, the water tubes, the paddy bin, the children's bed, the hearth and the
// parents' bed, then a closet with the back door. Walls of woven bamboo, a thick thatch held down by bamboo
// bands; no window unless the man of the house is Thangchhuah. The street (the front) is toward +x and the
// hill toward -y. Words that are not in the Hnahsin content are in inhlui_words.json.
const INHLUI = (() => {
  const { box, ball, cyl, line, poly, group, solid, spot, mix } = Ink3D;

  const WALL = { l: '#e6cf98', m: '#c9ac6c', d: '#6e5630' }, WEAVE = '#a58950';
  const WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' }, LOG = { l: '#a98258', m: '#86623e', d: '#43301c' }, POST = { l: '#9a6a40', m: '#7a5230', d: '#3e2918' };
  const THATCH = { l: '#d9c08a', m: '#b89a5e', d: '#5e4a2a' }, MAT = { l: '#e8d6a2', m: '#cdb57a', d: '#6b5a33' }, BAMBOO = { l: '#d8d27e', m: '#b5ad55', d: '#5c5626' };
  const GRASS = { l: '#a9d67c', m: '#8cc063', d: '#4b6b33' }, EARTH = { l: '#c99a6b', m: '#a8774b', d: '#5a3d26' }, CLAY = { l: '#c89f78', m: '#a77d58', d: '#5a412c' };
  const LEAF = { l: '#86c86e', m: '#5fa451', d: '#2f5a28' }, BARK = { l: '#9b7350', m: '#7a5636', d: '#3b2817' }, STONE = { l: '#b9b6b0', m: '#8f8b85', d: '#4a4743' };
  const CANE = { l: '#e8c584', m: '#c9a05a', d: '#6b5126' }, IRON = { l: '#8d8a86', m: '#5a5754', d: '#2d2b29' }, GOLD = { l: '#f2d36b', m: '#d9b13d', d: '#7a6018' };
  const HEN = { l: '#e39a57', m: '#c0733a', d: '#5c3417' }, PIG = { l: '#5f5752', m: '#463f3b', d: '#1f1b19' }, DOG = { l: '#d9b98a', m: '#b8915e', d: '#5c4426' };
  const BONE = { l: '#f4efe2', m: '#ddd4bd', d: '#7d7562' }, INSIDE = '#3a2c22', FLAME = ['#ffd84a', '#ff9a3c', '#e2483d'];
  const HAIR = '#1d1b22', GREY = '#cfcac2', PUAN = { l: '#d9474f', m: '#b8343d', d: '#5c1a1f' };
  const NU = { h: 22, shirt: { l: '#f4e7d0', m: '#dccbb0', d: '#6d604c' }, lower: 'skirt', lowerPal: PUAN, bands: [0.24, 0.32, 0.4], hair: HAIR, bun: true };
  const PA = { h: 24, shirt: { l: '#fbf7ee', m: '#e6e0d2', d: '#8f887a' }, lower: 'shorts', lowerPal: { l: '#5a5f6b', m: '#41454f', d: '#1f2128' }, hair: HAIR };
  const PI = { h: 21, shirt: { l: '#e9e4f5', m: '#c9c0e0', d: '#5c5478' }, lower: 'skirt', lowerPal: { l: '#3f3f4a', m: '#26262e', d: '#101014' }, bands: [0.2, 0.28], hair: GREY, bun: true };
  const NAUPANG = { h: 14, shirt: { l: '#ffe08a', m: '#f2b431', d: '#6b4d12' }, lower: 'shorts', lowerPal: { l: '#5a5f6b', m: '#41454f', d: '#1f2128' }, hair: HAIR };

  // The house: the main room from X0 to XF, the sumhmun from XF to X1; the floor at FL, the wall plate at WT
  const X0 = -40, XC = -29, XF = 14, X1 = 34, Y0 = -16, Y1 = 16, FL = 8, WT = 26, RIDGE = 48;
  const toward = (v, t, step) => v < t ? Math.min(t, v + step) : Math.max(t, v - step);

  function init() { return { t: 0, inside: 0, insideT: 0, pound: false, fire: false, door: 0, doorT: 0, hens: 0, hensT: 0, window: false, said: null }; }
  function step(s, dt) {
    s.t += dt;
    s.inside = toward(s.inside, s.insideT, dt * 2);
    s.door = toward(s.door, s.doorT, dt * 1.6);
    s.hens = toward(s.hens, s.hensT, dt / 2.5);
  }

  // ---------- the house ----------
  // Woven bamboo (bawhtah): short slanting strokes in rows, the slant turning each row, on the wall at y or x
  function weave(face, a0, a1, z0, z1) {
    const out = [];
    for (let z = z0 + 1.5, row = 0; z < z1 - 0.5; z += 3, row++) for (let a = a0 + 1; a < a1 - 1; a += 3) {
      const k = row % 2 ? 1 : -1, P = (u, v) => face[0] === 'y' ? [u, face[1], v] : [face[1], u, v];
      out.push({ pts: [P(a + (k < 0 ? 1.6 : 0), z - 1.1), P(a + (k < 0 ? 0 : 1.6), z + 1.1)], stroke: WEAVE, w: 0.35, open: true });
    }
    return out;
  }
  // A thick thatched roof, rounded by the bamboo bands laid over it from eave to eave and tied down along it
  function roof(x0, x1) {
    const E = Y1 + 5, M = 11, ZE = WT - 2, ZM = 40;
    const fa = [[x0, E, ZE], [x1, E, ZE], [x1, M, ZM], [x0, M, ZM]], fb = [[x0, M, ZM], [x1, M, ZM], [x1, 0, RIDGE], [x0, 0, RIDGE]];
    const ba = fa.map(p => [p[0], -p[1], p[2]]), bb = fb.map(p => [p[0], -p[1], p[2]]);
    const bands = (lo, hi) => {
      const d = [];
      for (let x = x0 + 3; x < x1 - 1; x += 7) d.push({ pts: [[x, lo[1], lo[2]], [x, hi[1], hi[2]]], stroke: BAMBOO.m, w: 0.9, open: true });
      d.push({ pts: [[x0, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2], [x1, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2]], stroke: BAMBOO.d, w: 0.7, open: true });
      return d;
    };
    const end = x => [[x, E, ZE], [x, M, ZM], [x, 0, RIDGE], [x, -M, ZM], [x, -E, ZE]];
    const fringe = [];
    for (let x = x0 + 1; x < x1; x += 2.2) fringe.push({ pts: [[x, E, ZE], [x + 0.6, E + 0.6, ZE - 2.2]], stroke: THATCH.d, w: 0.45, open: true });
    return solid([
      { pts: fa, decals: [...bands([0, E, ZE], [0, M, ZM]), ...fringe] }, { pts: fb, decals: bands([0, M, ZM], [0, 0, RIDGE]) },
      { pts: ba.slice().reverse() }, { pts: bb.slice().reverse() }, { pts: end(x0) }, { pts: end(x1) },
      { pts: [[x0, E, ZE], [x1, E, ZE], [x1, -E, ZE], [x0, -E, ZE]] },
    ], { pal: THATCH, part: 'in' });
  }
  // A skull from the hunt with its horns (a mithun's, wide; a barking deer's, short and spiky)
  function skull(x, y, z, kind) {
    const out = [ball([x, y, z], 1.7, { pal: BONE }), ball([x + 0.4, y, z - 1.6], 1, { pal: BONE })];
    if (kind === 'sial') out.push(line([[x, y - 1.2, z + 0.8], [x, y - 3.4, z + 1.2], [x, y - 4.4, z + 3.2]], { col: '#3a3330', w: 0.9, part: 'ki' }), line([[x, y + 1.2, z + 0.8], [x, y + 3.4, z + 1.2], [x, y + 4.4, z + 3.2]], { col: '#3a3330', w: 0.9, part: 'ki' }));
    else out.push(line([[x, y - 0.8, z + 1.2], [x, y - 1.8, z + 4], [x, y - 2.8, z + 4.8]], { col: '#8d6a44', w: 0.6, part: 'ki' }), line([[x, y + 0.8, z + 1.2], [x, y + 1.8, z + 4], [x, y + 2.8, z + 4.8]], { col: '#8d6a44', w: 0.6, part: 'ki' }));
    return group(out, { part: 'lu ruh', at: [x, y, z] });
  }
  function hen(s, x, y, z, i) {
    const peck = Math.max(0, Math.sin(s.t * 2.4 + i)) ** 4, d = Math.sin(i * 1.7) > 0 ? 1 : -1;
    return group([spot([x, y, z], 3.4, { opacity: 0.3 }), ball([x, y, z + 3.4], 3, { pal: HEN }), ball([x + 2.4 * d, y, z + 6 - peck * 3.2], 1.8, { pal: HEN }), ball([x + 2.5 * d, y, z + 7.8 - peck * 3.2], 0.8, { fill: '#e2483d', w: 0.4 })],
      { part: 'arpui', at: [x, y, z + 3] });
  }
  function fire(s, x, y, z, k = 1) {
    const out = [];
    for (let i = 0; i < 3; i++) {
      const f = 0.75 + 0.25 * Math.sin(s.t * 11 + i * 2.1), h = (6 - i * 1.6) * k * f, w = (2.6 - i * 0.7) * k, lean = Math.sin(s.t * 6 + i) * 0.8 * k;
      const P = (u, v) => [x + u, y + 0.3 + i * 0.1, z + v];
      out.push(poly([P(-w, 0), P(-w * 0.7, h * 0.45), P(-w * 0.2 + lean * 0.5, h * 0.6), P(lean, h), P(w * 0.5 + lean * 0.5, h * 0.55), P(w, 0)], { fill: FLAME[2 - i], glow: true, part: 'mei', w: 0.5 }));
    }
    return out;
  }

  function scene(s, cam) {
    const inside = s.inside > 0.5, items = [];
    const slab = box(-110, 110, -90, 90, -12, 0, { pal: EARTH, pals: { zp: GRASS }, shadow: false });
    const path = poly([[X1 + 10, -6, 0.05], [110, -14, 0.05], [110, 14, 0.05], [X1 + 10, 10, 0.05]], { fill: '#dcc596', part: 'kawng', w: 0.7 });
    // Posts, and the floor: split bamboo inside, logs on the sumhmun
    for (const x of [-39, -27, -15, -3, 9, 21, 33]) for (const y of [Y0 + 1, Y1 - 1]) items.push(box(x - 1.1, x + 1.1, y - 1.1, y + 1.1, 0, FL - 1, { pal: POST, part: 'in' }));
    items.push(box(X0, XF, Y0, Y1, FL - 1, FL, { pal: MAT, part: 'chhuat' }), box(XF, X1, Y0, Y1, FL - 1.4, FL, { pal: LOG, part: 'sumhmun' }));
    // The walls, open on the near sides when you look inside
    const doorW = 6, dz0 = FL + 3, dz1 = FL + 12, dy0 = 5, slide = s.door * doorW;
    const front = [...weave(['x', XF + 0.1], Y0, Y1, FL, WT),
      { pts: [[XF + 0.12, dy0, dz0], [XF + 0.12, dy0 + doorW, dz0], [XF + 0.12, dy0 + doorW, dz1], [XF + 0.12, dy0, dz1]], fill: INSIDE, part: 'kawngkhar' },
      { pts: [[XF + 0.14, dy0 - slide, dz0], [XF + 0.14, dy0 + doorW - slide, dz0], [XF + 0.14, dy0 + doorW - slide, dz1], [XF + 0.14, dy0 - slide, dz1]], fill: WALL.m, part: 'kawngkhar' }];
    const side = [...weave(['y', Y1 + 0.1], X0, XF, FL, WT)];
    if (s.window) side.push({ pts: [[-10, Y1 + 0.12, FL + 7], [-2, Y1 + 0.12, FL + 7], [-2, Y1 + 0.12, FL + 13], [-10, Y1 + 0.12, FL + 13]], fill: INSIDE, part: 'tukverh' });
    items.push(box(X0, XF, Y0, Y1, FL, WT, { pal: WALL, part: 'bang', skip: inside ? ['zp', 'zn', 'yp', 'xp'] : ['zp', 'zn'], decals: { xp: front, yp: side } }));
    if (!inside) items.push(roof(X0 - 4, X1 + 3));
    // Smoke from the hearth seeps out through the thatch
    if (s.fire) for (let i = 0; i < 4; i++) {
      const r = (s.t * 0.22 + i / 4) % 1;
      items.push(ball([-9 + r * 10, -4, (inside ? WT : RIDGE - 2) + r * 34], 2.5 + r * 6, { fill: '#e2ded6', ink: false, opacity: 0.6 * (1 - r), part: 'meikhu', shadow: false }));
    }

    // ---------- the sumhmun ----------
    // The log platform and ladder up from the street, the firewood stack, and the mortar
    items.push(box(X1, X1 + 8, -5, 8, FL - 2.6, FL - 1.4, { pal: LOG, part: 'sumhmun' }));
    for (const x of [X1 + 1, X1 + 7]) for (const y of [-4, 7]) items.push(box(x - 0.8, x + 0.8, y - 0.8, y + 0.8, 0, FL - 2.6, { pal: POST, part: 'sumhmun' }));
    const lad = [];
    for (let i = 1; i < 4; i++) lad.push(line([[X1 + 18 - i * 2.6, 0.6, i * 1.6], [X1 + 18 - i * 2.6, 3.4, i * 1.6]], { col: BARK.d, w: 0.5, ink: false }));
    items.push(group([line([[X1 + 19, 2, 0], [X1 + 8, 2, FL - 1.4]], { col: BARK.m, w: 3.4 }), ...lad], { part: 'kailawn', at: [X1 + 13, 2, 3] }));
    for (let i = 0; i < 4; i++) items.push(line([[XF + 3, Y0 + 1.5 + (i % 2) * 2.4, FL + 1 + i * 1.6], [X1 - 4, Y0 + 1.5 + (i % 2) * 2.4, FL + 1 + i * 1.6]], { col: BARK.m, w: 2.2, part: 'thingtuah' }));
    const sumAt = [XF + 13, 4];
    items.push(cyl(sumAt, FL, FL + 6, 3, 2.6, { pal: WOOD, capFill: '#4a3424', bands: [FL + 2], part: 'sum' }));
    // Nu pounds the paddy: the heavy pole up, and down into the mortar
    const nAt = [sumAt[0] + 6.5, sumAt[1] - 1, FL], beat = s.pound ? (Math.sin(s.t * 5.5) + 1) / 2 : 0.15;
    const top = FL + 9 + beat * 12, hands = [[sumAt[0] + 2.4, sumAt[1] - 0.6, top - 3.5], [sumAt[0] + 2.4, sumAt[1] + 0.6, top - 7]];
    items.push(group(Ink3DPeople.person(nAt, Math.PI + 0.25, { t: s.t, ...NU, pose: 'stand', hands }), { part: 'nu', at: [nAt[0], nAt[1], FL + 11] }));
    items.push(line([[sumAt[0], sumAt[1], top], [sumAt[0], sumAt[1], top - 16]], { col: WOOD.m, w: 1.6, part: 'suk' }));
    if (s.pound && beat < 0.2) for (let i = 0; i < 4; i++) items.push(ball([sumAt[0] + Math.cos(i * 1.6 + s.t) * 3, sumAt[1] + Math.sin(i * 1.6 + s.t) * 3, FL + 6.5 + (0.2 - beat) * 12], 0.45, { fill: '#e8d9a8', ink: false, shadow: false }));
    // On the front wall: the hunter's trophies, and the hens' laying baskets; a long roost basket under the eaves
    if (!inside) {
      items.push(skull(XF + 0.8, -11, 21, 'sial'), skull(XF + 0.8, -3.5, 22, 'sakhi'), skull(XF + 0.8, 3, 22.5, 'sial'));
      for (const y of [-12.5, -6.5]) items.push(cyl([XF + 1.8, y], 13, 16.5, 1.7, 2.3, { pal: CANE, bands: [14.5], part: 'arbawm' }));
      items.push(line([[XF + 1, Y0 - 3, WT - 1], [X1 - 2, Y0 - 3, WT - 1]], { col: CANE.m, w: 2.6, part: 'arbawm' }), line([[X1 - 6, Y0 + 1, FL], [X1 - 4, Y0 - 3, WT - 1.5]], { col: BAMBOO.m, w: 0.8, part: 'arbawm' }));
    }
    // The hens: in their baskets, or out pecking in the yard
    for (let i = 0; i < 3; i++) {
      const out = Math.min(1, Math.max(0, s.hens * 3 - i));
      if (out > 0.02) items.push(hen(s, X1 + 6 + i * 9 + Math.sin(s.t * 0.4 + i) * 3 * out, 26 + i * 6, 0, i));
      else items.push(ball([XF + 2.6, i % 2 ? -6.5 : -12.5, 17.2], 1.4, { pal: HEN, part: 'arpui', w: 0.5 }));
    }

 "nipui": "summer", "favâng": "autumn"};   // Mizo → English, from the Hnahsin content
  const NOTES = {"kawngvawn": "A strong strap of hide or cord round the weaver's back; leaning back pulls the warp tight.", "themkhawl": "The bar right in front of the weaver: the woven cloth rolls onto it, and the backstrap ties to it.", "thempui": "A long flat stick, thin and a little sharp, that beats each new row of weft tight.", "thembupui": "A wide flat bamboo bar that parts the upper and lower warp threads, opening the way for the shuttle.", "hnahchawi": "A thin straight rod tied with loops to every other warp thread; lifting it lifts them, so the threads cross.", "themte": "Thin rods added past the heddle to raise threads for the puan's design; four to seven for a fine pattern.", "tuirek": "A comb of bamboo or wood that keeps the warp threads evenly spaced.", "khawhtlang": "A slim stick with the weft wound on it, passed back and forth through the open shed.", "themtlang": "The big bar at the far end, tied to a wall or post, that holds every warp thread.", "kaihbu": "Two thin split bamboos near the warp beam that keep the warp threads from tangling.", "la": "Cotton grown in the jhum field, made into thread by hand before any weaving.", "lapua": "The cotton bolls picked from the plant and dried in the sun, with the seeds still inside.", "la mu": "The hard seeds, too big to pass between the gin's rollers; they drop out on the weaver's side.", "herawt": "Two hardwood rollers on an upright frame, geared together by carved spiral grooves. The cotton fibres are pulled through the gap; the seeds stay behind.", "lasai": "A strip of mature bamboo bent into an arch with a tight string. Held in the heap and plucked, it shakes the clumps into soft, airy fluff and the dust out.", "lasai thal": "The bow's tight cord, twisted from tough bark fibre or cane. Plucked with a little wooden striker, it buzzes \"per ri tek tek\".", "lachawn": "A handful of the fluffed cotton rolled round a thin bamboo stick into a soft hollow roll, ready to spin.", "hmui": "A low wheel on a heavy wooden base, used sitting on the floor. The right hand turns the wheel; a cord loop drives the spindle.", "hmuithlur": "The sharp, thin iron spindle. It twists the cotton into thread, then the thread is wound onto it into a full cone.", "la zai": "The cotton spun into a long, strong strand.", "ladawhkilh": "Upright wooden pegs. The thread from the spindle is wound round them into loose skeins (lamuai), so water, dye and starch reach every part.", "suvel": "A bamboo cage that turns on an upright pivot. The dried skein goes round it, and as the thread is pulled the cage spins, so it winds into a ball without tangling.", "lazarna": "Posts set apart as long as the puan will be. Walking back and forth, the weaver lays the starched thread round them in a figure-eight cross, counting each thread and placing the colour stripes.", "sutpui": "The long threads of the puan, laid out on the lazarna; the cross is later held by the kaihbu, and the warp goes onto the themkhawl and themtlang.", "buhhawp tui": "Thick rice water. The skeins are boiled in it, so the starch coats the thread and it does not fray or break on the loom; then they dry in the sun.", "eng": "The colour of turmeric and ripe rice; a bright thread in many puans.", "puanchei": "White, with red and black stripes and rows of patterns in green, yellow and black: sakei ha (tiger's teeth), disul (sungrass in the wind), kawkpuizikzial (the fern shoot), lenbuangthuam (forked branches) and fanghma mu. Once called \"Puan Lallukhum\". Worn at the big festivals, for the Cheraw (bamboo dance), and by a bride.", "pawndum": "Black, with bold red, yellow and white stripes across. A puan of mourning and of love for life: a bride takes one into marriage as her zawlken puan (\"I will cover you all your life, and wrap you in this at your death\"), and people bring one when someone dies, to share the family's sorrow.", "ngotekherh": "White and black. \"Ngo\" is white, and \"kherh\" the black lines woven both ways into a grid, with a wide black band in the middle (puanhruikhau). Once only for chiefs' and rich families; now men and women both wear it at festivals and big days.", "hmaram": "Deep indigo-black, dyed with ting (Assam indigo), with fine white patterns: fern shoots (kawkpuizikzial), stars and small flower borders. A short wrap worn by girls and young women, from the waist to the calves. A girl who could weave her own was counted a grown woman.", "tawlhlohpuan": "\"Tawlh lo\" means never stepping back. Black, with bold red, white and yellow stripes in the middle and sawtooth edges beside them. Once worn only by pasalṭha, the bravest warriors who never ran from a fight; now given to honour people who served the land.", "herawt ban": "The crank that turns the gin's rollers in opposite directions.", "lamuai": "A loose loop of thread, bundled so it can be boiled, dyed with ting or starched without tangling.", "hlo": "Weeds that grow up among the rice. Hlo thlawh, weeding, is the hardest work of June and July. (JF: weed → hlo thlo)", "buk": "A hut on posts in the jhum field. In August people sleep in it (buk riah) to guard the rice from wild animals and birds. (JF: hut → buk)", "sava hlauh": "Set up in the field to frighten the birds away from the rice. (JF: scarecrow → sava hlauh)", "pher": "A woven mat: the paddy is beaten (vua) on it to thresh it. (JF: mat → pher)", "thlei": "To toss the grain in a flat basket, so the light husks blow away. (JF: winnow → thlei)", "tiak": "What the rice and the jungle do when the first rains come in May. (JF: sprout → tiak)", "tapchhak": "The fireplace in the house, where the family sit in the cold months. (JF: hearth → tap, tapchhak)", "hal": "Lo hal: burning the dried jhum in April, before the sowing. (JF: fire → hal)", "buh in": "The house where the harvested paddy is kept. (JF: barn → chhêk in, buh in)", "pâwl": "What is left of the rice in the field after the harvest. Pâwlkut and Pâwltlak are named for it. (From the notes on the months)", "sumhmun": "The open front of the house, named for the sum, the mortar where the paddy is pounded. Firewood is stacked here, and hens lay in baskets on the front wall. (JF: porch → sumhmun)", "sum": "A thick block of wood hollowed out at the top, set in the sumhmun. The paddy is pounded in it with the suk to take off the husks. (JF: mortar → sum)", "suk": "The long heavy pole the paddy is pounded with in the sum. (JF: pestle → suk)", "tap": "A box of earth on the floor, kneaded wet until it set hard as brick, with three stones in the middle for the cooking pot and a smooth plank in front to sit on in the cold. Two bamboo shelves hang over it, where tomorrow's paddy is dried. (JF: hearth → tap)", "khumai": "The sleeping platform between the door and the hearth, for the small children and the unmarried girls. (Shakespear: kum-ai)", "khumpui": "The parents' sleeping platform, beyond the hearth. The beds and the hearth are always on the uphill side of the house. (Shakespear: kum-pui)", "luhkapui": "A raised bamboo platform beside the front of the house, where the women weave and things are put out to dry. (Shakespear: luka-pui)", "kailawn": "A log with steps cut into it, leading up to the house. (JF: stair → kailawn)", "tuium": "A length of thick bamboo used as a water pot. They stand together in a corner just inside the door. (Shakespear: tui-um)", "buh zem": "A big round bin of woven bamboo with the household's paddy, just inside the door. (JF: granary → buh zem)", "kawmchar": "The door at the far end of the house, opening onto a small platform with a notched log down to the garden. (Hmanlai Mizo In Sak Dan)", "sut": "The tallest and thickest posts, set deepest in the ground, holding up the ridge of the roof. (Hmanlai Mizo In Sak Dan: Sut hi In sezang an ti a)", "lu ruh": "The skulls of animals a hunter has killed, hung on the front wall of his house. (JF: skull → lu ruh)"};   // what some things do (the loom's parts)
  // The things you can play with; #inhlui, #la, #loom, #bazar or #zonun in the address opens that one.
  const FIGS = [HOUSE, INHLUI, LA, LOOM, BAZAR, ZONUN];
  let fig = FIGS.find(f => '#' + f.id === location.hash) || FIGS[0];
  const $ = id => document.getElementById(id);
  const svg = $('svg'), skyEl = $('sky'), cvs = $('cvs'), ctx = cvs.getContext('2d'), stage = $('stage'), wordEl = $('word');
  let hits = [], paintedAt = null;   // what the canvas drew with a name (for taps), and its transform
  let VX, VY, VW, VH, st;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let yaw = fig.view.yaw, spin = false, labels = 0, pen = true, hl = null, hlUntil = 0;
  let stars = 0;
  try { stars = +localStorage.getItem('hn-things-stars') || 0; } catch (e) {}
  const showStars = () => { $('score').textContent = `⭐ ${stars}`; };
  showStars();

  // ---------- the caption under the figure ----------
  // also: one word or a list of words to show after it (a verb, or what a friend says).
  function say(m, also, cls) {
    const en = WORDS[m] || (fig.names && fig.names[m]) || '';
    const extra = [].concat(also || []).filter(w => WORDS[w]).map(w => `<span class="also">${w} · ${WORDS[w]}</span>`).join('');
    wordEl.className = 'word';
    wordEl.innerHTML = `<b>${m}</b><span>${en}</span>${extra}${NOTES[m] ? `<small class="what">${NOTES[m]}</small>` : ''}`;
    void wordEl.offsetWidth;
    wordEl.classList.add('pop');
    if (cls) wordEl.classList.add(cls);
  }

  // ---------- drawing ----------
  // The parts that can be named right now, facing you.
  const visibleAnchors = cam => fig.anchors(st, cam).filter(a => !a.n || Ink3D.dot(a.n, cam.view) >= 0.08);
  function labelLayer(cam) {
    const k = VW / (svg.clientWidth || 360);            // svg units per screen pixel
    const fs = 14 * k, pad = 5 * k, lh = 18 * k;   // Mizo only: a tap on a label shows the English
    const tags = [], seen = new Set();
    const only = fig.labelGroups ? fig.labelGroups[labels - 1] : null;
    for (const a of visibleAnchors(cam)) {
      if (seen.has(a.part) || (only && a.g && a.g !== only)) continue;
      seen.add(a.part);
      const s = view(a.s || cam.P(a.p));
      const m = a.part, w = m.length * 8.6 * k + pad * 2, h = lh + pad;
      const dx = s[0] - fig.view.centre[0], dy = s[1] - fig.view.centre[1], l = Math.hypot(dx, dy) || 1;
      tags.push({ m, s, w, h, x: s[0] + dx / l * 30 * k - w / 2, y: s[1] + dy / l * 30 * k - h / 2 });
    }
    // Push overlapping tags apart, and keep them inside the picture.
    for (let it = 0; it < 40; it++) {
      for (let i = 0; i < tags.length; i++) for (let j = i + 1; j < tags.length; j++) {
        const a = tags[i], b = tags[j];
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox > 0 && oy > 0) {
          if (oy < ox) { const m = (oy / 2 + 0.5) * (a.y < b.y ? -1 : 1); a.y += m; b.y -= m; }
          else { const m = (ox / 2 + 0.5) * (a.x < b.x ? -1 : 1); a.x += m; b.x -= m; }
        }
      }
      for (const t of tags) { t.x = Math.max(VX + 2, Math.min(VX + VW - t.w - 2, t.x)); t.y = Math.max(VY + 2, Math.min(VY + VH - t.h - 2, t.y)); }
    }
    return '<g class="labels">' + tags.map(t => {
      const cx = Math.max(t.x, Math.min(t.x + t.w, t.s[0])), cy = Math.max(t.y, Math.min(t.y + t.h, t.s[1]));
      return `<g data-p="${t.m}"><path d="M${t.s[0]} ${t.s[1]}L${cx} ${cy}" stroke="#231e16" stroke-width="${k * 1.3}"/><circle cx="${t.s[0]}" cy="${t.s[1]}" r="${k * 2.6}" fill="#231e16"/>` +
        `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="${7 * k}" fill="#fffdf8" stroke="#231e16" stroke-width="${k * 1.3}"/>` +
        `<text x="${t.x + t.w / 2}" y="${t.y + pad / 2 + lh * 0.78}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#1565c0" font-family="Plus Jakarta Sans, system-ui, sans-serif">${t.m}</text></g>`;
    }).join('') + '</g>';
  }
  // ---------- the camera follows the work ----------
  // A thing may name a point to look at closely (fig.focus → { p, zoom }); the camera glides there
  // and back out. Only the scene moves: the sky, the step dots and the labels' boxes stay put.
  const cv = { z: 1, x: 0, y: 0 };
  function aim(cam, dt) {
    const f = !labels && fig.focus ? fig.focus(st) : null, c = fig.view.centre;
    let z = 1, x = c[0], y = c[1];
    if (f) { const q = cam.P(f.p); z = f.zoom; x = q[0]; y = q[1]; }
    const k = reduce ? 1 : 1 - Math.exp(-dt * 2.6);
    cv.z += (z - cv.z) * k; cv.x += (x - cv.x) * k; cv.y += (y - cv.y) * k;
  }
  // Scene point → picture point, under the camera's zoom
  const view = q => { const c = fig.view.centre; return [c[0] + (q[0] - cv.x) * cv.z, c[1] + (q[1] - cv.y) * cv.z]; };
  const zoomed = () => Math.abs(cv.z - 1) > 0.004 || Math.abs(cv.x - fig.view.centre[0]) > 0.05 || Math.abs(cv.y - fig.view.centre[1]) > 0.05;
  function draw(dt = 1) {
    const cam = Ink3D.camera(yaw, fig.view.pitch);
    aim(cam, dt);
    // The canvas at the screen's sharpness (up to 2.5 pixels a point), mapped to the picture's units and the camera's zoom
    const dpr = Math.min(devicePixelRatio || 1, 2.5), w = Math.round(svg.clientWidth * dpr), h = Math.round(svg.clientHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
    const k = w / VW, c = fig.view.centre;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.setTransform(k, 0, 0, k, -VX * k, -VY * k);
    ctx.transform(cv.z, 0, 0, cv.z, c[0] - cv.x * cv.z, c[1] - cv.y * cv.z);
    hits = Ink3D.paint(ctx, fig.scene(st, cam), cam, { tint: fig.tint(st), hl, ink: fig.view.ink || 1, wobble: pen ? 0.45 * (fig.view.ink || 1) : 0, light: fig.light && fig.light(st), haze: fig.haze && fig.haze(st), smooth: fig.smooth });
    paintedAt = ctx.getTransform();
    skyEl.innerHTML = fig.sky(st);
    svg.innerHTML = fig.over(st) + (labels ? labelLayer(cam) : '');
  }

  // ---------- the loop: 60 frames a second when the phone keeps up, 30 or fewer on a slow one, every frame while you drag ----------
  let last = performance.now(), lastDraw = 0, drag = null, cost = 8;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (spin && !drag) yaw = (yaw + dt * 18) % 360;
    fig.step(st, reduce ? dt * 0.4 : dt);
    if (hl && now > hlUntil) hl = null;
    // A drawing that takes long (an older phone) gets more time between pictures, so it never stutters.
    const gap = cost > 16 ? 48 : cost > 10 ? 40 : cost > 6 ? 32 : 15;
    if (drag || now - lastDraw > gap) {
      const t0 = performance.now();
      draw(Math.min(0.1, (now - lastDraw) / 1000)); lastDraw = now;
      cost = cost * 0.9 + (performance.now() - t0) * 0.1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- tap a part, or drag to turn ----------
  // The front picture (labels, the map) first, then the thing on the canvas, then the sky; a little round
  // the finger too, so a small part is easy to hit.
  const NEAR = [[0, 0], [8, 0], [-8, 0], [0, 8], [0, -8], [12, 12], [-12, 12], [12, -12], [-12, -12]];
  function inLayer(layer, x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      const p = el.closest && el.closest('[data-p]');
      if (p && layer.contains(p)) return p.dataset.p;
    }
    return null;
  }
  function partAt(x, y) {
    for (const [dx, dy] of NEAR) { const p = inLayer(svg, x + dx, y + dy); if (p) return p; }
    if (paintedAt) {
      const r = cvs.getBoundingClientRect();
      ctx.setTransform(paintedAt);
      for (const [dx, dy] of NEAR) {
        const p = Ink3D.hit(ctx, hits, (x + dx - r.left) * cvs.width / r.width, (y + dy - r.top) * cvs.height / r.height);
        if (p) return p;
      }
    }
    for (const [dx, dy] of NEAR) { const p = inLayer(skyEl, x + dx, y + dy); if (p) return p; }
    return null;
  }
  // A thing that is walked along (fig.pan, the village) slides under the finger instead of turning.
  const unitsPerPx = () => VW / (svg.clientWidth || 360);
  stage.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, yaw, moved: false, id: e.pointerId, from: null, vx: 0, lx: e.clientX, lt: e.timeStamp };
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - drag.y)) {
      drag.moved = true; stage.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
      $('hint').classList.add('gone');
      if (fig.pan) drag.from = fig.pan.hold(st);
    }
    if (!drag.moved) return;
    if (fig.pan) {
      fig.pan.move(st, drag.from, dx * unitsPerPx());
      const dt = Math.max(1, e.timeStamp - drag.lt);   // how fast the finger moves, for a flick
      drag.vx = drag.vx * 0.6 + (e.clientX - drag.lx) / dt * 1000 * 0.4; drag.lx = e.clientX; drag.lt = e.timeStamp;
    } else yaw = drag.yaw - dx * 0.6;
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; stage.classList.remove('dragging');
    if (fig.pan && d.moved) fig.pan.let(st, e.timeStamp - d.lt < 80 ? d.vx * unitsPerPx() : 0);
    if (e.type === 'pointerup' && !d.moved) {
      const part = partAt(e.clientX, e.clientY);
      if (part) touched(part);
    }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  // The arrow keys walk along too.
  stage.tabIndex = 0;
  stage.addEventListener('keydown', e => {
    if (!fig.pan || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault(); fig.pan.by(st, e.key === 'ArrowRight' ? 60 : -60);
  });

  // id is the tapped part's name, with #n when there are several of a kind (the eggs).
  function touched(id) {
    const part = id.split('#')[0];
    hl = id; hlUntil = performance.now() + 900;
    $('hint').classList.add('gone');
    const also = fig.tap ? fig.tap(st, part, id) : null;
    drawActs();   // a tap can make a button ready (Weigh it, Pay) at once
    if (find) return checkFind(part, also);
    say(part, also);
  }

  // ---------- buttons ----------
  // Redrawn only when their words change (a button can also be not ready yet, like Finish).
  function drawActs() {
    const html = fig.actions.map((a, i) => {
      const w = a.word(st), off = a.ready && !a.ready(st);
      return `<button class="act" type="button" data-i="${i}"${off ? ' disabled' : ''}>${a.label(st)}${w ? `<span class="chip">${w}</span>` : ''}</button>`;
    }).join('');
    if ($('acts').dataset.html !== html) { $('acts').innerHTML = html; $('acts').dataset.html = html; }
  }
  $('acts').addEventListener('click', e => {
    const b = e.target.closest('.act'); if (!b || b.disabled) return;
    const a = fig.actions[+b.dataset.i], w = a.word(st);
    a.run(st);
    if (w && !find) say(w);
    drawActs(); drawInfo();
  });
  // A thing's own notes (fig.info), redrawn when they change; a button in them with data-go calls fig.go.
  function drawInfo() {
    const html = fig.info ? fig.info(st) : '';
    $('info').hidden = !html;
    if ($('info').dataset.html !== html) { $('info').innerHTML = html; $('info').dataset.html = html; }
  }
  $('info').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b || !fig.go) return;
    fig.go(st, b.dataset.go); drawActs(); drawInfo();
  });
  setInterval(() => { drawActs(); syncSwatches(); drawInfo(); }, 400);

  const toggle = (id, on) => $(id).setAttribute('aria-pressed', on);
  // Labels step through the figure's groups (House, Yard, …), then off.
  const showLabels = n => {
    const groups = fig.labelGroups || ['all'];
    labels = n % (groups.length + 1);
    toggle('t-labels', labels > 0);
    $('t-labels').textContent = labels && fig.labelGroups ? `Labels: ${groups[labels - 1]}` : 'Labels';
  };
  $('t-labels').onclick = () => showLabels(labels + 1);
  $('t-turn').onclick = () => { spin = !spin; toggle('t-turn', spin); };
  $('t-front').onclick = () => { spin = false; toggle('t-turn', false); yaw = fig.view.yaw; };
  $('t-pen').onclick = () => { pen = !pen; toggle('t-pen', pen); };

  // Colour swatches: a swatch named by a Mizo word says it when picked. A thing may have none.
  function drawSwatches() {
    const sw = fig.swatches;
    $('swlabel').style.display = $('swatches').style.display = sw ? '' : 'none';
    if (!sw) { $('swatches').innerHTML = ''; return; }
    $('swlabel').textContent = sw.label;
    $('swatches').innerHTML = Object.entries(sw.list).map(([k, c]) => `<button class="swatch" type="button" data-k="${k}" style="background:${c}" aria-label="${WORDS[k] ? `${k}, ${WORDS[k]}` : k}"></button>`).join('');
    syncSwatches();
  }
  const syncSwatches = () => document.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', st[fig.swatches.key] === x.dataset.k));
  $('swatches').addEventListener('click', e => {
    const b = e.target.closest('.swatch'); if (!b) return;
    st[fig.swatches.key] = b.dataset.k;
    syncSwatches();
    if (WORDS[b.dataset.k] && !find) say(b.dataset.k);
  });

  // ---------- Find it: tap the part that is named ----------
  let find = null;
  const ROUND = 8;
  function nextFind() {
    const pool = [...new Set(visibleAnchors(Ink3D.camera(yaw, fig.view.pitch)).map(a => a.part))].filter(p => WORDS[p] && p !== (find && find.word));   // names are not asked for
    find.word = pool[Math.floor(Math.random() * pool.length)];
    find.miss = 0;
    $('findw').textContent = find.word;
    $('findhint').textContent = '';
  }
  function startFind() {
    find = { word: null, found: 0 };
    showLabels(0);
    $('findbar').hidden = false; toggle('t-find', true);
    nextFind();
  }
  function stopFind() { find = null; $('findbar').hidden = true; toggle('t-find', false); }
  function checkFind(part, also) {
    if (part === find.word) {
      say(part, also, 'good');
      stars++; find.found++; showStars();
      try { localStorage.setItem('hn-things-stars', stars); } catch (e) {}
      if (find.found >= ROUND) {
        hnStat(`things/${fig.id}/win`, `Touch and learn: ${fig.sub} won`);
        $('findw').textContent = 'Well done!';
        $('findhint').textContent = `You found ${ROUND} things.`;
        find.word = null;
        setTimeout(() => { if (find && !find.word) { find.found = 0; nextFind(); } }, 2200);
      } else setTimeout(() => { if (find) nextFind(); }, 650);
    } else {
      say(part, also, 'bad');
      if (++find.miss >= 1 && find.word) $('findhint').textContent = `(${WORDS[find.word]})`;
    }
  }
  $('t-find').onclick = () => find ? stopFind() : startFind();
  $('skip').onclick = () => { if (find) nextFind(); };

  // ---------- choosing a thing ----------
  function useFig(f) {
    fig = f; st = f.init();
    [VX, VY, VW, VH] = f.view.box.split(' ').map(Number);
    svg.setAttribute('viewBox', f.view.box); skyEl.setAttribute('viewBox', f.view.box);
    svg.style.aspectRatio = `${VW} / ${VH}`;
    svg.setAttribute('aria-label', `${f.name}: ${f.sub}. Tap a part to see its Mizo name.`);
    $('fname').textContent = f.name;
    $('fsub').textContent = `· ${f.sub}`;
    yaw = f.view.yaw; spin = false; toggle('t-turn', false); hl = null;
    $('t-turn').hidden = $('t-front').hidden = !!f.pan;   // a village is walked along, not turned
    stage.classList.toggle('pan', !!f.pan);
    $('hint').textContent = f.hint || 'Tap anything · drag to turn'; $('hint').classList.remove('gone');
    cv.z = 1; [cv.x, cv.y] = f.view.centre;
    stopFind(); showLabels(0);
    wordEl.className = 'word idle'; wordEl.innerHTML = '<b>Tap anything</b><span>to see its Mizo name</span>';
    $('acts').dataset.html = ''; drawActs(); drawSwatches(); drawInfo();
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === f.id));
    try { history.replaceState(null, '', '#' + f.id); } catch (e) {}
    hnStat(`things/${f.id}`, `Touch and learn: ${f.sub}`);
  }
  $('tabs').innerHTML = FIGS.map(f => `<button type="button" role="tab" data-id="${f.id}">${f.name}</button>`).join('');
  $('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.id !== fig.id) useFig(FIGS.find(f => f.id === b.dataset.id)); });
  // La siam's last step sends the thread to the loom through the address.
  addEventListener('hashchange', () => { const f = FIGS.find(f => '#' + f.id === location.hash); if (f && f !== fig) useFig(f); });
  useFig(fig);
})();
</script>
