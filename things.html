      xn: [...hz.map(z => ({ pts: [[-55.05, -35, z], [-55.05, 45, z]], stroke: WALL_LINE, open: true })),
        shut([[-55.06, 2, 32], [-55.06, 16, 32], [-55.06, 16, 44], [-55.06, 2, 44]], 'tukverh')],
      yn: [...hz.map(z => ({ pts: [[-55, -35.05, z], [5, -35.05, z]], stroke: WALL_LINE, open: true })),
        shut([[-40, -35.06, 32], [-26, -35.06, 32], [-26, -35.06, 44], [-40, -35.06, 44]], 'tukverh')],
    };
  }

  const planks = (n, w, h) => map => Array.from({ length: n - 1 }, (_, i) => ({ pts: [map(w * (i + 1) / n, 1), map(w * (i + 1) / n, h - 1)], stroke: PLANK, open: true }));

  // dz lifts the roof off when you look inside.
  function roof(s, dz = 0) {
    const R = ROOFS[s.roof], up = p => [p[0], p[1], p[2] + dz];
    // The gable ends: a wall-coloured prism under the roof, drawn before the roof sheets.
    const A = up([5, -35, 58]), B = up([-55, -35, 58]), C = up([-25, -35, 78]), A2 = up([5, 45, 58]), B2 = up([-55, 45, 58]), C2 = up([-25, 45, 78]);
    const gl = (y, e) => [62, 66, 70, 74].map(z => { const h = 30 * (78 - z) / 20; return { pts: [up([-25 - h, y + e, z]), up([-25 + h, y + e, z])], stroke: WALL_LINE, open: true }; });
    const gable = solid([
      { pts: [A, B, C], decals: gl(-35, -0.05) }, { pts: [A2, C2, B2], decals: gl(45, 0.05) },
      { pts: [A, A2, B2, B] }, { pts: [A, C, C2, A2] }, { pts: [B, B2, C2, C] },
    ], { pal: WALL, part: 'bang', bias: -1000 });
    const sheet = ex => {
      const z0 = 52.7 + dz, z1 = 78 + dz, y0 = -43, y1 = 53, th = 3;
      const ribs = [];
      for (let y = y0 + 4; y < y1; y += 4) ribs.push({ pts: [[ex, y, z0 + th + 0.05], [-25, y, z1 + th + 0.05]], stroke: R.d, opacity: 0.45, open: true });
      return Ink3D.hexa([[ex, y0, z0], [-25, y0, z1], [-25, y1, z1], [ex, y1, z0],
        [ex, y0, z0 + th], [-25, y0, z1 + th], [-25, y1, z1 + th], [ex, y1, z0 + th]], { pal: R, part: 'chungkhuh', decals: { zp: ribs } });
    };
    return group([gable, sheet(13), sheet(-63)], { part: 'chungkhuh' });
  }

  // The house is one group drawn as a whole, so the rooms inside sort among themselves:
  // the far walls first, then the things in the room, then the near walls.
  const WALLS = [
    { key: 'xp', n: [1, 0, 0], at: [3.5, 5, -35, 45] }, { key: 'xn', n: [-1, 0, 0], at: [-55, -53.5, -35, 45] },
    { key: 'yp', n: [0, 1, 0], at: [-53.5, 3.5, 43.5, 45] }, { key: 'yn', n: [0, -1, 0], at: [-53.5, 3.5, -35, -33.5] },
  ];
  // Walls facing you are cut down when you look inside, like a doll's house.
  const nearWall = (s, cam, key) => s.inside > 0.01 && dot(WALLS.find(w => w.key === key).n, cam.view) > 0.12;

  function house(s, cam) {
    const kids = [], k = s.inside, deco = walls(s), bias = {};
    for (const x of [-55, -12, 27]) for (const y of [-35, 5, 45]) kids.push(box(x - 1.7, x + 1.7, y - 1.7, y + 1.7, 0, 18, { pal: POST, skip: ['zp'], bias: -3000 }));
    const deck = [];
    for (let x = 9; x < 30; x += 5) deck.push({ pts: [[x, -38, 22.05], [x, 48, 22.05]], stroke: PLANK, open: true });
    kids.push(box(-58, 30, -38, 48, 18, 22, { pal: WOOD, part: 'chhuat', decals: { zp: deck }, bias: -2000 }));
    for (const w of WALLS) {
      const near = nearWall(s, cam, w.key), top = near ? 58 - 32 * k : 58;
      bias[w.key] = near ? 1000 : -1000;
      const dec = near ? deco[w.key].filter(d => d.open && d.pts[0][2] < top - 0.5) : deco[w.key];
      // The inner face shows the same bamboo strips.
      const inner = { xp: 'xn', xn: 'xp', yp: 'yn', yn: 'yp' }[w.key], ix = w.key[0] === 'x';
      const at = w.key[1] === 'p' ? (ix ? w.at[0] : w.at[2]) - 0.05 : (ix ? w.at[1] : w.at[3]) + 0.05;
      const strips = [];
      for (let z = 26; z < top - 0.5; z += 4) strips.push({ pts: ix ? [[at, w.at[2], z], [at, w.at[3], z]] : [[w.at[0], at, z], [w.at[1], at, z]], stroke: WALL_LINE, open: true });
      kids.push(box(...w.at, 22, top, { pal: WALL, part: 'bang', decals: { [w.key]: dec, [inner]: strips }, bias: bias[w.key] }));
    }
    const shown = key => !(nearWall(s, cam, key) && k > 0.2);
    if (shown('xp')) kids.push(panel([5, 0, 22], [0, 1, 0], [1, 0, 0], 16, 26, 1.4, 100 * s.door, { pal: WOOD, part: 'kawngkhar', decal: planks(3, 16, 26), bias: bias.xp + 1 }));
    if (shown('xp')) kids.push(panel([5, 38, 32], [0, -1, 0], [1, 0, 0], 14, 12, 1.2, 105 * s.win, { pal: WOOD, part: 'tukverh', decal: planks(3, 14, 12), bias: bias.xp + 1 }));
    if (shown('yp')) kids.push(panel([-26, 45, 32], [-1, 0, 0], [0, 1, 0], 16, 12, 1.2, 105 * s.win, { pal: WOOD, part: 'tukverh', decal: planks(3, 16, 12), bias: bias.yp + 1 }));
    if (k > 0.01) kids.push(...room(s));
    if (k < 0.98) kids.push({ ...roof(s, 90 * k * k), bias: 2000 });
    // The lamp under the eaves glows at night.
    if (k < 0.2) {
      const lampOn = mix('#efe6cf', '#ffd04d', s.night);
      kids.push(group([
        line([[10, -6, 54.5], [10, -6, 48.6]], { col: '#4b4038', w: 0.6, ink: false }),
        ball([10, -6, 46.5], 2.4, { fill: lampOn, glow: true }),
        ball([10, -6, 46.5], 9, { fill: '#ffd36b', glow: true, ink: false, opacity: 0.32 * s.night, bias: 0.1 }),
      ], { part: 'khawnvâr', shadow: false, bias: 2100 }));
    }
    const items = [group(kids, { at: [-25, 5, 22] })];
    // A ladder down from the porch.
    const lad = [];
    for (const y of [1, 13]) lad.push(line([[31, y, 22], [47, y, 0]], { col: WOOD.m, w: 1.6 }));
    for (let i = 1; i < 5; i++) { const t = i / 5; lad.push(line([[31 + 16 * t, 1, 22 - 22 * t], [31 + 16 * t, 13, 22 - 22 * t]], { col: WOOD.l, w: 1.2 })); }
    items.push(group(lad));
    return items;
  }

  // ---------- inside: the kitchen hearth, a bed, a table, a chair and a mat ----------
  function room(s) {
    const kids = [];
    // The mat lies on the floor, so it is drawn before anything that stands.
    const mat = [poly([[-10, -30, 22.06], [2, -30, 22.06], [2, -16, 22.06], [-10, -16, 22.06]], { fill: '#d8b56a', w: 0.7 })];
    for (let x = -7; x < 2; x += 3) mat.push(line([[x, -30, 22.1], [x, -16, 22.1]], { col: '#b08a4f', w: 0.5, ink: false }));
    kids.push(group(mat, { part: 'chhuatphah', bias: -500 }));
    // The hearth (choka): an earth box with three stones and the pot on them.
    const hearth = [box(-50, -36, -30, -16, 22, 24.5, { pal: ASH, part: 'choka' })];
    for (let i = 0; i < 3; i++) { const a = i / 3 * 2 * Math.PI + 0.4; hearth.push(ball([-43 + Math.cos(a) * 3.6, -23 + Math.sin(a) * 3.6, 25.6], 1.7, { pal: STONE, part: 'choka' })); }
    if (s.fire) {
      const f = Math.sin(s.t * 11) * 0.8;
      hearth.push(ball([-43, -23, 26.5], 7, { fill: '#ffb347', glow: true, ink: false, opacity: 0.35, part: 'mei', shadow: false }));
      hearth.push(poly([[-45, -23, 24.6], [-41, -23, 24.6], [-43 + f * 0.4, -23, 29.5 + f]], { fill: FIRE, glow: true, part: 'mei', w: 0.6 }));
      hearth.push(poly([[-43, -25, 24.6], [-43, -21, 24.6], [-43, -23 - f * 0.4, 28.5 - f]], { fill: '#ffd04d', glow: true, part: 'mei', w: 0.6 }));
    }
    hearth.push(cyl([-43, -23], 26.6, 32.5, 4, 4.8, { pal: IRON, capFill: '#3a3633', part: 'bel' }));
    kids.push(group(hearth, { part: 'choka' }));
    // The bed (khum) with a striped Mizo puan over it.
    const stripes = [];
    for (const [y, c] of [[26, '#231e16'], [29, '#2f8a4a'], [33, '#231e16'], [37, '#ffffff'], [40, '#2f8a4a']]) {
      stripes.push({ pts: [[-51.5, y, 28.55], [-36.5, y, 28.55], [-36.5, y + 1.4, 28.55], [-51.5, y + 1.4, 28.55]], fill: c, w: 0.3 });
    }
    kids.push(group([
      box(-52, -36, 22, 42, 22, 26.5, { pal: WOOD, part: 'khum' }),
      box(-51.5, -36.5, 22.5, 41.5, 26.5, 28.5, { pal: PUAN, part: 'puan', decals: { zp: stripes } }),
      box(-51.5, -47, 24, 40, 28.5, 30.5, { pal: LINEN, part: 'khum' }),
    ], { part: 'khum' }));
    // A low table (dawhkân) and a chair (ṭhutthlêng).
    const legs = (x0, x1, y0, y1, z1, part) => [[x0, y0], [x1 - 1.2, y0], [x0, y1 - 1.2], [x1 - 1.2, y1 - 1.2]].map(([x, y]) => box(x, x + 1.2, y, y + 1.2, 22, z1, { pal: POST, part }));
    kids.push(group([...legs(-28, -14, -4, 10, 29, 'dawhkân'), box(-28.5, -13.5, -4.5, 10.5, 29, 30.5, { pal: WOOD, part: 'dawhkân' })], { part: 'dawhkân' }));
    // The lamp stands on the table and lights the room at night.
    kids.push(group([
      cyl([-21, 3], 30.5, 32, 1.6, 1.2, { pal: IRON }),
      ball([-21, 3, 33.6], 1.8, { fill: mix('#efe6cf', '#ffd04d', s.night), glow: true }),
      ball([-21, 3, 33.6], 16, { fill: '#ffd36b', glow: true, ink: false, opacity: 0.3 * s.night, bias: 5, shadow: false }),
    ], { part: 'khawnvâr', shadow: false }));
    kids.push(group([...legs(-12, -6, 0, 6, 26, 'ṭhutthlêng'), box(-12.3, -5.7, -0.3, 6.3, 26, 27.2, { pal: WOOD, part: 'ṭhutthlêng' }),
      box(-7, -5.7, -0.3, 6.3, 27.2, 34, { pal: WOOD, part: 'ṭhutthlêng' })], { part: 'ṭhutthlêng' }));
    // At night the family is home: nu and pi warm their hands at the hearth.
    if (s.night > 0.5) {
      s_t = s.t;
      kids.push(group(person([-33, -23, 22], Math.PI, { ...NU, pose: 'wash' }), { part: 'nu' }));
      kids.push(group(person([-43, -11, 22], -Math.PI / 2, { ...PI, pose: 'wash' }), { part: 'pi' }));
      kids.push(group(person([-30, 18, 22], -Math.PI * 0.6, { ...PA, pose: 'stand' }), { part: 'pa' }));
      kids.push(group(person([-14, 16, 22], -Math.PI * 0.75, { ...NAUPANG, pose: 'stand' }), { part: 'naupang' }));
    }
    return kids;
  }

  // ---------- the yard ----------
  function yard(s) {
    const items = [];
    const leaf = (c, r, i) => { const w = swayAt(s, i) * 0.35 * (c[2] / 60); return ball([c[0] + WIND[0] * w, c[1] + WIND[1] * w, c[2]], r, { pal: LEAF }); };
    items.push(group([
      cyl([55, -65], 0, 36, 4, 2.8, { pal: BARK }),
      leaf([55, -65, 50], 16, 0), leaf([63, -58, 40], 11, 1), leaf([46, -70, 41], 11, 2), leaf([57, -72, 62], 10, 3),
    ], { part: 'thing' }));
    // Bamboo: each culm is drawn in short lengths, so it bends in the wind and its joints show.
    const culms = [[-62, 66, 70], [-57, 71, 62], [-67, 72, 76], [-60, 76, 58], [-69, 63, 66]];
    const bam = [];
    culms.forEach(([x, y, h], i) => {
      const at = z => { const k = (z / h) ** 2 * swayAt(s, i * 0.7) * 1.6; return [x + WIND[0] * k, y + WIND[1] * k, z]; };
      for (let z = 0; z < h; z += 10) bam.push(line([at(z), at(Math.min(h, z + 10))], { col: BAMBOO.m, w: 2.6 }));
      const top = at(h);
      bam.push(ball([top[0] + 3, top[1] + (i % 2 ? 3 : -3), h + 2], 6, { pal: BAMBOO_LEAF }));
    });
    items.push(group(bam, { part: 'mau' }));
    const blooms = [['#f06292', 58, -30], ['#ffc94a', 63, -24], ['#e2483d', 54, -38], ['#f06292', 66, -36], ['#ffc94a', 61, -45]];
    items.push(group(blooms.flatMap(([c, x, y]) => [
      line([[x, y, 0], [x + WIND[0] * swayAt(s, x) * 0.3, y + WIND[1] * swayAt(s, x) * 0.3, 6]], { col: '#4f8d3a', w: 0.7, ink: false }),
      ball([x, y, 1.8], 2.4, { pal: LEAF }),
      ball([x + WIND[0] * swayAt(s, x) * 0.3, y + WIND[1] * swayAt(s, x) * 0.3, 7], 2.2, { fill: c }),
    ]), { part: 'pangpâr' }));
    // Fence along the front, with a gap for the path, and along the right-hand side.
    const fence = (a, b, n) => {
      const kids = [];
      for (let i = 0; i <= n; i++) { const p = Ink3D.lerp3(a, b, i / n); kids.push(box(p[0] - 1.1, p[0] + 1.1, p[1] - 1.1, p[1] + 1.1, 0, 13, { pal: POST })); }
      for (let i = 0; i < n; i++) for (const z of [5, 10]) {
        const p = Ink3D.lerp3(a, b, i / n), q = Ink3D.lerp3(a, b, (i + 1) / n);
        kids.push(line([[p[0], p[1], z], [q[0], q[1], z]], { col: WOOD.l, w: 1.1 }));
      }
      return group(kids, { part: 'pal' });
    };
    items.push(fence([84, -84, 0], [84, -6, 0], 6), fence([84, 28, 0], [84, 84, 0], 5), fence([-84, -84, 0], [78, -84, 0], 12));
    items.push(cyl([40, -9], 0, 11, 3.2, 5.4, { pal: CANE, bands: [3.6, 7.2], capFill: '#6b5126', part: 'êm', bias: -1 }));
    items.push(hen(s), cat(s), coop(s), pig(s), ...family(s), ...friends(s));
    s.eggs.forEach((e, i) => items.push(ball([e.x, e.y, 2.2], 2.2, { fill: '#fbf3e4', w: 0.7, part: 'artui#' + i })));
    // Eggs you picked up sit in the basket.
    for (let i = 0; i < Math.min(s.got, 4); i++) { const a = i * 1.7; items.push(ball([40 + Math.cos(a) * 2, -9 + Math.sin(a) * 2, 11.6], 1.6, { fill: '#fbf3e4', w: 0.6, part: 'êm', bias: 1, shadow: false })); }
    for (const p of s.puffs) {
      const k = p.age / 4.2;
      items.push(ball([p.x, p.y, p.z], 2.5 + k * 7, { fill: '#dcd8d0', opacity: 0.7 * (1 - k), w: 0.5, part: 'meikhu', shadow: false }));
    }
    return items;
  }

  function henPos(s) { const a = s.hen; return [46 + 12 * Math.cos(a), 56 + 12 * Math.sin(a), 0]; }
  function hen(s) {
    const a = s.hen + Math.PI / 2, d = [Math.cos(a), Math.sin(a), 0], sd = [-d[1], d[0], 0], p = henPos(s);
    const sleep = s.night > 0.5, k = sleep ? 0 : s.peck;
    const at = (f, sv, z) => add(add(add(p, mul(d, f)), mul(sd, sv)), [0, 0, z]);
    const head = at(4 + 1.5 * k, 0, (sleep ? 9 : 11.5) - 6 * k);
    return group([
      line([at(0, 1.3, 4), at(0.4, 1.3, 0)], { col: '#f2b431', w: 0.8 }),
      line([at(0, -1.3, 4), at(0.4, -1.3, 0)], { col: '#f2b431', w: 0.8 }),
      poly([at(-3, 0, 8), at(-7.5, 0, 13.5), at(-2.5, 0, 11.5)], { fill: HEN.d }),
      ball(at(0, 0, 7), 4.6, { pal: HEN }),
      ball(head, 2.6, { pal: HEN }),
      ball(add(head, [0, 0, 2.3]), 1.1, { fill: '#d8342c', w: 0.5 }),
      poly([add(head, add(mul(d, 2.2), mul(sd, 0.8))), add(head, add(mul(d, 2.2), mul(sd, -0.8))), add(head, add(mul(d, 4.3), [0, 0, -0.4]))], { fill: '#f2b431', w: 0.6 }),
    ], { part: 'arpui' });
  }

  // The hens' coop (arbawm): a small house on legs with a thatch roof and a ramp.
  function coop(s) {
    const kids = [];
    for (const [x, y] of [[62.5, 60.5], [75.5, 60.5], [62.5, 75.5], [75.5, 75.5]]) kids.push(box(x - 0.9, x + 0.9, y - 0.9, y + 0.9, 0, 4, { pal: POST, bias: -1 }));
    const door = mix(INSIDE, GLOW, s.night * 0.4);
    kids.push(box(62, 76, 60, 76, 4, 14, { pal: WALL, decals: { xp: [
      ...[7, 10].map(z => ({ pts: [[76.05, 60, z], [76.05, 64.5, z]], stroke: WALL_LINE, open: true })),
      ...[7, 10].map(z => ({ pts: [[76.05, 71.5, z], [76.05, 76, z]], stroke: WALL_LINE, open: true })),
      { pts: [[76.06, 65, 5], [76.06, 71, 5], [76.06, 71, 11], [76.06, 65, 11]], fill: door, glow: true }] } }));
    const E0 = [60.5, 58.5, 13.5], E1 = [77.5, 58.5, 13.5], R0 = [69, 58.5, 20], E2 = [60.5, 77.5, 13.5], E3 = [77.5, 77.5, 13.5], R1 = [69, 77.5, 20];
    kids.push(solid([{ pts: [E0, E1, R0] }, { pts: [E2, R1, E3] }, { pts: [E0, E2, E3, E1] }, { pts: [E1, E3, R1, R0] }, { pts: [E0, R0, R1, E2] }], { pal: THATCH, bias: 1 }));
    kids.push(line([[76.5, 68, 4.5], [83, 68, 0]], { col: WOOD.l, w: 2.2, bias: 2 }));
    return group(kids, { part: 'arbawm' });
  }

  // The pig (vawk) trots between the house and the bamboo.
  function pig(s) {
    const asleep = s.night > 0.5, dir = Math.cos(s.pig) >= 0 ? 1 : -1;
    const p = [-5 + 28 * Math.sin(s.pig), 68, 0], d = [dir, 0, 0], sd = [0, dir, 0];
    const hop = Math.sin(Math.min(1, s.pigHop / 0.4) * Math.PI) * 4, trot = asleep ? 0 : Math.sin(s.t * 9) * 0.5;
    const at = (f, sv, z) => add(add(add(p, mul(d, f)), mul(sd, sv)), [0, 0, z + hop]);
    const lo = asleep ? -1.6 : 0;
    const head = at(6, 0, 6.8 + lo);
    const kids = [
      ball(at(1, 0, 5.6 + lo), 5.3, { pal: PIG }), ball(at(-3.6, 0, 5.3 + lo), 4.9, { pal: PIG }),
      ball(head, 3.7, { pal: PIG }),
      ball(add(head, add(mul(d, 3.4), [0, 0, -0.6])), 1.7, { fill: '#f08ca0', w: 0.7 }),
      ...[-1, 1].map(e => poly([add(head, add(mul(sd, 1 * e), [0, 0, 2.6])), add(head, add(mul(sd, 3 * e), [0, 0, 2])), add(head, add(add(mul(sd, 2.4 * e), mul(d, 1.6)), [0, 0, 4.6]))], { pal: PIG })),
      line([at(-8, 0, 7 + lo), at(-9.4, 0.8, 8.4 + lo), at(-8.6, 1.6, 9.2 + lo)], { col: PIG.m, w: 0.8 }),
    ];
    kids.push(...(asleep
      ? [-1, 1].map(e => line([add(head, add(add(mul(d, 2.8), mul(sd, 1.4 * e - 0.5)), [0, 0, 1])), add(head, add(add(mul(d, 2.8), mul(sd, 1.4 * e + 0.5)), [0, 0, 1]))], { col: '#231e16', w: 0.4, ink: false }))
      : [-1, 1].map(e => ball(add(head, add(add(mul(d, 2.7), mul(sd, 1.4 * e)), [0, 0, 1])), 0.55, { fill: '#231e16', ink: false }))));
    if (!asleep) for (const [f, sv, ph] of [[3, 2.2, 0], [3, -2.2, Math.PI], [-4, 2.2, Math.PI], [-4, -2.2, 0]]) {
      const sw = Math.sin(s.t * 9 + ph) * 1.2;
      kids.push(line([at(f, sv, 3), at(f + sw, sv, 0 - hop)], { col: PIG.m, w: 1.5 }));
    }
    return group(kids, { part: 'vawk' });
  }

  // ---------- the family ----------
  const HAIR = '#1d1b22', GREY_HAIR = '#cfcac2';
  // People are drawn by people.js; s_t is the clock for their hands.
  const person = (at, dir, o) => Ink3DPeople.person(at, dir, { t: s_t, ...o });
  let s_t = 0;   // the clock, for the people's hands
  const NU = { h: 22, shirt: { l: '#f48fb1', m: '#e0457b', d: '#7a1f43' }, lower: 'skirt', lowerPal: PUAN, bands: [0.24, 0.32, 0.4], hair: HAIR, bun: true };
  const PA = { h: 24, shirt: { l: '#7fb3e6', m: '#4f86c6', d: '#1f3a63' }, lower: 'shorts', lowerPal: { l: '#5a5f6b', m: '#41454f', d: '#1f2128' }, hair: HAIR };
  const PI = { h: 21, shirt: { l: '#e9e4f5', m: '#c9c0e0', d: '#5c5478' }, lower: 'skirt', lowerPal: { l: '#5f8f6a', m: '#3f6f4c', d: '#1d3524' }, bands: [0.2, 0.28], hair: GREY_HAIR, bun: true };
  const NAUPANG = { h: 15, shirt: { l: '#ffe08a', m: '#f2b431', d: '#6b4d12' }, lower: 'shorts', lowerPal: { l: '#79a8de', m: '#5786c4', d: '#1f3456' }, hair: HAIR };

  // Rova and Mami, in the colours they wear everywhere in Hnahsin.
  const ROVA = { h: 16, shirt: { l: '#3f86da', m: '#1565c0', d: '#0b3a78' }, stripe: { l: '#ffd66b', m: '#ffc94a', d: '#8a6a12' }, lower: 'shorts', lowerPal: { l: '#24456b', m: '#0d2a4a', d: '#06162a' }, hair: HAIR, shoes: '#ffffff' };
  const MAMI = { h: 15, shirt: { l: '#f27aa3', m: '#e0457b', d: '#7a1f43' }, stripe: { l: '#ffffff', m: '#f4eef2', d: '#9a8f96' }, lower: 'skirt', lowerPal: { l: '#9a4bb0', m: '#7a2a8c', d: '#3c1446' }, hair: '#24161a', ponytail: true, tie: '#7569e8', shoes: '#ffffff' };
  // They come in at the gate and play tag on the open grass in the front yard.
  const CIRCLE = [49, 30], CR = 9;
  function friendAt(s, lag, t = s.t) {
    const a = t * 1.3 - lag, onCircle = [CIRCLE[0] + CR * Math.cos(a), CIRCLE[1] + CR * Math.sin(a), 0];
    const k = s.vis;
    if (k >= 1) return onCircle;
    const path = [[100, 12 - lag * 4, 0], [80, 14 - lag * 4, 0], [60, 20 - lag * 4, 0], onCircle], u = k * 3, i = Math.min(2, Math.floor(u));
    return Ink3D.lerp3(path[i], path[i + 1], u - i);
  }
  function friends(s) {
    if (s.vis <= 0.001 || s.night > 0.5) return [];
    const out = [];
    for (const [who, o, lag] of [['Mami', MAMI, 0], ['Rova', ROVA, 0.75]]) {
      const p = friendAt(s, lag), q = friendAt(s, lag, s.t + 0.05);
      const dir = Math.atan2(q[1] - p[1], q[0] - p[0]);
      out.push(group(person(p, dir, { ...o, pose: 'run', phase: s.t * 10 + lag * 3 }), { part: who }));
    }
    return out;
  }

  function family(s) {
    if (s.night > 0.5) return [];   // at night everyone is indoors
    s_t = s.t;
    const out = [];
    // Nu sweeps the porch with a broom.
    const ny = 31 + 7 * Math.sin(s.t * 0.3), nAt = [21, ny, 22], nd = Math.PI * 0.85;
    const nk = person(nAt, nd, { ...NU, pose: 'sweep' });
    const d = [Math.cos(nd), Math.sin(nd), 0], sd = [-d[1], d[0], 0], sw = Math.sin(s.t * 4) * 3;
    const grip = add(nAt, add(mul(d, 4), [0, 0, 11.5])), foot = add(nAt, add(add(mul(d, 8.5), mul(sd, sw)), [0, 0, 0.6]));
    const broom = [line([grip, foot], { col: '#b98a4e', w: 0.9 }),
      poly([add(foot, add(mul(sd, -2.4), [0, 0, -0.5])), add(foot, add(mul(sd, 2.4), [0, 0, -0.5])), add(foot, [0, 0, 3])], { fill: '#d8b56a', w: 0.6 })];
    out.push(group(nk, { part: 'nu' }), group(broom, { part: 'hmunphiah', shadow: false }));
    // Pa walks the path to the gate and back.
    const k = (1 - Math.cos(s.t * 0.35)) / 2, goingOut = Math.sin(s.t * 0.35) >= 0;
    const pAt = [50 + 30 * k, 8 + 5 * k, 0];
    out.push(group(person(pAt, goingOut ? 0.16 : Math.PI + 0.16, { ...PA, pose: 'walk', phase: s.t * 5 }), { part: 'pa' }));
    // Pi washes clothes in a tub of water; the washing hangs on a line in the wind.
    out.push(group(person([58, -12, 0], 0, { ...PI, pose: 'wash' }), { part: 'pi' }));
    out.push(cyl([67, -12], 0, 5.5, 4.6, 5.8, { pal: IRON, capFill: mix('#8cc7ea', '#5f9fd0', 0.5 + 0.5 * Math.sin(s.t * 7)), part: 'tui' }));
    const line1 = [-40, 82, 15], line2 = [8, 82, 15];
    const wash = [box(-40.8, -39.2, 81.2, 82.8, 0, 16, { pal: POST }), box(7.2, 8.8, 81.2, 82.8, 0, 16, { pal: POST }),
      line([line1, line2], { col: '#e8e2d4', w: 0.4, ink: false })];
    [[-31, PUAN], [-17, { l: '#7cc48f', m: '#57a26f', d: '#24452f' }], [-3, { l: '#ffd36b', m: '#e2a92f', d: '#6b4d12' }]].forEach(([x, pal], i) => {
      const a = (0.08 + s.wind * 0.75) * (0.8 + 0.2 * Math.sin(s.t * (2 + s.wind * 3) + i)), drop = 10;
      const off = [WIND[0] * Math.sin(a) * drop, WIND[1] * Math.sin(a) * drop, -Math.cos(a) * drop];
      const T0 = [x - 5, 82, 15], T1 = [x + 5, 82, 15];
      const bands = [[0, 0.45, pal.m], [0.45, 0.6, '#231e16'], [0.6, 1, pal.l]];
      for (const [u0, u1, c] of bands) {
        const q = u => [add(T0, mul(off, u)), add(T1, mul(off, u))];
        const [a0, a1] = q(u0), [b0, b1] = q(u1);
        wash.push(poly([a0, a1, b1, b0], { fill: c, w: 0.5, part: 'puan' }));
      }
    });
    out.push(group(wash, { shadow: true }));
    // Naupang chases the pig.
    const pg = -5 + 28 * Math.sin(s.pig), dir = Math.cos(s.pig) >= 0 ? 1 : -1;
    out.push(group(person([pg - dir * 11, 66, 0], dir > 0 ? 0 : Math.PI, { ...NAUPANG, pose: 'run', phase: s.t * 9 }), { part: 'naupang' }));
    return out;
  }

  function cat(s) {
    const C = [19, -26, 22], d = Ink3D.norm([1, 0.7, 0]), sd = [-d[1], d[0], 0];
    const asleep = s.night > 0.5 && s.catWake <= 0;
    const at = (f, sv, z) => add(add(add(C, mul(d, f)), mul(sd, sv)), [0, 0, z]);
    const head = at(asleep ? 3.6 : 3.2, 0, asleep ? 5.2 : 9.6);
    const sw = Math.sin(s.t * (asleep ? 0.8 : 2.2)) * (asleep ? 0.6 : 2);
    const ear = side => poly([add(head, add(mul(sd, 0.6 * side), [0, 0, 2.2])), add(head, add(mul(sd, 2.7 * side), [0, 0, 1.4])), add(head, add(mul(sd, 2 * side), [0, 0, 4.8]))], { pal: CAT });
    const eyes = asleep
      ? [-1, 1].map(e => line([add(head, add(add(mul(d, 2.9), mul(sd, 1.2 * e - 0.5)), [0, 0, 0.5])), add(head, add(add(mul(d, 2.9), mul(sd, 1.2 * e + 0.5)), [0, 0, 0.5]))], { col: '#231e16', w: 0.4, ink: false }))
      : [-1, 1].map(e => ball(add(head, add(add(mul(d, 2.7), mul(sd, 1.2 * e)), [0, 0, 0.6])), 0.6, { fill: '#2f6b3a', ink: false }));
    return group([
      line([at(-3.5, 0, 1.5), at(-6, 2 + sw * 0.3, 2.5), at(-5.5, 4.5 + sw, asleep ? 2 : 7)], { col: CAT.m, w: 1.6 }),
      ball(at(0, 0, 4.4), 4.6, { pal: CAT }),
      ball(head, 3.2, { pal: CAT }),
      ear(1), ear(-1), ...eyes,
    ], { part: 'zawhte' });
  }

  function scene(s, cam) {
    const slab = box(-90, 90, -90, 90, -12, 0, { pal: EARTH, pals: { zp: GRASS }, shadow: false });
    const path = poly([[46, 0, 0.05], [84, 2, 0.05], [84, 24, 0.05], [44, 15, 0.05]], { fill: '#dcc596', part: 'kawng', w: 0.7 });
    return { ground: [slab], groundDecals: [path], clip: [[-90, -90, 0], [90, -90, 0], [90, 90, 0], [-90, 90, 0]], items: [...house(s, cam), ...yard(s)] };
  }

  // ---------- the sky (behind) and the weather (in front) ----------
  const STARS = [[-60, -130], [-20, -118], [30, -132], [62, -108], [-112, -96], [116, -92], [2, -104], [-86, -126], [88, -132], [44, -96], [-40, -100], [122, -118]];
  const SUN = [-102, -114], MOON = [102, -114];
  function cloud(x, y, k, fill) {
    const c = [[0, 0, 11], [12, 3, 9], [-12, 4, 8], [5, -7, 9]].map(([dx, dy, r]) => [x + dx * k, y + dy * k, r * k]);
    return `<g data-p="chhum">${c.map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}" fill="none" stroke="#231e16" stroke-width="1.8"/>`).join('')}${c.map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}" fill="${fill}"/>`).join('')}</g>`;
  }
  function sky(s) {
    const T = timeAt(s), top = mix(T.top, mix('#9aa6b2', '#0e1631', s.night), s.rain * 0.85), low = mix(T.low, mix('#c9d0d6', '#2b3866', s.night), s.rain * 0.85);
    let o = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${low}"/></linearGradient></defs>`;
    o += `<rect x="-140" y="-150" width="280" height="240" fill="url(#sky)" data-p="vân"/>`;
    const sunA = (1 - s.night) * (1 - s.rain * 0.8);
    const [sx, sy] = T.sun;
    if (sunA > 0.02) o += `<g data-p="ni" opacity="${sunA.toFixed(2)}"><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="20" fill="#ffe28a" opacity=".45"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="13" fill="${T.sunC}" stroke="#231e16" stroke-width="1"/></g>`;
    // After rain, a rainbow while the sun is out.
    const bowA = Math.min(1, s.bow / 3) * (1 - s.rain) * (1 - s.night);
    if (bowA > 0.02) o += `<g data-p="chhimbâl" opacity="${bowA.toFixed(2)}" fill="none" stroke-width="4.4">${['#e2483d', '#f39a3a', '#ffd84a', '#5bbf5a', '#4f8fe0', '#7a5cc8'].map((c, i) => { const r = 128 - i * 4.2; return `<path d="M${30 - r} 30A${r} ${r} 0 0 1 ${30 + r} 30" stroke="${c}"/>`; }).join('')}</g>`;
    const nightA = Math.max(0, (s.night - 0.3) / 0.7) * (1 - s.rain * 0.85);
    if (nightA > 0.02) {
      o += `<g data-p="arsi" opacity="${nightA.toFixed(2)}">${STARS.map(([x, y], i) => { const r = 1.6 + (i % 3) * 0.6, tw = 0.6 + 0.4 * Math.sin(s.t * 2 + i); return `<path d="M${x} ${y - r * 2}L${x + r * 0.6} ${y - r * 0.6}L${x + r * 2} ${y}L${x + r * 0.6} ${y + r * 0.6}L${x} ${y + r * 2}L${x - r * 0.6} ${y + r * 0.6}L${x - r * 2} ${y}L${x - r * 0.6} ${y - r * 0.6}Z" fill="#fff4c2" opacity="${tw.toFixed(2)}"/>`; }).join('')}<rect x="-130" y="-140" width="260" height="50" fill="transparent"/></g>`;
      o += `<g data-p="thla" opacity="${nightA.toFixed(2)}"><circle cx="${MOON[0]}" cy="${MOON[1]}" r="11" fill="#f6efcf" stroke="#231e16" stroke-width="1"/><circle cx="${MOON[0] + 5}" cy="${MOON[1] - 3}" r="9.5" fill="${top}"/></g>`;
    }
    // Hills far behind.
    const hill = (pts, fill) => `<path data-p="tlang" d="M-140 90${pts}L140 90Z" fill="${mix(mix(fill, '#8d9aa6', s.rain * 0.5), '#1c2a52', s.night * 0.7)}" stroke="#231e16" stroke-width=".8" stroke-opacity=".35"/>`;
    o += hill('L-140 -52Q-110 -84 -76 -66Q-44 -98 -6 -74Q30 -100 64 -72Q96 -92 140 -58', '#a8cfb4');
    o += hill('L-140 -30Q-104 -62 -64 -42Q-20 -66 22 -44Q66 -70 140 -34', '#86b996');
    // A small white cloud drifts by; rain brings grey ones.
    const cx = (s.cloudX % 340) - 170;
    if (s.rain < 0.95) o += `<g opacity="${(1 - s.rain).toFixed(2)}">${cloud(cx, -104, 0.8, mix('#ffffff', '#55608a', s.night))}</g>`;
    return o;
  }
  function over(s) {
    let o = '';
    // Leaves blow across in a strong wind.
    if (s.wind > 0.05) {
      o += `<g opacity="${s.wind.toFixed(2)}" pointer-events="none">`;
      for (let i = 0; i < 9; i++) {
        const x = ((rnd(i, 3) * 300 + s.t * (60 + rnd(i, 4) * 50)) % 300) - 150, y = -60 + rnd(i, 5) * 120 + Math.sin(s.t * 3 + i) * 8, a = (s.t * 200 + i * 40) % 360;
        o += `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})" d="M-3 0Q0 -2.4 3 0Q0 2.4 -3 0Z" fill="${mix('#7cc46a', '#2f4a3a', s.night)}" stroke="#231e16" stroke-width=".5"/>`;
      }
      o += '</g>';
    }
    if (s.rain < 0.02) return o;
    o += `<g opacity="${s.rain.toFixed(2)}">`;
    o += cloud(-70, -118, 1.2, mix('#c6ccd3', '#3d4766', s.night)) + cloud(15, -128, 1.05, mix('#b4bcc5', '#3d4766', s.night)) + cloud(88, -112, 1.15, mix('#c6ccd3', '#3d4766', s.night));
    o += '<g data-p="ruah" stroke="#5f7fb5" stroke-width="1.1" stroke-linecap="round">';
    for (let i = 0; i < 70; i++) {
      const x = -135 + rnd(i, 1) * 280, y = -120 + ((rnd(i, 2) * 200 + s.t * 210) % 200);
      o += `<path d="M${x.toFixed(1)} ${y.toFixed(1)}l-2.5 9"/>`;
    }
    return o + '</g></g>';
  }

  // ---------- labels ----------
  // Labels come in groups (House, Yard, Family, Sky) so a few show at a time; looking inside, the room.
  const LABEL_GROUPS = ['House', 'Yard', 'Family', 'Sky'];
  function anchors(s, cam) {
    const inside = s.inside > 0.5, a = [];
    const H = (part, p, n) => a.push({ part, p, n, g: 'House' }), Y = (part, p) => a.push({ part, p, g: 'Yard' });
    const F = (part, p) => a.push({ part, p, g: 'Family' }), S = (part, sp, p) => a.push(sp ? { part, s: sp, g: 'Sky' } : { part, p, g: 'Sky' });
    if (inside) {
      a.push({ part: 'bang', p: [-53.5, 25, 50], n: [1, 0, 0] }, { part: 'bang', p: [-20, -33.5, 50], n: [0, 1, 0] },
        { part: 'choka', p: [-48, -18, 24.5] }, { part: 'bel', p: [-43, -23, 32.5] }, { part: 'khum', p: [-38, 40, 26] },
        { part: 'puan', p: [-44, 32, 28.6] }, { part: 'dawhkân', p: [-26, 8, 30.5] }, { part: 'khawnvâr', p: [-21, 3, 35.4] },
        { part: 'ṭhutthlêng', p: [-6.5, 3, 34] }, { part: 'chhuatphah', p: [-4, -23, 22.1] }, { part: 'chhuat', p: [24, -22, 22], n: [0, 0, 1] });
      if (s.fire) a.push({ part: 'mei', p: [-43, -23, 28] });
      if (s.night > 0.5) a.push({ part: 'nu', p: [-33, -23, 40] }, { part: 'pi', p: [-43, -11, 38] }, { part: 'pa', p: [-30, 18, 47] }, { part: 'naupang', p: [-14, 16, 38] });
      return a;
    }
    if (!nearWall(s, cam, 'xp')) { H('kawngkhar', [6, 8, 36], [1, 0, 0]); H('tukverh', [6, 31, 40], [1, 0, 0]); }
    H('tukverh', [-34, 46, 40], [0, 1, 0]); H('bang', [-14, 45, 52], [0, 1, 0]);
    H('chungkhuh', [-4, 20, 68], [0.55, 0, 0.83]); H('khawnvâr', [10, -6, 45]); H('chhuat', [24, -22, 22], [0, 0, 1]);
    Y('zawhte', [21, -24, 33]); Y('arpui', add(henPos(s), [0, 0, 14])); Y('arbawm', [69, 68, 20]);
    Y('vawk', [-5 + 28 * Math.sin(s.pig), 68, 11]); Y('êm', [40, -9, 12]); Y('kawng', [70, 12, 0]); Y('pal', [84, -50, 13]);
    Y('thing', [55, -65, 64]); Y('mau', [-64, 70, 80]); Y('pangpâr', [60, -36, 9]);
    if (s.eggs.length) Y('artui', [s.eggs[0].x, s.eggs[0].y, 4]);
    if (s.night < 0.5) {
      const k = (1 - Math.cos(s.t * 0.35)) / 2, pg = -5 + 28 * Math.sin(s.pig), dir = Math.cos(s.pig) >= 0 ? 1 : -1;
      F('nu', [21, 31 + 7 * Math.sin(s.t * 0.3), 45]); F('hmunphiah', [28, 31 + 7 * Math.sin(s.t * 0.3), 24]);
      F('pa', [50 + 30 * k, 8 + 5 * k, 25]); F('pi', [58, -12, 16]); F('tui', [67, -12, 6]);
      F('puan', [-17, 82, 10]); F('naupang', [pg - dir * 11, 66, 16]);
      if (s.vis > 0.05) { F('Rova', add(friendAt(s, 0.75), [0, 0, 18])); F('Mami', add(friendAt(s, 0), [0, 0, 17])); }
    }
    const T = timeAt(s);
    S('tlang', [-104, -50]);
    if (s.night < 0.5 && s.rain < 0.5) S('ni', [T.sun[0], T.sun[1] + 13]);
    if (s.night > 0.5 && s.rain < 0.5) { S('thla', [MOON[0], MOON[1] + 11]); S('arsi', STARS[1]); }
    if (s.rain > 0.5) { S('chhum', [15, -120]); S('ruah', [-40, -70]); } else S('vân', [20, -124]);
    if (s.bow > 2 && s.rain < 0.5 && s.night < 0.5) S('chhimbâl', [30, -96]);
    if (s.puffs.length > 3) S('meikhu', null, [-30, 14, 104]);
    return a;
  }

  function tap(s, part, id) {
    // Tap an egg to pick it up: it goes into the basket.
    if (part === 'artui') { const i = +id.split('#')[1]; if (s.eggs[i]) { s.eggs.splice(i, 1); s.got++; } return null; }
    if (part === 'vawk' && s.night < 0.5) { s.pigHop = 0.4; return null; }
    // At night a tap wakes the cat for a moment; the hen sleeps on.
    if (part === 'zawhte' && s.night > 0.5) { s.catWake = 3; return 'harh'; }
    if (part === 'arpui' && s.night > 0.5) return 'muhil';
    // The family say what they are doing.
    if (part === 'Rova' || part === 'Mami') return ['ṭhian', s.vis < 1 && s.visT ? 'chibai' : 'infiam'];   // a friend, saying hello or playing
    return s.night > 0.5 ? null : { nu: 'phiat', pi: 'su', pa: 'kal', naupang: 'tlân' }[part] || null;
  }

  return {
    id: 'house', name: 'In', sub: 'a Mizo house',
    view: { yaw: 55, pitch: 30, box: '-130 -140 260 222', centre: [0, -30] },
    words: ['in', 'kawngkhar', 'tukverh', 'bang', 'chhuat', 'chungkhuh', 'khawnvâr', 'zawhte', 'arpui', 'êm', 'kawng', 'pal', 'thing', 'mau', 'pangpâr', 'tlang', 'ni', 'thla', 'arsi', 'chhum', 'ruah', 'vân', 'meikhu', 'mei', 'hawng', 'khar', 'zân', 'zîng', 'harh', 'muhil',
      'chhûngah', 'choka', 'bel', 'khum', 'puan', 'dawhkân', 'ṭhutthlêng', 'chhuatphah', 'arbawm', 'artui', 'vawk',
      'chhun', 'tlai', 'thli', 'chhimbâl', 'nu', 'pa', 'pi', 'naupang', 'phiat', 'hmunphiah', 'su', 'tui', 'kal', 'tlân',
      'ṭhian', 'tlawh', 'chibai', 'infiam'],
    // Names that are not words: shown as they are, with what they are in English.
    names: { Rova: 'Rova, from Japan', Mami: 'Mami, his friend' },
    init, step, tint, light, scene, sky, over, anchors, tap, labelGroups: LABEL_GROUPS,
    swatches: { label: 'Roof', key: 'roof', list: Object.fromEntries(Object.entries(ROOFS).map(([k, v]) => [k, v.m])) },
    actions: [
      { label: s => s.insideT ? 'Roof back on' : 'Look inside', word: s => s.insideT ? null : 'chhûngah', run: s => { s.insideT = s.insideT ? 0 : 1; } },
      { label: s => s.doorT ? 'Close door' : 'Open door', word: s => s.doorT ? 'khar' : 'hawng', run: s => { s.doorT = s.doorT ? 0 : 1; } },
      { label: s => s.winT ? 'Close windows' : 'Open windows', word: s => s.winT ? 'khar' : 'hawng', run: s => { s.winT = s.winT ? 0 : 1; } },
      { label: s => TIMES[(Math.round(s.todT) + 1) % 4].en, word: s => TIMES[(Math.round(s.todT) + 1) % 4].word, run: s => { s.todT = Math.round(s.todT) + 1; } },
      { label: s => s.rainT ? 'Stop rain' : 'Rain', word: s => s.rainT ? null : 'ruah', run: s => { if (s.rainT) s.bow = 14; s.rainT = s.rainT ? 0 : 1; } },
      { label: s => s.visT ? 'Friends go home' : 'Rova visits', word: s => s.visT ? null : 'tlawh', run: s => { s.visT = s.visT ? 0 : 1; } },
      { label: s => s.windT ? 'Calm' : 'Wind', word: s => s.windT ? null : 'thli', run: s => { s.windT = s.windT ? 0 : 1; } },
      { label: s => s.fire ? 'Fire out' : 'Light fire', word: s => s.fire ? null : 'mei', run: s => { s.fire = !s.fire; } },
    ],
  };
})();
</script>
<script>
// Puan tah: a Mizo backstrap loom in a room, drawn with Ink3D. Pi sits on a mat with the loom's
// belt round her back and weaves a puan row by row: the shed opens, the shuttle carries the yarn
// across and the beating stick packs it in. Pick the colour of each row, add a pattern, and finish
// the puan to fold it onto the wooden chest. The five famous Mizo puans hang on the wall: tap one
// to hear what it means, and weave it row by row. Every word comes from the Hnahsin content.
const LOOM = (() => {
  const { box, ball, cyl, line, poly, group, solid, add, mul, mix, dot } = Ink3D;
  const person = (at, dir, o) => Ink3DPeople.person(at, dir, o);

  const FLOOR = { l: '#dcb07c', m: '#bf9160', d: '#5e4127' }, PLANK = '#9a6e43';
  const WALL = { l: '#f1d9a0', m: '#d9b978', d: '#86683a' }, WALL_LINE = '#b08a4f';
  const BAMBOO = { l: '#d9e08a', m: '#b3ba62', d: '#5a5d2a' };
  const WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' }, DARK = { l: '#8a5a36', m: '#6b4429', d: '#33200f' };
  const CANE = { l: '#e8c584', m: '#c9a05a', d: '#6b5126' }, CAT = { l: '#d8d2c9', m: '#aaa197', d: '#4d4640' };
  const WARP = '#efe3c8', ROPE = '#b98a4e', STRAP = '#7a4a2a';
  // The yarns, named by their Mizo colour words.
  const YARNS = { sen: '#c8323d', dum: '#2a2522', 'vâr': '#f4efe4', hring: '#2f8a4a', 'dumpâwl': '#2f5fae', sendang: '#ec7fa6', eng: '#f2c230' };
  // Every colour a puan may use: the yarns, and the deep indigo-black of ting (Assam indigo) dye
  const COL = { ...YARNS, ting: '#232a48' }, YARN_IDS = Object.keys(YARNS);
  const shade = c => ({ l: mix(c, '#ffffff', 0.25), m: c, d: mix(c, '#000000', 0.55) });
  const yarnAt = (i, up = 0) => [-26.9 + i * 3.4, 23.5, 6.4 + up];
  const contrast = c => ['dum', 'dumpâwl', 'sen', 'hring', 'ting'].includes(c) ? 'vâr' : 'dum';
  const motifCol = r => COL[typeof r.m === 'string' ? r.m : contrast(r.c)];

  // ---------- the famous Mizo puans ----------
  // Each is its rows from one end to the other: [colour, rows, pattern colour, pattern]. The patterns:
  // 'teeth' sakei ha (tiger's teeth, a sawtooth), 'wave' disul (sungrass in the wind), 'zig' kawkpuizikzial
  // (the fern shoot), 'fork' lenbuangthuam (forked branches), 'seed' fanghma mu (cucumber seeds) and 'star'.
  // Ngotekherh also has black warp lines, which make its grid (kherh). Their meanings are in loom_words.json.
  const FAMOUS = {
    puanchei: { rows: [['vâr', 2], ['dum', 1], ['sen', 2], ['dum', 1], ['vâr', 1], ['vâr', 2, 'hring', 'teeth'], ['vâr', 1], ['vâr', 2, 'eng', 'wave'], ['vâr', 1], ['sen', 1], ['dum', 2], ['sen', 1],
      ['vâr', 1], ['vâr', 2, 'dum', 'zig'], ['vâr', 1], ['vâr', 2, 'hring', 'fork'], ['vâr', 1], ['vâr', 2, 'eng', 'seed'], ['vâr', 1], ['dum', 1], ['sen', 2], ['dum', 1], ['vâr', 2]] },
    pawndum: { rows: [['dum', 4], ['sen', 1], ['eng', 1], ['dum', 3], ['sen', 1], ['vâr', 1], ['eng', 1], ['vâr', 1], ['sen', 1], ['dum', 3], ['eng', 1], ['sen', 1], ['dum', 4]] },
    ngotekherh: { grid: true, rows: [['vâr', 3], ['dum', 1], ['vâr', 4], ['dum', 1], ['vâr', 4], ['dum', 3], ['vâr', 4], ['dum', 1], ['vâr', 4], ['dum', 1], ['vâr', 3]] },
    hmaram: { short: true, rows: [['ting', 1], ['ting', 1, 'vâr', 'seed'], ['ting', 1], ['ting', 2, 'vâr', 'star'], ['ting', 1], ['ting', 2, 'vâr', 'zig'], ['ting', 1], ['ting', 2, 'vâr', 'star'], ['ting', 1], ['ting', 1, 'vâr', 'seed'], ['ting', 1]] },
    tawlhlohpuan: { rows: [['dum', 5], ['dum', 1, 'sen', 'teeth'], ['dum', 2], ['sen', 1], ['vâr', 1], ['eng', 1], ['vâr', 1], ['sen', 1], ['dum', 2], ['dum', 1, 'sen', 'teeth'], ['dum', 5]] },
  };
  const FAMOUS_IDS = Object.keys(FAMOUS);
  // One row each, as the loom weaves them
  const planOf = id => FAMOUS[id].rows.flatMap(([c, n, m]) => Array.from({ length: n }, () => ({ c, m: m || false })));
  // One pattern across a band: u from u0 to u1, centred on v = vm, h high; along(u, v) → 3D.
  function motif(kind, col, u0, u1, vm, h, along, part) {
    const out = [], U = (u1 - u0), at = (n, j) => u0 + U * (j + 0.5) / n;
    if (kind === 'teeth') for (let j = 0; j < 8; j++) { const a = u0 + U * j / 8, b = u0 + U * (j + 1) / 8; out.push({ pts: [along(a, vm + h), along(b, vm + h), along((a + b) / 2, vm - h)], fill: col, w: 0.2, part }); }
    else if (kind === 'wave' || kind === 'zig') {
      const n = kind === 'wave' ? 33 : 13;
      out.push({ pts: Array.from({ length: n }, (_, i) => along(u0 + U * (i + 0.5) / n, vm + (kind === 'wave' ? Math.sin(i / 2) * h : i % 2 ? h : -h))), stroke: col, w: 0.35, open: true, part });
    } else if (kind === 'fork') for (let j = 0; j < 5; j++) {
      const m = at(5, j), w = U / 14;
      out.push({ pts: [along(m - w, vm - h), along(m, vm), along(m + w, vm - h)], stroke: col, w: 0.35, open: true, part });
      out.push({ pts: [along(m, vm), along(m, vm + h)], stroke: col, w: 0.35, open: true, part });
    } else if (kind === 'star') for (let j = 0; j < 5; j++) {
      const m = at(5, j), w = U / 12;
      out.push({ pts: Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4, r = i % 2 ? 0.35 : 1; return along(m + Math.cos(a) * w * r, vm + Math.sin(a) * h * r); }), fill: col, w: 0.15, part });
    } else for (let j = 0, n = kind === 'seed' ? 7 : 5; j < n; j++) {
      const m = at(n, j), w = U / (kind === 'seed' ? 26 : 16);
      out.push({ pts: [along(m - w, vm), along(m, vm + h), along(m + w, vm), along(m, vm - h)], fill: col, w: 0.2, part });
    }
    return out;
  }
  // The decals of a famous puan on a flat rectangle: u runs across it, v from end to end; along(u, v) → 3D.
  function famousDecals(id, [u0, u1, v0, v1], along, part) {
    const F = FAMOUS[id], N = F.rows.reduce((a, r) => a + r[1], 0), out = [];
    let at = 0;
    for (const [c, n, m, kind] of F.rows) {
      const a = v0 + (v1 - v0) * at / N, b = v0 + (v1 - v0) * (at + n) / N; at += n;
      out.push({ pts: [along(u0, a), along(u1, a), along(u1, b), along(u0, b)], fill: COL[c], w: 0.25, part });
      if (m) out.push(...motif(kind, COL[m], u0, u1, (a + b) / 2, (b - a) * 0.36, along, part));
    }
    if (F.grid) for (let j = 1; j < 5; j++) { const u = u0 + (u1 - u0) * j / 5; out.push({ pts: [along(u, v0), along(u, v1)], stroke: COL.dum, w: 0.25, open: true, part }); }
    return out;
  }
  // Where each hangs on the left wall: a strip across y, from z 42 down
  const HANG = FAMOUS_IDS.map((id, i) => ({ id, y0: -31.5 + i * 12.5, y1: -21 + i * 12.5, z0: 42, z1: FAMOUS[id].short ? 27 : 18 }));

  // ---------- the loom's layout (x runs from the weaver to the far post) ----------
  const BEAM_X = -29, FAR_X = 44, HEDDLE_X = 6, STICK_X = 24, ROW = 1.3, SHOW = 10;   // SHOW rows stay in view; older ones roll onto the beam
  const WY = 7;                                            // the warp is 15 threads wide, from -7 to 7
  const plane = x => 10 + (x - BEAM_X) * 0.06;             // the height of the warp along its length
  const PASS = 1.4;                                        // seconds for one row

  function init() {
    return {
      t: 0, rows: [], yarn: 'sen', pattern: false, auto: false, pass: -1, side: -1, shed: 1, shedV: 1,
      done: [{ bands: ['dum', 'sen', 'vâr', 'sen', 'dum'], motif: true }], finish: -1, piece: null, pick: 'puanchei', plan: null,
    };
  }
  // Start some rows so the loom does not look empty.
  const START = ['sen', 'sen', 'dum', 'dum', 'sen', 'sen', 'vâr', 'sen', 'sen', 'dum', 'dum', 'sen'];

  function startPass(s) {
    if (s.pass >= 0 || s.finish >= 0) return;
    s.pass = 0; s.side = -s.side; s.shed = -s.shed; s.placed = false;
    if (s.plan) { const r = s.plan.rows[s.plan.i]; s.yarn = r.c; s.pattern = !!r.m; }
  }
  // Weave a famous puan: start a fresh piece and follow its rows, a little faster than by hand
  function startPlan(s) {
    if (s.plan || s.finish >= 0) return;
    s.rows = []; s.pass = -1; s.plan = { id: s.pick, rows: planOf(s.pick), i: 0 }; s.auto = true;
  }

  function step(s, dt) {
    if (!s.rows.length && !s.started) { s.started = true; s.rows = START.map(c => ({ c, m: false })); }
    s.t += dt;
    s.shedV += (s.shed - s.shedV) * Math.min(1, dt * 10);
    if (s.pass >= 0) {
      s.pass += dt / (s.plan ? PASS * 0.5 : PASS);
      if (!s.placed && s.pass > 0.7) { s.placed = true; s.rows.push(s.plan ? { ...s.plan.rows[s.plan.i++] } : { c: s.yarn, m: s.pattern }); }
      if (s.pass >= 1) {
        s.pass = -1;
        if (s.plan && s.plan.i >= s.plan.rows.length) finish(s);
        else if (s.auto) startPass(s);
      }
    } else if (s.auto) startPass(s);
    if (s.finish >= 0) {
      s.finish += dt / 2.2;
      if (s.finish >= 1) {
        s.done.push(s.piece); if (s.done.length > 6) s.done.shift();
        s.finish = -1; s.piece = null; s.rows = [];
      }
    }
    return true;
  }

  // The bands of a finished piece: its rows, run together and thinned to a few stripes.
  function bandsOf(rows) {
    const out = [];
    for (const r of rows) if (!out.length || out[out.length - 1] !== r.c) out.push(r.c);
    return out.slice(-8);
  }
  function finish(s) {
    if (s.rows.length < 8 || s.finish >= 0) return;
    s.auto = false; s.pass = -1;
    s.piece = { bands: bandsOf(s.rows), motif: s.rows.some(r => r.m), famous: s.plan && s.plan.i >= s.plan.rows.length ? s.plan.id : null };
    s.plan = null; s.pattern = false; if (!YARNS[s.yarn]) s.yarn = 'dum';
    s.finish = 0;
  }

  // ---------- where things are this moment ----------
  function moment(s) {
    const vis = s.finish >= 0 ? [] : s.rows.slice(-SHOW);
    const fell = BEAM_X + 0.6 + vis.length * ROW;           // the edge of the weaving
    const k = s.pass;
    // The beating stick comes forward to pack the new row in.
    const beat = k > 0.55 && k < 0.85 ? Math.sin((k - 0.55) / 0.3 * Math.PI) : 0;
    const bx = fell + 0.6 + 3.4 * (1 - beat);
    // The shuttle crosses from one side to the other.
    const u = k < 0 ? 1 : Math.max(0, Math.min(1, (k - 0.18) / 0.37));
    const ease = u * u * (3 - 2 * u);
    const sy = -s.side * 13 + s.side * 26 * ease;
    return { vis, fell, beat, bx, sy, crossing: k > 0.18 && k < 0.55 };
  }

  // ---------- the room ----------
  const WALLS = [
    { key: 'xn', inner: 'xp', n: [1, 0, 0], at: [-52, -49, -34, 34] }, { key: 'xp', inner: 'xn', n: [-1, 0, 0], at: [61, 64, -34, 34] },
    { key: 'yn', inner: 'yp', n: [0, 1, 0], at: [-49, 61, -34, -31] }, { key: 'yp', inner: 'yn', n: [0, -1, 0], at: [-49, 61, 31, 34] },
  ];
  // A wall you look at from inside the room stands tall; one between you and the room is cut down low.
  const backWall = (cam, w) => dot(w.n, cam.view) > 0;

  function puanStripes(bands, rect, motif, along) {
    // rect: (u0, u1) across the stripes, (v0, v1) along them; along(u, v) → a 3D point
    const [u0, u1, v0, v1] = rect, n = bands.length, out = [];
    bands.forEach((c, i) => {
      const a = u0 + (u1 - u0) * i / n, b = u0 + (u1 - u0) * (i + 1) / n;
      out.push({ pts: [along(a, v0), along(b, v0), along(b, v1), along(a, v1)], fill: COL[c], w: 0.3 });
      if (motif && i % 2 === 1) for (let j = 0; j < 5; j++) {
        const m = (a + b) / 2, h = (b - a) * 0.32, vv = v0 + (v1 - v0) * (j + 0.5) / 5, w = (v1 - v0) / 14;
        out.push({ pts: [along(m - h, vv), along(m, vv + w), along(m + h, vv), along(m, vv - w)], fill: COL[contrast(c)], w: 0.25 });
      }
    });
    return out;
  }

  function room(s, cam) {
    const items = [];
    for (const w of WALLS) {
      const tall = backWall(cam, w), top = tall ? 48 : 4;
      const ix = w.key[0] === 'x', at = w.key[1] === 'n' ? (ix ? w.at[1] : w.at[3]) + 0.05 : (ix ? w.at[0] : w.at[2]) - 0.05;
      const dec = [];
      for (let z = 4; z < top - 0.5; z += 4) dec.push({ pts: ix ? [[at, w.at[2], z], [at, w.at[3], z]] : [[w.at[0], at, z], [w.at[1], at, z]], stroke: WALL_LINE, open: true });
      if (tall && w.key === 'yn') {
        // A window with the morning outside
        const y = at + 0.01;
        dec.push({ pts: [[8, y, 18], [36, y, 18], [36, y, 37], [8, y, 37]], fill: '#bfe3f7', glow: true, part: 'tukverh', w: 1.2 });
        dec.push({ pts: [[8, y, 18], [36, y, 18], [36, y, 23], [8, y, 23]], fill: '#a9d67c', glow: true, part: 'tukverh', w: 0.6 });
        dec.push({ pts: [[22, y, 18], [22, y, 37]], stroke: WOOD.d, w: 1, open: true, part: 'tukverh' });
        for (const x0 of [-1, 37]) dec.push({ pts: [[x0, y, 18], [x0 + 8, y, 18], [x0 + 8, y, 37], [x0, y, 37]], fill: WOOD.m, part: 'tukverh' });
      }
      if (tall && w.key === 'xn') {
        // The five famous puans hang from a bamboo rod; the one picked to weave has a yellow tag
        const x = at + 0.01;
        dec.push({ pts: [[x, -33, 42.6], [x, 31, 42.6]], stroke: BAMBOO.d, w: 1.6, open: true });
        for (const h of HANG) {
          dec.push(...famousDecals(h.id, [h.y0, h.y1, h.z0, h.z1], (u, v) => [x, u, v], h.id));
          if (h.id === s.pick) { const m = (h.y0 + h.y1) / 2; dec.push({ pts: [[x, m - 1.6, 45.6], [x, m + 1.6, 45.6], [x, m, 43]], fill: '#ffc94a', w: 0.5, part: h.id }); }
        }
      }
      items.push(box(w.at[0], w.at[1], w.at[2], w.at[3], 0, top, { pal: WALL, part: 'bang', decals: { [w.inner]: dec }, bias: tall ? -1000 : 900 }));
    }
    // The wooden chest with the finished puans folded on top
    const chest = [box(-48, -28, -30, -18, 0, 11, { pal: DARK, part: 'thingrem', decals: {
      yp: [{ pts: [[-48, -17.95, 8.5], [-28, -17.95, 8.5]], stroke: DARK.d, open: true }, { pts: [[-39.5, -17.94, 6], [-36.5, -17.94, 6], [-36.5, -17.94, 9], [-39.5, -17.94, 9]], fill: '#d9b24a', w: 0.5 }],
      xp: [{ pts: [[-27.95, -30, 8.5], [-27.95, -18, 8.5]], stroke: DARK.d, open: true }],
    } })];
    s.done.forEach((p, i) => {
      const z0 = 11 + i * 1.7;
      const top = p.famous ? famousDecals(p.famous, [-28.5, -19.5, -46.5, -29.5], (y, x) => [x, y, z0 + 1.55], p.famous)
        : puanStripes(p.bands, [-46.5, -29.5, -28.5, -19.5], p.motif, (x, y) => [x, y, z0 + 1.55]);
      chest.push(box(-46.5, -29.5, -28.5, -19.5, z0, z0 + 1.5, { pal: shade(COL[p.famous ? FAMOUS[p.famous].rows[0][0] : p.bands[0]]), part: p.famous || 'puan chei', bias: i + 1, decals: { zp: top } }));
    });
    items.push(group(chest, { part: 'thingrem' }));
    // The basket of yarn: tap a ball to weave with that colour
    // The yarn balls sit in a row along a long basket, so each one is easy to tap.
    const yarn = [box(-30, -6, 20, 27, 0, 5, { pal: CANE, part: 'fawng', decals: { zp: [{ pts: [[-29, 21, 5.02], [-7, 21, 5.02], [-7, 26, 5.02], [-29, 26, 5.02]], fill: '#6b5126', w: 0.4 }] } })];
    Object.keys(YARNS).forEach((c, i) => {
      const up = c === s.yarn ? 1.8 + 0.5 * Math.sin(s.t * 4) : 0;
      yarn.push(ball(yarnAt(i, up), 1.9, { pal: shade(COL[c]), part: c, bias: 1 }));
    });
    items.push(group(yarn));
    // The cat sleeps by the basket
    const C = [2, 24, 0];
    items.push(group([
      ball(add(C, [0, 0, 3.6]), 4.2, { pal: CAT }),
      ball(add(C, [3.4, 2.2, 2.6]), 2.8, { pal: CAT }),
      poly([add(C, [3.4, 1.0, 5]), add(C, [3.0, 0.4, 7.4]), add(C, [4.6, 0.6, 5.2])], { pal: CAT }),
      poly([add(C, [3.4, 3.4, 5]), add(C, [3.0, 4.2, 7.4]), add(C, [4.6, 3.8, 5.2])], { pal: CAT }),
      line([add(C, [-3.5, -1, 1]), add(C, [-1, -4.4, 0.8]), add(C, [2.4, -3.6, 0.8])], { col: CAT.m, w: 1.4 }),
    ], { part: 'zawhte' }));
    return items;
  }

  // ---------- the loom ----------
  function loom(s) {
    const M = moment(s), kids = [], pz = plane;
    // The warp beam (themtlang) at the far end, tied with rope to the post
    kids.push(box(FAR_X - 2.2, FAR_X + 2.2, -12, 12, pz(FAR_X) - 2.4, pz(FAR_X) + 1.4, { pal: WOOD, part: 'themtlang', bias: 120 }));   // a big bar, easy to tap
    // The lease rods (kaihbu): two thin split bamboos through the warp near the warp beam
    kids.push(group([34.5, 38].map((x, i) => box(x - .35, x + .35, -9.5, 9.5, pz(x) + (i ? -.5 : .15), pz(x) + (i ? -.05 : .6), { pal: BAMBOO })), { part: 'kaihbu', bias: 160 }));
    kids.push(group([
      line([[FAR_X + 0.6, -10, pz(FAR_X)], [50, -2.2, 17]], { col: ROPE, w: 0.8 }),
      line([[FAR_X + 0.6, 10, pz(FAR_X)], [50, 2.2, 17]], { col: ROPE, w: 0.8 }),
      line([[49.8, -2.2, 16.4], [54.2, -2.2, 16.4], [54.2, 2.2, 16.4], [49.8, 2.2, 16.4]], { col: ROPE, w: 0.9 }),
    ], { part: 'hrui', bias: 60 }));
    // The warp: every other thread goes up through the heddle, so the shed opens for the shuttle
    const rodZ = pz(HEDDLE_X) + 4.6;
    for (let i = 0; i <= WY * 2; i++) {
      const y = -WY + i, up = (i % 2 === 0 ? Math.max(0, s.shedV) : Math.max(0, -s.shedV)) * 2.6 - 0.4;
      kids.push(line([[M.fell, y, pz(M.fell) + 0.05], [HEDDLE_X, y, pz(HEDDLE_X) + up], [STICK_X, y, pz(STICK_X) + (i % 2 ? 0.7 : -0.3)], [FAR_X, y, pz(FAR_X)]],
        { col: WARP, w: 0.55, ink: i === 0 || i === WY * 2, bias: 100, part: 'puan' }));
      if (up > 0.6) kids.push(line([[HEDDLE_X, y, rodZ], [HEDDLE_X, y, pz(HEDDLE_X) + up]], { col: '#7a6a55', w: 0.3, ink: false, bias: 250, part: 'hnahchawi' }));
    }
    // The heddle rod (hnahchawi): its loops lift every other warp thread
    kids.push(box(HEDDLE_X - 0.5, HEDDLE_X + 0.5, -10.5, 10.5, rodZ, rodZ + 1, { pal: WOOD, part: 'hnahchawi', bias: 300 }));
    // The shed stick (thembupui): a wide flat bamboo bar through the warp
    kids.push(box(STICK_X - 1.8, STICK_X + 1.8, -10.5, 10.5, pz(STICK_X) + 0.1, pz(STICK_X) + 0.8, { pal: BAMBOO, part: 'thembupui', bias: 200,
      decals: { zp: [{ pts: [[STICK_X - 1.8, -10.5, pz(STICK_X) + 0.85], [STICK_X + 1.8, -10.5, pz(STICK_X) + 0.85]], stroke: BAMBOO.d, open: true, w: .3 }, { pts: [[STICK_X - 1.8, 0, pz(STICK_X) + 0.85], [STICK_X + 1.8, 0, pz(STICK_X) + 0.85]], stroke: BAMBOO.d, open: true, w: .3 }] } }));
    // Pattern rods (themte): thin rods past the heddle, raised for the puan's design
    if (s.pattern) kids.push(group([10, 13, 16, 19].map(x => box(x - .3, x + .3, -9.5, 9.5, pz(x) + .9, pz(x) + 1.4, { pal: WOOD })), { part: 'themte', bias: 240 }));
    // The reed (tuirek): a comb that keeps the warp threads evenly spaced
    const RX = -4, teeth = [];
    for (let y = -WY - .5; y <= WY + .5; y += 1) teeth.push({ pts: [[RX + .5, y, pz(RX) - 1.2], [RX + .5, y, pz(RX) + 1.6]], stroke: CANE.d, open: true, w: .3 });
    kids.push(box(RX - .5, RX + .5, -10, 10, pz(RX) + 1.6, pz(RX) + 2.4, { pal: CANE, part: 'tuirek', bias: 260 }));
    kids.push(box(RX - .5, RX + .5, -10, 10, pz(RX) - 2, pz(RX) - 1.2, { pal: CANE, part: 'tuirek', bias: 90 }));
    kids.push(group(teeth.map(t => line(t.pts, { col: CANE.d, w: .35, ink: false })), { part: 'tuirek', bias: 255 }));
    // The breast beam (themkhawl), with the woven cloth rolled round it
    kids.push(box(BEAM_X - 1.2, BEAM_X + 1.2, -10.5, 10.5, pz(BEAM_X) - 2, pz(BEAM_X), { pal: WOOD, part: 'themkhawl', bias: 350 }));
    const rolled = s.finish >= 0 ? 0 : Math.max(0, s.rows.length - SHOW);
    if (rolled) {
      const R = 0.8 + Math.min(2.6, rolled * 0.06), c = s.rows[rolled - 1].c, z = pz(BEAM_X) - 1;
      const recent = s.rows.slice(Math.max(0, rolled - 5), rolled).map(r => r.c);
      kids.push(box(BEAM_X - 1.2 - R * 0.6, BEAM_X + 1.2 + R * 0.4, -WY - 0.4, WY + 0.4, z - R * 0.7, z + 1 + R, { pal: shade(COL[c]), part: 'puan', bias: 380,
        decals: { zp: recent.map((rc, i) => ({ pts: [[BEAM_X - 1.2 - R * 0.6 + i * 0.5, -WY - 0.4, z + 1.05 + R], [BEAM_X - 0.9 - R * 0.6 + i * 0.5, -WY - 0.4, z + 1.05 + R], [BEAM_X - 0.9 - R * 0.6 + i * 0.5, WY + 0.4, z + 1.05 + R], [BEAM_X - 1.2 - R * 0.6 + i * 0.5, WY + 0.4, z + 1.05 + R]], fill: COL[rc], w: 0.2 })) } }));
    }
    // The woven rows in view, run together into bands, with the pattern on top
    let x = BEAM_X + 0.6, i0 = 0;
    const vis = M.vis;
    while (i0 < vis.length) {
      let i1 = i0;
      while (i1 + 1 < vis.length && vis[i1 + 1].c === vis[i0].c) i1++;
      const xa = x + i0 * ROW, xb = x + (i1 + 1) * ROW;
      kids.push(poly([[xa, -WY - 0.4, pz(xa) + 0.06], [xb, -WY - 0.4, pz(xb) + 0.06], [xb, WY + 0.4, pz(xb) + 0.06], [xa, WY + 0.4, pz(xa) + 0.06]], { fill: COL[vis[i0].c], w: 0.5, part: 'puan', bias: 400 }));
      i0 = i1 + 1;
    }
    vis.forEach((r, i) => {
      if (!r.m) return;
      const xa = x + i * ROW, xm = xa + ROW / 2, n = s.rows.length - vis.length + i, z = pz(xm) + 0.12;
      for (let j = 0; j < 5; j++) {
        const y = -6 + j * 3 + (n % 2) * 1.5, hw = 0.9, hx = ROW * 0.5;
        kids.push(poly([[xm - hx, y, z], [xm, y + hw, z], [xm + hx, y, z], [xm, y - hw, z]], { fill: motifCol(r), w: 0.25, part: 'ziarâng', bias: 450 }));
      }
    });
    // The beater (thempui): a long flat weaving sword, pointed at both ends, that packs each row in
    const bz0 = pz(M.bx) + 0.2;
    kids.push(box(M.bx, M.bx + 2.4, -12, 12, bz0, bz0 + .9, { pal: DARK, part: 'thempui', bias: 500,
      decals: { zp: [{ pts: [[M.bx + 1.2, -12, bz0 + .95], [M.bx + 1.2, 12, bz0 + .95]], stroke: DARK.l, open: true, w: .3 }] } }));
    kids.push(group([-1, 1].map(e => poly([[M.bx, e * 12, bz0 + .9], [M.bx + 2.4, e * 12, bz0 + .9], [M.bx + 1.2, e * 14, bz0 + .5]], { fill: DARK.m, w: .5 })), { part: 'thempui', bias: 501 }));
    // The shuttle (khawhtlang) with the yarn wound on it, and the yarn it lays as it crosses
    const sx = M.fell + 2.4, sz = pz(sx) + 1.4;
    kids.push(group([
      box(sx - 0.6, sx + 0.6, M.sy - 5, M.sy + 5, sz, sz + 0.9, { pal: WOOD }),
      box(sx - 0.85, sx + 0.85, M.sy - 2.4, M.sy + 2.4, sz - 0.25, sz + 1.15, { pal: shade(COL[s.yarn]) }),
    ], { part: 'khawhtlang', bias: 600 }));
    if (M.crossing) kids.push(line([[M.fell + 0.3, -s.side * (WY + 0.4), pz(M.fell) + 0.1], [sx, M.sy, sz + 0.4]], { col: COL[s.yarn], w: 0.45, ink: false, bias: 550 }));
    // The finished puan, folded, flies to the chest
    if (s.finish >= 0 && s.piece) {
      const k = s.finish, e = k * k * (3 - 2 * k), from = [-24, 0, 12], to = [-38, -24, 11 + s.done.length * 1.7 + 0.8];
      const c = Ink3D.lerp3(from, to, e); c[2] += Math.sin(k * Math.PI) * 22;
      const hw = 8 - 0.5 * e, hd = 5;
      const P = s.piece, top = P.famous ? famousDecals(P.famous, [c[1] - hd, c[1] + hd, c[0] - hw, c[0] + hw], (y, x) => [x, y, c[2] + 0.8], P.famous)
        : puanStripes(P.bands, [c[0] - hw, c[0] + hw, c[1] - hd, c[1] + hd], P.motif, (x, y) => [x, y, c[2] + 0.8]);
      kids.push(box(c[0] - hw, c[0] + hw, c[1] - hd, c[1] + hd, c[2] - 0.75, c[2] + 0.75, { pal: shade(COL[P.famous ? FAMOUS[P.famous].rows[0][0] : P.bands[0]]), part: P.famous || 'puan chei', bias: 2000, decals: { zp: top } }));
    }
    return { kids, M };
  }

  // ---------- the weaver ----------
  const PI = { h: 26, shirt: { l: '#6f9be0', m: '#3f6fb5', d: '#1c3560' }, lower: 'skirt', lowerPal: shade('#2a2522'), bands: [0.12, 0.18, 0.24], hair: '#cfcac2', bun: true };
  function weaver(s, M) {
    const pz = plane, hipAt = [-34, 0, 0];
    const lean = 0.05 + 0.05 * M.beat;
    let hands;
    if (M.crossing) {
      const lead = [M.fell + 1.2, Math.max(-WY, Math.min(WY, M.sy)), pz(M.fell) + 1.4];
      const rest = [M.fell - 1.2, -s.side * 4, pz(M.fell) + 0.8];
      hands = s.side > 0 ? [rest, lead] : [lead, rest];
    } else if (s.pass >= 0.5 && s.pass < 0.9) hands = [[M.bx + 1, -WY, pz(M.bx) + 1.5], [M.bx + 1, WY, pz(M.bx) + 1.5]];
    else hands = [[M.fell - 1, -5, pz(M.fell) + 0.9], [M.fell - 1, 5, pz(M.fell) + 0.9]];
    if (s.finish >= 0) hands = [[-26, -6, 14], [-26, 6, 14]];
    const kids = person(hipAt, 0, { ...PI, pose: 'sit', lean, hands, t: s.t });
    const arms = kids.splice(-4);   // drawn after the loom, so her hands are on the cloth
    // The backstrap (kawngvawn) round her back, tied to the breast beam, holds the warp tight
    const strapBack = line([[-33, -8.6, 7.6], [-37.5, -6, 7], [-40.2, 0, 7], [-37.5, 6, 7], [-33, 8.6, 7.6]], { col: STRAP, w: 2.4, bias: -50, part: 'kawngvawn' });
    const strapSides = [-1, 1].map(e => line([[BEAM_X, e * 10, pz(BEAM_X) - 1], [-33, e * 8.6, 7.6]], { col: STRAP, w: 2.2, bias: 50, part: 'kawngvawn' }));
    return [group([strapBack, ...kids, ...strapSides], { part: 'pi', at: [-34, 0, 8] }), group(arms, { part: 'pi', bias: 1000, shadow: false })];
  }

  function scene(s, cam) {
    const floorDec = [];
    for (let y = -30; y < 34; y += 8) floorDec.push({ pts: [[-49, y, 0.02], [61, y, 0.02]], stroke: PLANK, open: true });
    const slab = box(-52, 64, -34, 34, -8, 0, { pal: FLOOR, part: 'chhuat', decals: { zp: floorDec }, shadow: false });
    // Sunlight from the window on the floor
    const sun = backWall(cam, WALLS[2]) ? [poly([[10, -31, 0.06], [36, -31, 0.06], [46, -6, 0.06], [22, -6, 0.06]], { fill: '#fff3c4', glow: true, ink: false, opacity: 0.45, part: 'êng' })] : [];
    const mat = poly([[-46, -13, 0.05], [-20, -13, 0.05], [-20, 13, 0.05], [-46, 13, 0.05]], { fill: '#d8b56a', w: 0.7, part: 'chhuatphah' });
    const matLines = [];
    for (let x = -43; x < -20; x += 3) matLines.push(line([[x, -13, 0.08], [x, 13, 0.08]], { col: '#b08a4f', w: 0.45, ink: false, part: 'chhuatphah' }));
    const { kids, M } = loom(s);
    const post = box(50, 54, -2, 2, 0, 48, { pal: DARK });
    return {
      ground: [slab], groundDecals: [mat, ...matLines, ...sun], clip: [[-52, -34, 0], [64, -34, 0], [64, 34, 0], [-52, 34, 0]],
      items: [...room(s, cam), post, group(kids, { at: [8, 0, 12] }), ...weaver(s, M)],
    };
  }

  const tint = () => c => c;
  const sky = () => `<rect x="-140" y="-140" width="280" height="260" fill="#f3efe6"/>`;
  const over = () => '';

  // ---------- labels ----------
  const LABEL_GROUPS = ['Loom', 'Weaving', 'Puans', 'Room', 'Colours'];
  function anchors(s, cam) {
    const M = moment(s), a = [], pz = plane;
    const L = (part, p, n) => a.push({ part, p, n, g: 'Loom' }), R = (part, p, n) => a.push({ part, p, n, g: 'Room' });
    if (M.vis.length) L('puan', [M.fell - 3, 0, pz(M.fell) + 0.3], [0, 0, 1]);
    if (M.vis.some(r => r.m)) L('ziarâng', [M.fell - 1.5, 4.5, pz(M.fell) + 0.3], [0, 0, 1]);
    const W = (part, p, n) => a.push({ part, p, n, g: 'Weaving' });
    W('khawhtlang', [M.fell + 2.4, M.sy, pz(M.fell) + 2.6]);
    W('thempui', [M.bx + 1, -12, pz(M.bx) + 1.2]);
    W('themkhawl', [BEAM_X, 10.5, pz(BEAM_X) - 1]);
    W('kawngvawn', [-40, 0, 7.5]);
    W('pi', [-33, 0, 24]);
    L('tuirek', [-4, 10, pz(-4) + 2.4]);
    L('hnahchawi', [HEDDLE_X, -10.5, pz(HEDDLE_X) + 5.6]);
    if (s.pattern) L('themte', [16, 9.5, pz(16) + 1.4]);
    L('thembupui', [STICK_X, 10.5, pz(STICK_X) + 0.8]);
    L('kaihbu', [36, -9.5, pz(36) + .5]);
    L('themtlang', [FAR_X, 10.5, pz(FAR_X) + 1.2]);
    L('hrui', [48, 6.5, 16.5]);
    for (const w of WALLS) if (backWall(cam, w)) R('bang', w.key === 'xn' ? [-49, 24, 34] : w.key === 'yn' ? [50, -31, 34] : w.key === 'xp' ? [61, 0, 34] : [0, 31, 34], w.n);
    if (backWall(cam, WALLS[2])) { R('tukverh', [22, -31, 30], [0, 1, 0]); R('êng', [30, -16, 0]); }
    if (backWall(cam, WALLS[0])) for (const h of HANG) a.push({ part: h.id, p: [-48.9, (h.y0 + h.y1) / 2, (h.z0 + h.z1) / 2], n: [1, 0, 0], g: 'Puans' });
    R('thingrem', [-38, -18, 5]);
    R('chhuatphah', [-24, 10, 0.1]); R('chhuat', [40, 20, 0], [0, 0, 1]); R('fawng', [-8, 27, 3]); R('zawhte', [4, 24, 7]);
    Object.keys(YARNS).forEach((c, i) => a.push({ part: c, p: yarnAt(i, 2), g: 'Colours' }));
    return a;
  }

  function tap(s, part) {
    if (YARN_IDS.includes(part)) { s.yarn = part; return 'rawng'; }   // pick this yarn
    if (part === 'pi') return s.pass >= 0 || s.auto ? 'tah' : 'ṭhu';
    if (part === 'zawhte') return 'muhil';
    if (part === 'puan chei') return 'mawi';
    if (FAMOUS[part]) { if (!s.plan) s.pick = part; return null; }   // tap a famous puan to pick it
    return null;
  }

  return {
    id: 'loom', name: 'Puan tah', sub: 'weaving a Mizo puan',
    view: { yaw: 55, pitch: 30, box: '-70 -82 142 128', centre: [0, -12], ink: 0.62 },   // a closer view, so finer lines
    words: ['puan', 'tah', 'puan chei', 'rawng', 'sen', 'dum', 'vâr', 'hring', 'dumpâwl', 'sendang', 'ziarâng', 'hrui', 'kawngvawn',
      'themkhawl', 'thempui', 'thembupui', 'hnahchawi', 'themte', 'tuirek', 'khawhtlang', 'themtlang', 'kaihbu', 'pi', 'ṭhu', 'chhuatphah', 'tukverh', 'bang', 'chhuat', 'fawng', 'thingrem', 'zawhte', 'muhil', 'êng', 'zo', 'mawi', 'eng',
      'puanchei', 'pawndum', 'ngotekherh', 'hmaram', 'tawlhlohpuan'],
    init, step, tint, scene, sky, over, anchors, tap, labelGroups: LABEL_GROUPS,
    swatches: { label: 'Yarn colour', key: 'yarn', list: YARNS },
    actions: [
      { label: s => s.plan ? `Weaving ${s.plan.id}… ${s.plan.i}/${s.plan.rows.length}` : 'Weave this puan', word: s => s.plan ? null : s.pick, ready: s => !s.plan && s.finish < 0, run: s => startPlan(s) },
      { label: () => 'Next puan ›', word: () => null, ready: s => !s.plan, run: s => { s.pick = FAMOUS_IDS[(FAMOUS_IDS.indexOf(s.pick) + 1) % FAMOUS_IDS.length]; } },
      { label: s => s.pass >= 0 && !s.auto ? 'Weaving…' : 'Weave a row', word: () => 'tah', ready: s => !s.plan, run: s => startPass(s) },
      { label: s => s.auto ? 'Stop' : 'Keep weaving', word: () => null, run: s => { s.auto = !s.auto; if (s.auto) startPass(s); } },
      { label: s => s.pattern ? 'Plain rows' : 'Add a pattern', word: s => s.pattern ? null : 'ziarâng', ready: s => !s.plan, run: s => { s.pattern = !s.pattern; } },
      { label: () => 'Finish the puan', word: () => 'zo', ready: s => !s.plan && s.rows.length >= 8 && s.finish < 0, run: s => finish(s) },
    ],
  };
})();
</script>
<script>
// Bazar dâwr: a Mizo market stall, drawn with Ink3D. A bamboo stall with a striped awning and a
// woven back screen; the shopkeeper (dâwrkai) at the end of her counter beside the money tray;
// fruit (thei) in round baskets on a raised shelf and vegetables (thlai) on trays in front;
// bananas and a string of chillies hanging from the beam, a sign, a lamp; a sack of rice, eggs
// and fish by the stall; and Rova come to shop with his basket.
// Play: Rova gets a shopping list in Mizo numbers ("serthlum · pathum"); tap things to send them
// flying into his basket, then pay, and his coins fly to the tray. Or put something on the balance
// to see if it is heavy (rit) or light (zâng). Every word comes from the Hnahsin content.
const BAZAR = (() => {
  const { box, ball, cyl, line, poly, group, mix, lerp3 } = Ink3D;
  const person = (at, dir, o) => Ink3DPeople.person(at, dir, o);
  const shade = c => ({ l: mix(c, '#ffffff', 0.3), m: c, d: mix(c, '#000000', 0.55) });

  const STONE = { l: '#e6dcc6', m: '#cbbd9c', d: '#6e6146' };
  const BAMBOO = { l: '#d9e08a', m: '#b3ba62', d: '#5a5d2a' };
  const WOOD = { l: '#c98d55', m: '#a46c3c', d: '#55361d' };
  const DARK = { l: '#8a5a36', m: '#6b4429', d: '#33200f' };
  const CANE = { l: '#ecd08f', m: '#cfa862', d: '#6b5126' };
  const BRASS = { l: '#f3d27a', m: '#d4a93a', d: '#6e5212' };
  const SACK = { l: '#efe3c4', m: '#d6c49a', d: '#7a6a45' };
  const AWNINGS = { sen: '#d8434c', hring: '#2f9a55', 'dumpâwl': '#2f6fc0', eng: '#f2b431' };
  const TOP = 17;                                    // the counter's height
  const CX0 = -8, CX1 = 10, CY0 = -38, CY1 = 38;     // the counter
  const SHELF = 6;                                   // the back shelf stands this much above the counter

  // ---------- where things are ----------
  // Fruit and the big vegetables sit in round baskets on the back shelf; the small vegetables on
  // trays along the front. The shopkeeper stands at the far (left) end, where nothing hides her.
  const BACK = { zikhlum: -11, 'mâi': 1, serthlum: 13, theihai: 25 };
  const FRONT = { purun: -30, hmarcha: -18, bawkbawn: -6, fanghma: 6, alu: 18, sawhthing: 30 };
  const BX = -2, FX = 5;
  const spotOf = w => (w in BACK ? [BX, BACK[w], TOP + SHELF] : w in FRONT ? [FX, FRONT[w], TOP] : w === 'artui' ? [20, 46, 9] : w === 'sangha' ? [26, 46, 9] : w === 'balhla' ? [20, -26, 44] : [FX, 0, TOP]);
  const WEIGHT = { serthlum: 2, theihai: 2, alu: 2, purun: 1, hmarcha: .5, zikhlum: 3, 'mâi': 5, bawkbawn: 2, fanghma: 1.5, sawhthing: .5, artui: 1, sangha: 2.5, balhla: 2 };
  const ITEMS = [...Object.keys(BACK), ...Object.keys(FRONT), 'artui', 'sangha', 'balhla'];
  const LISTABLE = ['serthlum', 'theihai', 'alu', 'purun', 'zikhlum', 'mâi', 'bawkbawn', 'fanghma', 'artui', 'balhla', 'sangha'];
  const NUMBERS = ['pakhat', 'pahnih', 'pathum'];
  const COLOUR = { serthlum: '#f39a2b', theihai: '#f2b84a', alu: '#c9965e', purun: '#c46a9e', hmarcha: '#d8323a', zikhlum: '#7cc65a', 'mâi': '#f08a2c', bawkbawn: '#6b3a8f', fanghma: '#4f9e3c', sawhthing: '#d9b56a', artui: '#fbf3e4', sangha: '#9fb6c8', balhla: '#f2cf3a' };
  const ROVA_AT = [30, 2, 0], BASKET_AT = [27, -9, 0];
  const TRAY = [-4, -31];
  const SIGN_Y = 22;                                  // the sign hangs to one side, clear of the shopkeeper                             // the money tray, by the shopkeeper

  const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const toward = (v, t, step) => (v < t ? Math.min(t, v + step) : Math.max(t, v - step));

  function init() {
    return {
      t: 0, awning: 'sen', open: 1, openT: 1, dusk: 0, duskT: 0,
      list: null, basket: {}, flying: [], coins: [], paid: 0, say: null, sayT: 0,
      onPan: null, tilt: 0, tiltT: 0, last: null, reach: 0, cheer: 0,
    };
  }
  function newList(s) {
    const pick = LISTABLE.slice().sort(() => Math.random() - .5).slice(0, 2);
    s.list = pick.map(w => [w, 1 + Math.floor(Math.random() * 3)]);
    s.basket = {};
    speak(s, 'Rova', 'chibai');
  }
  function speak(s, who, word) { s.say = { who, word }; s.sayT = 2.6; }

  function step(s, dt) {
    s.t += dt;
    s.open = toward(s.open, s.openT, dt * 1.6);
    s.dusk = toward(s.dusk, s.duskT, dt * 0.8);
    s.tilt = toward(s.tilt, s.tiltT, dt * 1.5);
    s.sayT = Math.max(0, s.sayT - dt);
    s.reach = Math.max(0, s.reach - dt * 2);
    s.cheer = Math.max(0, s.cheer - dt);
    // Things bought fly in an arc into Rova's basket; coins fly from Rova to the tray.
    for (const f of s.flying) f.k += dt / .6;
    s.flying = s.flying.filter(f => { if (f.k < 1) return true; s.basket[f.w] = (s.basket[f.w] || 0) + 1; return false; });
    for (const c of s.coins) c.k += dt / .7;
    s.coins = s.coins.filter(c => { if (c.k < 1) return true; s.paid++; return false; });
    return true;
  }
  const tint = s => c => mix(mix(c, '#ff9a5a', s.dusk * .15), '#1e2850', s.dusk * .38);

  // ---------- the produce ----------
  // k scales a pile (1 on the stall, smaller on the balance's pan).
  function produce(w, at, k = 1, bias = 0) {
    const [x, y, z] = at, out = [];
    const B = (dx, dy, dz, r, pal, o = {}) => out.push(ball([x + dx * k, y + dy * k, z + dz * k], r * k, { pal, ...o }));
    const L = (pts, col, wd, o = {}) => out.push(line(pts.map(([dx, dy, dz]) => [x + dx * k, y + dy * k, z + dz * k]), { col, w: wd * k, ...o }));
    const leaf = (dx, dy, dz) => L([[dx, dy, dz], [dx + .8, dy + .6, dz + 1.2]], '#4f9e3c', .9, { ink: false });
    switch (w) {
      case 'serthlum': [[-2.2, -1.6, 2], [2.2, -1.6, 2], [0, 1.8, 2], [-1, 0, 4.6], [1.6, .6, 4.4]].forEach(([a, b, c], i) => { B(a, b, c, 2.3, shade('#f39a2b')); if (i > 2) leaf(a, b, c + 2.2); }); break;
      case 'theihai': [[-2, -1.6, 2.2, '#9bc94a'], [2, -1.4, 2.2, '#f2b84a'], [0, 1.8, 2.2, '#f5a53a'], [0, 0, 4.8, '#e9c64a']].forEach(([a, b, c, col]) => B(a, b, c, 2.4, shade(col))); break;
      case 'zikhlum':
        B(0, 0, 3.6, 3.9, shade('#8fd06e'));
        for (const a of [0, 1.6, 3.2, 4.8]) B(Math.cos(a) * 2.4, Math.sin(a) * 2.4, 2.6, 2.2, shade('#5fa451'));
        break;
      case 'mâi':
        B(0, 0, 3.6, 4.2, shade('#f08a2c'));
