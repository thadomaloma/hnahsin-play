      const extra = this.streak >= 3 ? this.streak - 2 : 0;
      if (extra) { this.coinsGot += extra; this.floatText(`+${extra} 🪙`, this.rova.x, this.rova.y - 150); }
      this.glow.emitting = this.streak >= 3;
      this.showBanner((this.streak >= 3 ? `🔥 ${L(`${this.streak} in a row!`, `${this.streak} zawnin!`)}\n` : '') + (gate.q.saying ? `“${t[1]}”\n${t[0]}` : B ? `🌉 ${[...B.prefix, ...B.built, t[0]].join(' ')}` : `${emo(t)}${t[0]} · ${asks(t)}`), '#ffffff');
      this.speed = Math.min(this.speed + 6, 440);     // (faster after each right door, to a pace still to be read at)
      this.pose(CHEER, 520);
      SFX.right(); if (this.streak >= 3) SFX.combo(this.streak);
      if (word && this.mode !== 'daily') review.hit(word);
    } else {
      // a shield takes the heart's place, once
      if (this.shield) { this.shield = false; this.floatText('🛡️', this.rova.x, this.rova.y - 150); }
      else if (!this.relaxed) this.hearts--;
      this.streak = 0; this.glow.emitting = false;
      // Hit-stop, then a shake: the miss lands.
      this.physics.world.pause();
      this.time.delayedCall(90, () => { this.physics.world.resume(); if (!STILL) this.cameras.main.shake(260, .012); });
      this.tweens.add({ targets: door, angle: 12, duration: 70, yoyo: true, repeat: 3 });
      this.tweens.add({ targets: this.rova, alpha: .3, duration: 90, yoyo: true, repeat: 4 });
      this.tweens.add({ targets: this.rova, angle: { from: -14, to: 0 }, duration: 520, ease: 'Back.Out' });
      this.pose(STUMBLE, 600);
      this.showBanner(gate.q.saying ? `“${t[1]}”\n${t[0]}` : B ? L(`It was “${t[0]}”`, `“${t[0]}” a ni`) : L(`It was ${t[0]}\n${asks(t)}`, `${t[0]} a ni\n${asks(t)}`), '#ffd6e4', 2400);
      SFX.wrong();
      if (word && this.mode !== 'daily') review.miss(word);
    }
    // the sentence bridge: the word goes into the sentence (the right one, if a wrong door was taken); built
    // without a slip, a bonus
    if (B) {
      B.built.push(t[0]); if (!right) B.ok = false;
      if (B.built.length === B.steps.length) this.time.delayedCall(right ? 900 : 2500, () => {
        if (B.ok) { this.coinsGot += 15; this.floatText('+15 🪙', this.rova.x, this.rova.y - 170); SFX.finish(); }
        this.showBanner(`🌉 ${B.ok ? L('Sentence built!', 'Thu i siam zo!') : ''}\n${[...B.prefix, ...B.built].join(' ')}\n“${B.english}”`, B.ok ? '#fff3b0' : '#ffffff', 2600);
        this.updateHud();
      });
    }
    if (word && this.mode !== 'practice') book.met(t, right, this.mode === 'level' ? this.level : -1);
    // Record encounter for progress tracking
    if (window.Progress && word) {
      const vid = vocabId(t);
      if (vid) { try { window.Progress.recordEncounter(vid, 'journey', right); } catch {} }
    }
    gate.doors.forEach((d, i) => { if (i !== lane) this.tweens.add({ targets: d, alpha: 0, duration: 400, delay: 300 }); });
    this.ask.setVisible(false); this.askPic.setVisible(false); this.askImg.setVisible(false); this.picFor = null;
    this.updateHud();
    if (this.hearts <= 0) this.time.delayedCall(700, () => this.finish(false));
  }

  // a pose held for a moment (the cheer, the stumble): only the 3D Rova has them
  pose(f, ms) { if (this.sheet3d && this.frames3d > f) this.posed = { f, until: this.time.now + ms }; }

  floatText(text, x, y) {
    const t = this.add.text(x, y, text, { fontFamily: 'Plus Jakarta Sans', fontSize: '34px', fontStyle: '800', color: '#ffe08a', stroke: '#0d2a4a', strokeThickness: 7 }).setOrigin(.5).setDepth(11);
    this.tweens.add({ targets: t, y: y - 90, alpha: 0, duration: 900, onComplete: () => t.destroy() });
  }

  showBanner(text, colour, ms = 1400) {
    this.banner.setText(text).setColor(colour).setAlpha(1).setScale(.7);
    this.tweens.killTweensOf(this.banner);
    this.tweens.add({ targets: this.banner, scale: 1, duration: 260, ease: 'Back.Out' });
    this.tweens.add({ targets: this.banner, alpha: 0, delay: ms, duration: 400 });
  }

  updateHud() {
    const done = this.marks ? this.marks.length : 0, h = Math.max(this.hearts, 0);
    const hearts = this.relaxed ? '💚'.repeat(this.maxHearts) : '❤️'.repeat(h) + '🖤'.repeat(Math.max(0, this.maxHearts - h));
    const doors = this.mode === 'endless' ? `🚪 ${done}` : `🚪 ${done}/${this.plan.length}`;
    const now = this.time.now, on = (this.magnetUntil > now ? '🧲' : '') + (this.shield ? '🛡️' : '') + (this.calmUntil > now ? '⏳' : '');
    this.hud.setText(`${hearts}   🪙 ${this.coinsGot}   ${doors}${this.streak >= 2 ? `   🔥${this.streak}` : ''}${on ? `   ${on}` : ''}`);
  }

  jump() {
    if (!this.started || this.over || this.paused) return;
    if (this.onGround) this.jumps = 0;
    if (this.jumps >= 2) return;
    this.rova.body.setVelocityY(this.jumps === 0 ? -1420 : -1180);
    this.jumps++;
    this.air = true;
    this.onGround = false;
    this.tweens.add({ targets: this.rova, scaleY: { from: .8 * this.rovaScale, to: this.rovaScale }, duration: 200 });
    if (this.jumps === 2) { this.sparks.explode(6, this.rova.x, this.rova.y + 40); SFX.jump2(); } else SFX.jump();
  }

  land() {
    this.air = false; this.jumps = 0; this.onGround = true;
    this.dust.explode(8, this.rova.x, this.groundY);
    this.tweens.add({ targets: this.rova, scaleY: { from: .82 * this.rovaScale, to: this.rovaScale }, scaleX: { from: 1.12 * this.rovaScale, to: this.rovaScale }, duration: 160 });
  }

  // Keep Rova 160 from the left edge, inside the road.
  follow() {
    this.cameras.main.scrollX = Phaser.Math.Clamp(this.rova.x - 160 - (GW - 720) / 3, 0, this.length - GW);
  }

  update() {
    this.follow();
    if (this.over) { this.placeLooks(this.frameNow || 0); return; }
    const now = this.time.now;
    if (this.started) this.rova.body.setVelocityX(this.speed * (1 + .1 * this.skill) * (this.slowUntil > now ? .7 : 1) * (this.calmUntil > now ? .72 : 1));
    // the magnet: coins ahead and near come to Rova
    if (this.magnetUntil > now) for (const c of this.coins.getChildren()) {
      const dx = c.x - this.rova.x, dy = c.y - (this.rova.y - 30);
      if (dx > -60 && dx < 380 && Math.abs(dy) < 520) { c.x -= dx * .16; c.y -= dy * .16; }
    }
    this.ring.setVisible(!!this.shield).setPosition(this.rova.x, this.rova.y - 6);
    // a letter not taken by the time Rova is past it: the word is missed (its letter shows as a dot)
    for (const sp of this.spells) if (!sp.done) for (const sl of sp.slots) if (!sl.done && this.rova.x > sl.x + 50) {
      sl.done = sl.missed = true; sp.failed = true; sp.got.push(sl.l); sl.toks.forEach(t => this.popBubble(t)); this.checkWord(sp); this.updateSpell();
    }
    if (Math.floor(now / 250) !== this.hudTick) { this.hudTick = Math.floor(now / 250); this.updateSpell(); this.updateHud(); }
    // Legs and arms: a run frame in time with the speed, or the jump pose in the air, or a pose held a moment.
    // (One stride takes the same time whatever the frame count: 8 × 24000 / speed ms.)
    const f = this.posed && this.time.now < this.posed.until ? this.posed.f
      : this.air ? this.rovaAir(this.rova.body.velocity.y)
      : Math.floor(this.time.now / (24000 * 8 / this.rovaRun / this.speed)) % this.rovaRun;
    this.rova.setFrame(f); this.frameNow = f;
    this.placeLooks(f);
    for (const gate of this.gates) {
      if (!gate.built && gate.x - this.rova.x < this.ahead + (this.skill < 0 ? -this.skill * 260 : -this.skill * 120)) this.buildGate(gate);
      if (gate.built && !gate.done && this.rova.x >= gate.x) this.passGate(gate);
    }
    if (this.mode === 'endless') {
      // doors ahead are made as Rova goes; doors and coins well behind him are let go
      const last = this.gates[this.gates.length - 1];
      if (last.x - this.rova.x < GAP * 3) this.addEndlessGate();
      while (this.gates.length && this.gates[0].done && this.gates[0].x < this.rova.x - 1400) { const g = this.gates.shift(); this.gone = (this.gone || 0) + 1; g.doors.forEach(d => d.destroy()); }
      this.coins.getChildren().slice().forEach(c => { if (c.x < this.rova.x - 600) c.destroy(); });
      for (const g of [this.letters, this.powers]) g.getChildren().slice().forEach(b => { if (b.x < this.rova.x - 600) { b.label.destroy(); b.destroy(); } });
      this.rocks.getChildren().slice().forEach(r => { if (r.x < this.rova.x - 600) r.destroy(); });
      if (this.signs) this.signs = this.signs.filter(c => { if (c.signX < this.rova.x - 800) { c.destroy(); return false; } return true; });
      this.spells = this.spells.filter(sp => !sp.done || sp.x0 > this.rova.x - 2000);
    }
    if (this.rova.x >= this.finishX) this.finish(true);
  }

  finish(won) {
    if (this.over) return;
    this.over = true;
    this.rova.body.setVelocity(0, 0);
    this.glow.emitting = false;
    if (won) {
      this.sparks.explode(80, this.rova.x, this.rova.y - 100); if (!STILL) this.cameras.main.flash(250, 255, 255, 255); SFX.finish();
      if (this.sheet3d && this.frames3d > CHEER) { this.rova.setFrame(CHEER); this.frameNow = CHEER; }
    }
    else SFX.lose();
    const doors = this.marks.length;
    const goals = [this.spells.length > 0 && this.spelledOk === this.spells.length, this.coinsGot >= 30, this.stumbles === 0];
    if (this.mode !== 'daily') store.set('rj.skill', Math.round(this.skill * 100) / 100);
    const bridges = this.plan.some(q => q.bridge && q.bridge.ok && q.bridge.built.length === q.bridge.steps.length) ? 1 : 0;
    this.time.delayedCall(won ? 900 : 300, () => showEnd({ mode: this.mode, level: this.level, won, right: this.right, met: this.met, marks: this.marks, coins: this.coinsGot, streak: this.bestStreak, doors, relaxed: this.relaxed, data: this.data0, goals, spelled: this.spelledOk, stumbles: this.stumbles, bridges, counted: this.counted || 0 }));
  }
}

// New words for a place: three it has that the player has not met yet (half with pictures), to learn before the

  const easy = pool.slice().sort((a, b) => a[3] - b[3]).slice(0, 40);
  const pics = shuffle(easy.filter(isPic)), rest = shuffle(easy.filter(w => !isPic(w)));
  return [...pics.slice(0, 2), ...rest].slice(0, 3);
}

// a place: its story first, the first time
function start(level) {
  const seen = store.get('rj.story', []);
  if (!seen.includes(level)) {
    const s = STORY[level];
    $('story-title').textContent = `${LEVELS[level].emoji} ${placeName(LEVELS[level])}`;
    $('story-scene').textContent = s.e;
    $('story-text').textContent = L(s.en, s.mz); $('story-text').lang = LANG === 'mz' ? 'lus' : 'en';
    $('story-other').textContent = L(s.mz, s.en); $('story-other').lang = LANG === 'mz' ? 'en' : 'lus';
    $('story-go').onclick = () => { store.set('rj.story', [...seen, level]); SFX.click(); learn(level); };
    show('story-screen'); $('story-go').focus();
    return;
  }
  learn(level);
}
function startDaily() {
  const key = today(), seed = Number(key.replace(/-/g, ''));
  play({ mode: 'daily', level: 0, seed, look: LEVELS[seed % 5], cfg: { band: [1, 5], mix: { pic: 2, en2mz: 4, mz2en: 3, gap: 1, count: 1, odd: 1 } } });
}
function startEndless() { play({ mode: 'endless', level: 1, look: LEVELS[1], cfg: { band: [1, 2], mix: { en2mz: 1 } } }); }
function practise(level, words) {
  const cfg = Object.assign({}, LEVELS[level] || LEVELS[0]);
  cfg.pool = null;
  // practice draws its wrong doors from the place's words; a word from elsewhere (the daily run) from all of them
  if (!words.every(w => poolOf(cfg).includes(w))) { cfg.band = [1, 7]; cfg.topics = null; cfg.dict = false; cfg.pool = null; }
  play({ mode: 'practice', level, look: LEVELS[level] || LEVELS[0], cfg, words });
}

// ---------------------------------------------------------------- pause, and coming back to the run
const scene = () => game.scene.getScene('play');
const playing = () => { const s = scene(); return s && !s.over && $('pause-btn').hidden === false; };
function pause() {
  const s = scene(); if (!playing() || s.paused) return;
  s.paused = true; game.scene.pause('play');
  SFX.click(); show('pause-screen'); $('pause-resume').focus();
}
function resume() {
  const s = scene(); if (!s || !s.paused) return;
  show(null);
  // three, two, one: back into the run with time to see it
  const c = $('count'); let n = 3;
  const tick = () => {
    if (n === 0) { c.hidden = true; s.paused = false; game.scene.resume('play'); return; }
    c.textContent = n--; c.hidden = false; SFX.click(); setTimeout(tick, 420);
  };
  tick();
}

// ---------------------------------------------------------------- the end of a run
function showEnd(r) {
  const { mode, level, won, right, met, coins } = r;
  const stat = mode === 'level' ? `journey/level-${level + 1}/${won ? 'done' : 'lost'}` : `journey/${mode}/${won ? 'done' : 'end'}`;
  hnStat(stat, `Rova's Journey: ${mode === 'level' ? 'level ' + (level + 1) : mode} ${won ? 'done' : 'ended'}`);
  let got = 0, bonus = 0, best = false;
  const earn = [];
  if (mode === 'level') {
    got = !won ? 0 : right >= met.length ? 3 : right >= met.length - 3 ? 2 : 1;
    const all = store.get('rj.stars', {});
    best = got > (all[level] || 0);
    all[level] = Math.max(all[level] || 0, got); store.set('rj.stars', all);
    if (won) {
      store.set('rj.unlocked', Math.max(store.get('rj.unlocked', 0), Math.min(level + 1, LEVELS.length - 1))); bonus = 25;
      const g = store.get('rj.goals', {}), had = g[level] || [false, false, false];
      g[level] = had.map((d, k) => d || r.goals[k]); store.set('rj.goals', g);
      bonus += 10 * r.goals.filter((d, k) => d && !had[k]).length;     // (a goal reached for the first time: ten coins)
    }
  } else if (mode === 'daily') {
    const key = today(), d = store.get('rj.daily', {});
    if (d.date !== key) {
      store.set('rj.daily', { date: key, marks: r.marks.map(m => (m ? '1' : '0')).join(''), coins, relaxed: r.relaxed });
      const st = store.get('rj.dailyStreak', { n: 0, last: '' }), y = new Date(); y.setDate(y.getDate() - 1);
      const yk = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
      store.set('rj.dailyStreak', { n: st.last === yk ? st.n + 1 : 1, last: key });
      store.set('rj.dailyBest', Math.max(store.get('rj.dailyBest', 0), st.last === yk ? st.n + 1 : 1));
      if (won) bonus = 40;
    }
  } else if (mode === 'endless') {
    const prev = store.get('rj.endlessBest', 0);
    best = right > prev; if (best) store.set('rj.endlessBest', right);
    bonus = right * 2;
  }
  wallet.add(coins + bonus);
  // the run's numbers for the medals
  if (mode !== 'practice') {
    const s = lifeStats();
    s.right = (s.right || 0) + right; s.spelled = (s.spelled || 0) + (r.spelled || 0); s.bridges = (s.bridges || 0) + (r.bridges || 0);
    s.counted = (s.counted || 0) + (r.counted || 0);
    if (won && !r.stumbles) s.clean = (s.clean || 0) + 1;
    if (mode === 'level' && won && right === met.length) s.perfect = (s.perfect || 0) + 1;
    store.set('rj.stats', s);
  }
  const medals = newMedals();
  // the title
  $('end-title').textContent = mode === 'endless' ? `♾️ ${L(`${right} doors!`, `Kawngkhar ${right}!`)}`
    : mode === 'practice' ? `🔁 ${L('Practice done', 'Zir nawnna a zo')}`
    : mode === 'daily' ? `📅 ${L('Daily run', 'Ni tin tlan')} · ${dayName(today())}`
    : won ? L(`${placeName(LEVELS[level])} done!`, `${placeName(LEVELS[level])} a zo!`) : L('Out of hearts', 'Nunna a tawp');
  $('end-stars').innerHTML = mode === 'level' ? (won ? [0, 1, 2].map(i => `<span style="--d:${250 + i * 220}ms">${i < got ? '⭐' : '☆'}</span>`).join('') : '<span>💔</span>') : '';
  $('end-note').textContent = `${L(`${right} of ${met.length} doors right`, `Kawngkhar ${met.length} zingah ${right} dik`)} · ${L('The words you met:', 'I thumal tawh te:')}`;
  earn.push(`🪙 +${coins + bonus}`);
  if (r.streak >= 3) earn.push(`🔥 ${r.streak}`);
  $('end-earn').innerHTML = medals.map(m => `<span class="best">🏅 ${m.icon} ${L(m.en, m.mz)} +50</span>`).join('') + earn.map(t => `<span>${t}</span>`).join('') + `<span>${L('You have', 'I nei')} 🪙 ${wallet.get()}</span>` + (best && mode !== 'practice' ? `<span class="best">${L('New best!', 'A tha ber thar!')}</span>` : '');
  // the place's three goals: done this time, and done before
  $('end-goals').hidden = mode !== 'level';
  if (mode === 'level') { const had = goalsOf(level); $('end-goals').innerHTML = GOALS.map(([i, en, mz], k) => `<li class="${r.goals[k] && won ? 'done' : ''}"><span>${i} ${L(en, mz)}</span><span>${r.goals[k] && won ? '✓' : had[k] ? '☆' : '–'}</span></li>`).join(''); }
  // the daily run's result, to share
  $('end-share').hidden = mode !== 'daily';
  if (mode === 'daily') {
    const d = store.get('rj.daily', {}), marks = (d.marks || '').split('').map(c => (c === '1' ? '🟩' : '🟥')).join('');
    $('end-marks').textContent = marks;
    const text = `Rova's Journey · ${L('Daily', 'Ni tin')} ${dayName(today())}\n${marks} ${(d.marks || '').split('').filter(c => c === '1').length}/${(d.marks || '').length}${d.relaxed ? ' 🌿' : ''}\nthadomaloma.github.io/hnahsin-play/journey.html`;
    $('end-share-btn').textContent = `📤 ${L('Share', 'Thawn rawh')}`;
    $('end-share-btn').onclick = async () => {
      try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast(L('Copied!', 'A copy ta!')); } } catch {}
    };
  }
  // the words met: each with its picture; a missed one with its example
  $('end-recap').innerHTML = met.map(({ w, right }, i) => `<li class="${right ? '' : 'missed'}" style="--d:${500 + i * 60}ms"><b>${pic(w)}${esc(w[0])}</b><span>${esc(w[1])}</span>${!right && w[2] ? `<em>${esc(w[2])}${w[9] ? ` (${esc(w[9])})` : ''}</em>` : ''}</li>`).join('');
  // practise the missed words (not sayings), at once
  const missed = met.filter(m => !m.right && m.kind !== 'saying' && m.kind !== 'bridge').map(m => m.w);
  $('end-practise').hidden = !missed.length || mode === 'practice';
  $('end-practise').textContent = `🔁 ${L(`Practise the ${missed.length} missed word${missed.length > 1 ? 's' : ''}`, `I dik lohna ${missed.length} zir nawn rawh`)}`;
  $('end-practise').onclick = () => practise(level, missed);
  const next = $('end-next');
  $('end-menu').textContent = L('Map', 'Map');
  if (mode === 'level') {
    next.textContent = won && level < LEVELS.length - 1 ? L('Next place', 'A dawt lehah') : L('Play again', 'Khel leh rawh');
    next.onclick = () => (won && level < LEVELS.length - 1 ? start(level + 1) : play(current));
  } else {
    next.textContent = L('Play again', 'Khel leh rawh');
    next.onclick = () => play(current);
  }
  show('end-screen');
  game.loop.sleep();   // the last picture stays behind the end screen
}

(() => {

  let last = 0;

      last = t;
      const dpr = Math.min(devicePixelRatio || 1, 3);
      if (c.width !== Math.round(c.clientWidth * dpr)) { c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr); }

      if (rovaSheet.complete && rovaSheet.naturalWidth) {
        // the Blender frames: a stride in 16 × 33 ms, close to rova.js's 440 ms
        const i = STILL ? 4 : Math.floor(t / 33) % SHEET_RUN, sw = Math.round(120 * SHEET_PX), sh = Math.round(160 * SHEET_PX);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(rovaSheet, (i % SHEET_COLS) * sw, Math.floor(i / SHEET_COLS) * sh, sw, sh, 0, 0, c.width, c.height);
        ctx.setTransform(c.width / 120, 0, 0, c.height / 160, 0, 0);
        drawLooks(ctx, i);
      } else {
        ctx.setTransform(c.width / 120, 0, 0, c.height / 160, 0, 0);
        drawRova(ctx, STILL ? .6 : t / 70, 'run');
      }
    }
    if (!STILL) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  if (STILL) rovaSheet.addEventListener('load', () => requestAnimationFrame(draw));   // swap in the 3D Rova once he arrives
})();
</script>
