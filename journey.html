<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3c9fea"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hnahsin"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" href="favicon.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script><style>
  /* App mode for the game pages: no zoom by double tap, and no pinch-zoom where the game is played (Rova's
     Journey's game, Touch and learn's scene, Aizawl Ride's road and its buttons, pressed with two thumbs at
     once); everywhere else a pinch zooms, for those who need the words bigger. No pull-to-refresh or bounce,

  .hn-fs.float { position: fixed; z-index: 50; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); box-shadow: 0 2px 0 rgba(35, 30, 22, .35); }
  .hn-install { position: fixed; z-index: 60; left: 0; right: 0; margin-inline: auto; width: max-content; top: max(10px, env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; max-width: calc(100% - 20px); padding: 8px 8px 8px 14px; border-radius: 14px; border: 2px solid #231e16; background: #fffdf8; color: #231e16; font: 700 14px/1.3 system-ui, sans-serif; box-shadow: 0 3px 0 rgba(35, 30, 22, .35); }
  .hn-install button, .hn-install a { flex: none; border-radius: 10px; border: 1.5px solid #231e16; padding: 6px 10px; font: 800 14px system-ui, sans-serif; background: #2e7d32; color: #fff; text-decoration: none; cursor: pointer; }

<script>
  // App mode, the part CSS cannot do: iPhones zoom on a pinch whatever the page says, so a pinch begun
  // where the game is played is stopped here (elsewhere it zooms); a full-screen button where the browser allows one (Android), when not already opened
  // from the home screen; and, from the third visit, a word on installing Hnahsin (once a week at most).
  (() => {
    const play = t => t && t.closest && t.closest('#game, #stage, .controls');
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => { if (play(e.target)) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', e => { if (e.touches.length > 1 && [...e.touches].some(t => play(t.target))) e.preventDefault(); }, { passive: false });
    const app = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
    const touch = matchMedia('(pointer: coarse)').matches;
    const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    addEventListener('DOMContentLoaded', () => {
      const el = document.documentElement;
      if (!app && touch && document.fullscreenEnabled && el.requestFullscreen) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'hn-fs'; b.textContent = '⛶'; b.setAttribute('aria-label', 'Full screen');
        b.onclick = () => (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen({ navigationUI: 'hide' })).catch(() => {});
        document.addEventListener('fullscreenchange', () => { b.textContent = document.fullscreenElement ? '✕' : '⛶'; b.setAttribute('aria-label', document.fullscreenElement ? 'Leave full screen' : 'Full screen'); });
        // in the page's own top bar (as Rova's Journey has no header, beside its stars), looking like the chip next to it
        const head = document.querySelector('header.top') || (document.querySelector('a.home') || {}).parentElement;
        if (head) {
          const like = [...head.children].reverse().find(c => c.offsetHeight >= 28 && c.offsetHeight <= 52);
          if (like) { const cs = getComputedStyle(like); Object.assign(b.style, { height: cs.height, width: cs.height, border: cs.border, background: cs.background, color: cs.color, boxShadow: cs.boxShadow }); }
          head.appendChild(b);
        } else { b.classList.add('float'); document.body.appendChild(b); }
      }
      if (app || !touch) return;
      const visits = +(get('hn-visits') || 0) + 1; set('hn-visits', visits);
      const last = +(get('hn-install-asked') || 0);
      if (visits < 3 || Date.now() - last < 7 * 864e5) return;
      const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const show = (inner, onYes) => {
        const bar = document.createElement('div'); bar.className = 'hn-install'; bar.setAttribute('role', 'status');
        bar.innerHTML = `<span>📲 Install Hnahsin: it opens like an app, full screen</span>${inner}<button class="x" type="button" aria-label="Not now">✕</button>`;
        set('hn-install-asked', Date.now());     // (asked: not again for a week, whatever is done with it)
        const close = () => bar.remove();
        bar.querySelector('.x').onclick = close;
        const yes = bar.querySelector('.yes'); if (yes && onYes) yes.onclick = () => { onYes(); close(); };
        document.body.appendChild(bar); setTimeout(() => bar.isConnected && close(), 15000);
      };
      if (ios) show('<a class="yes" href="./#install">How</a>');
      else addEventListener('beforeinstallprompt', e => { e.preventDefault(); show('<button class="yes" type="button">Install</button>', () => e.prompt()); }, { once: true });
    });
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@700&display=swap">
<style>
  :root {

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; overflow: hidden; }
  #game { position: fixed; inset: 0; display: grid; place-items: center; }

  /* The title screen sits on its own sunny hillside. */

     browser, which slid the card off the screen) */
  #title-screen, #story-screen { background: radial-gradient(circle at 85% 8%, rgba(255, 255, 255, .9), rgba(255, 249, 220, .3) 12%, transparent 30%), linear-gradient(180deg, #3c9fea, #8fd0fa 55%, #cdeeff); overflow: hidden; overflow: clip; }
  #title-screen::before, #title-screen::after { content: ""; position: absolute; left: -20%; right: -20%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; z-index: -1; }
  #title-screen::before { bottom: -6%; height: 34%; background: #8fd27a; }

  .card { position: relative; width: min(440px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border-radius: 28px; padding: 18px 18px 20px; display: grid; gap: 14px; box-shadow: 0 30px 60px -24px rgba(13, 42, 74, .55); animation: cardIn .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .card h1 .runner canvas { display: block; width: 100%; height: 100%; }
  .card h1 + small { display: block; margin-top: -10px; font-family: "Caveat", cursive; font-size: 26px; color: var(--brand); }
  .card h2 { margin: 4px 0 0; font-size: 15px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
  .card p { margin: 0; color: var(--muted); line-height: 1.5; }
  .howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .howto li { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 16px; background: #f1f8fe; text-align: center; font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.3; }

  .relax input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }

  .map { position: relative; border-radius: 18px; background: linear-gradient(180deg, #e7f4ff, #f4fbef); padding: 6px; }
  .map svg { display: block; width: 100%; height: auto; overflow: visible; }

  .levels { display: grid; gap: 8px; }
  .level { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid #d6e6f2; background: #fff; border-radius: 18px; padding: 6px 10px 6px 6px; font: inherit; color: var(--ink); cursor: pointer; text-align: left; box-shadow: 0 6px 16px -12px rgba(13, 71, 161, .5); transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s; animation: cardIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d); }
  .level:not([disabled]):hover { transform: translateY(-2px); box-shadow: 0 12px 22px -12px rgba(13, 71, 161, .55); }
  .level:not([disabled]):active { transform: scale(.98); }
  .level .e { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(160deg, var(--s1), var(--s2)); font-size: 22px; box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .06); }
  .level b { display: block; font-size: 15px; }
  .level span.sub { color: var(--muted); font-size: 12.5px; font-weight: 600; line-height: 1.3; display: block; }
  .level .stars { font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
  .level[disabled] { cursor: default; background: #f6f9fc; }
  .level[disabled] .e { filter: grayscale(.8); opacity: .6; }
  .level[disabled] b, .level[disabled] .stars { opacity: .5; }
  .level.here { border-color: var(--gold); box-shadow: 0 0 0 2px #ffe7a3, 0 6px 16px -12px rgba(13, 71, 161, .5); }
  .btn { position: relative; border: 0; border-radius: 99px; padding: 14px 18px; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; background: var(--brand); color: #fff; box-shadow: 0 4px 0 #0d47a1; transition: transform .12s, box-shadow .12s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d47a1; }
  .btn.ghost { background: #eaf3fc; color: var(--brand); box-shadow: 0 4px 0 #c9ddf3; }
  .btn.ghost:active { box-shadow: 0 1px 0 #c9ddf3; }
  .btn.leaf { background: var(--leaf); box-shadow: 0 4px 0 #2f6b22; }
  .btn.leaf:active { box-shadow: 0 1px 0 #2f6b22; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .recap { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .recap li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 2px; border-bottom: 1px solid #e6eef5; font-size: 15px; animation: cardIn .4s both; animation-delay: var(--d); }
  .recap li b { font-weight: 800; color: #2e7d32; display: inline-flex; align-items: center; gap: 6px; }
  .recap li span { color: var(--muted); text-align: right; }
  .recap li em { grid-column: 1 / -1; font-style: normal; font-size: 13.5px; color: var(--muted); background: #fff5f8; border-radius: 10px; padding: 6px 10px; }

  .share { display: grid; gap: 8px; justify-items: center; text-align: center; }
  .share .marks { font-size: 26px; letter-spacing: 2px; }
  #end-title, #pause-title, #story-title { justify-content: center; }

  @keyframes starIn { from { opacity: 0; transform: scale(.2) rotate(-40deg); } }
  #end-note { text-align: center; }

<div id="game"></div>

<script>// Counts which pages and games are played, with GoatCounter: no cookies and
// nothing that identifies a person. hnStat('play/bee') counts one event.
// Change CODE if the GoatCounter site is named differently.
(function () {
  var CODE = 'hnahsin';
  var queue = [];
  // Counting must never stop a game: any error here (say, storage blocked) is ignored.
  window.hnStat = function (name, title) {
    try {
      if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: title || name, event: true });
      else queue.push([name, title]);
    } catch (e) {}
  };
  // Count only on the real site, not while testing or in a preview.
  if (location.hostname !== 'thadomaloma.github.io') { window.hnStat = function () {}; return; }
  window.goatcounter = { no_onload: false };
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', 'https://' + CODE + '.goatcounter.com/count');
  s.onload = function () {
    queue.forEach(function (q) { window.hnStat(q[0], q[1]); });
    queue = [];
  };
  document.head.appendChild(s);
})();</script>
<script>// Rova and Mami, drawn from parts so their arms and legs can really run.
// drawRova(ctx, phase, pose, opts) and drawMami(ctx, phase, pose, opts) paint them facing right
// in a 120 × 160 box with their feet near the bottom. phase is the run cycle in radians; pose is
// 'run', 'jump', 'stand' or 'bow' (opts.bow, 0–1, is how deep: a Japanese-style bow from the
// hips, hands at the sides), or 'front': facing the viewer, bowing toward them by opts.bow;
// opts.live lets them blink (leave it off when drawing frames to keep).
// Used by the home page, Rova's Journey and the Playground, so they look the same everywhere.
// Every part has a dark ink edge and a lighter side toward the light, like a cartoon.
(function (global) {
  const ROVA = {
    skin: '#eab68c', skinShade: '#d39a70', skinFar: '#cf9a72', hair: '#1f1b24', hairShine: '#4a4560',
    shirt: '#1565c0', shirtLight: '#3d86dc', shirtFar: '#0f4f9e', stripe: '#ffc94a', collar: '#0d47a1',
    shorts: '#183a63', shortsLight: '#26507f', shortsFar: '#0e2a4a', sock: '#ffffff',
    shoe: '#ffffff', shoeFar: '#dfe6ee', sole: '#c2185b', lace: '#c2185b', eye: '#1d1b22', mouth: '#8a3a2e', cheek: 'rgba(240,120,110,.28)',
    skirt: false, ponytail: false,
  };
  const MAMI = {
    skin: '#ecbb95', skinShade: '#d6a07a', skinFar: '#d09d77', hair: '#2a181d', hairShine: '#5a3a44',
    shirt: '#e0457b', shirtLight: '#f06d9a', shirtFar: '#b8325f', stripe: '#ffffff', collar: '#ffffff',
    shorts: '#7a2a8c', shortsLight: '#9442a8', shortsFar: '#5e1f6c', sock: '#ffffff',
    shoe: '#ffffff', shoeFar: '#e6dcef', sole: '#7569e8', lace: '#7569e8', eye: '#1d1b22', mouth: '#8a3a2e', cheek: 'rgba(240,98,146,.38)',
    skirt: true, ponytail: true, tie: '#ffc94a',
  };
  const INK = '#2a1f1c';
  const rad = d => d * Math.PI / 180;
  const at = (x, y, a, len) => [x + Math.sin(rad(a)) * len, y + Math.cos(rad(a)) * len];

  // A thick rounded stroke with an ink edge: the edge first, a little wider, then the colour.
  function seg(ctx, pts, w, col, edge = 2.2) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); };
    path(); ctx.strokeStyle = INK; ctx.lineWidth = w + edge * 2; ctx.stroke();
    path(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }
  function blob(ctx, draw, fill, edge = 2) {
    ctx.beginPath(); draw(); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = edge; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  }

  function shoe(ctx, C, x, y, a, near) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-rad(a) * .35);
    // A sneaker: rounded toe forward, a coloured sole, two laces.
    blob(ctx, () => {
      ctx.moveTo(-6, -4); ctx.quadraticCurveTo(-6, -8, 0, -8); ctx.lineTo(6, -6);
      ctx.quadraticCurveTo(16, -4, 16, 2); ctx.lineTo(16, 4); ctx.lineTo(-7, 4); ctx.quadraticCurveTo(-8, 0, -6, -4);
    }, near ? C.shoe : C.shoeFar, 1.8);
    ctx.fillStyle = C.sole; ctx.fillRect(-7, 3, 23, 3.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.strokeRect(-7, 3, 23, 3.2);
    ctx.strokeStyle = C.lace; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(2, -6); ctx.lineTo(5, -3); ctx.moveTo(5, -6.5); ctx.lineTo(8, -3.5); ctx.stroke();
    ctx.restore();
  }

  function leg(ctx, C, hip, phase, near, pose) {
    let thigh, knee;
    if (pose === 'jump') { thigh = near ? 62 : 22; knee = near ? -78 : -92; }
    else if (pose === 'stand' || pose === 'bow') { thigh = near ? 3 : -3; knee = 0; }
    else {
      thigh = 36 * Math.sin(phase);
      // The knee folds while the leg swings forward, and straightens as it pushes back.
      knee = -(12 + 70 * Math.max(0, Math.cos(phase)));
    }
    const kneeP = at(hip[0], hip[1], thigh, 24), foot = at(kneeP[0], kneeP[1], thigh + knee, 25);
    const skin = near ? C.skin : C.skinFar;
    seg(ctx, [hip, kneeP, foot], 10, skin, 1.8);
    // A sock band above the shoe.
    const sk = at(foot[0], foot[1], thigh + knee + 180, 3.5);
    seg(ctx, [sk, foot], 10.5, near ? C.sock : '#e3e7ee', 1.6);
    if (!C.skirt) {
      // Shorts over the top of the thigh, a little flared.
      const mid = at(hip[0], hip[1], thigh, 11);
      seg(ctx, [hip, mid], 13, near ? C.shorts : C.shortsFar, 1.6);
    }
    shoe(ctx, C, foot[0], foot[1] + 1, thigh + knee, near);
  }

  function arm(ctx, C, sh, phase, near, pose, lean = 0) {
    let upper, fore;
    // Standing, the arms hang down; bowing, they lie along the body (hands on the thighs).
    if (pose === 'stand') { upper = near ? 6 : -4; fore = upper + 6; }
    else if (pose === 'bow') { upper = lean * .55 + (near ? 4 : -2); fore = upper + 4; }
    else if (pose === 'jump') { upper = near ? 105 : -65; fore = near ? 150 : -25; }   // reach forward, the other arm back
    else { upper = -44 * Math.sin(phase); fore = upper + 82 + 12 * Math.sin(phase); }
    const elbow = at(sh[0], sh[1], upper, 19), hand = at(elbow[0], elbow[1], fore, 16);
    const skin = near ? C.skin : C.skinFar;
    seg(ctx, [elbow, hand], 8, skin, 1.8);                                   // forearm
    seg(ctx, [at(sh[0], sh[1], upper, 8), elbow], 8, skin, 1.8);            // upper arm
    seg(ctx, [sh, at(sh[0], sh[1], upper, 11)], 11.5, near ? C.shirt : C.shirtFar, 1.8);   // short sleeve over the top
    // Then the hand.
    ctx.beginPath(); ctx.arc(hand[0], hand[1], 4.8, 0, Math.PI * 2);
    ctx.fillStyle = skin; ctx.fill(); ctx.lineWidth = 1.8; ctx.strokeStyle = INK; ctx.stroke();
  }

  function drawKid(ctx, C, phase = 0, pose = 'run', opts = {}) {
    const run = pose === 'run', bowing = pose === 'bow';
    const bob = run ? -Math.abs(Math.sin(phase)) * 5 : 0;
    ctx.save();
    ctx.translate(0, bob);
    // How far the body leans forward from the hips: a little to run, up to 60° in a deep bow.
    const lean = run ? 10 : bowing ? 3 + 57 * Math.max(0, Math.min(1, opts.bow ?? 1)) : pose === 'stand' ? 1 : 3;
    const hip = [57, 95], sh = at(hip[0], hip[1], 180 + lean, 32);
    const neck = at(sh[0], sh[1], 180 + lean, 6);
    // The head sits on the neck and turns down with the body in a bow.
    const hc = at(neck[0], neck[1], 180 + lean * 1.1, 17);
    const hx = bowing ? hc[0] + 4 : sh[0] + 7, hy = bowing ? hc[1] : sh[1] - 23;
    const headTilt = run ? Math.sin(phase * 2) * 1.5 : bowing ? lean * .9 : pose === 'stand' ? 0 : -4;

    // Ponytail first: it streams out behind and swings with each step.
    if (C.ponytail) {
      const swing = run ? Math.sin(phase * 2 - .6) * 6 : -12, lift = run ? Math.abs(Math.sin(phase)) * 3 : 6;
      blob(ctx, () => {
        ctx.moveTo(hx - 12, hy - 9);
        ctx.bezierCurveTo(hx - 30, hy - 14 - lift, hx - 44, hy + swing - lift, hx - 40, hy + 16 + swing);
        ctx.bezierCurveTo(hx - 36, hy + 8 + swing * .6, hx - 26, hy + 2, hx - 13, hy + 1);
      }, C.hair, 2);
      ctx.strokeStyle = C.hairShine; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx - 20, hy - 7 - lift * .5); ctx.quadraticCurveTo(hx - 32, hy - 6 - lift + swing * .3, hx - 37, hy + 6 + swing * .7); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx - 13, hy - 4, 4.2, 0, Math.PI * 2); ctx.fillStyle = C.tie; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = INK; ctx.stroke();
    }

    arm(ctx, C, sh, phase + Math.PI, false, pose, lean);
    leg(ctx, C, hip, phase + Math.PI, false, pose);

    // Body: a T-shirt that narrows to the waist, with the stripe and a collar.
    const L = [hip[0] - 12, hip[1] - 2], R = [hip[0] + 12, hip[1] - 2];
    const SL = [sh[0] - 12, sh[1] + 2], SR = [sh[0] + 13, sh[1] + 2];
    blob(ctx, () => {
      ctx.moveTo(L[0], L[1]); ctx.lineTo(R[0], R[1]);
      ctx.quadraticCurveTo(R[0] + 3, (R[1] + SR[1]) / 2, SR[0], SR[1]);
      ctx.quadraticCurveTo(sh[0], sh[1] - 4, SL[0], SL[1]);
      ctx.quadraticCurveTo(L[0] - 4, (L[1] + SL[1]) / 2, L[0], L[1]);
    }, C.shirt, 2.2);
    ctx.save(); ctx.clip();
    // Light from the front: a lighter band down the front of the shirt.
    ctx.fillStyle = C.shirtLight; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.moveTo(SR[0] - 6, SR[1]); ctx.lineTo(R[0] - 3, R[1]); ctx.lineTo(R[0] + 4, R[1]); ctx.lineTo(SR[0] + 2, SR[1]); ctx.fill();
    ctx.globalAlpha = 1;
    const sy = hip[1] - 15;
    ctx.fillStyle = C.stripe; ctx.fillRect(hip[0] - 20, sy - 2.5, 44, 5);
    ctx.restore();
    // Collar
    ctx.strokeStyle = C.collar; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(neck[0] - 5, neck[1] + 4); ctx.quadraticCurveTo(neck[0] + 1, neck[1] + 10, neck[0] + 7, neck[1] + 4); ctx.stroke();

    if (!C.skirt) {
      blob(ctx, () => {
        ctx.moveTo(hip[0] - 13, hip[1] - 4); ctx.lineTo(hip[0] + 13, hip[1] - 4);
        ctx.quadraticCurveTo(hip[0] + 16, hip[1] + 4, hip[0] + 12, hip[1] + 9);
        ctx.lineTo(hip[0] - 12, hip[1] + 9); ctx.quadraticCurveTo(hip[0] - 16, hip[1] + 4, hip[0] - 13, hip[1] - 4);
      }, C.shorts, 2);
    }

    leg(ctx, C, hip, phase, true, pose);

    if (C.skirt) {
      // A skirt that flares as she runs, with two pleats.
      const flare = run ? 4 + Math.abs(Math.sin(phase)) * 5 : 10;
      blob(ctx, () => {
        ctx.moveTo(hip[0] - 13, hip[1] - 6); ctx.lineTo(hip[0] + 13, hip[1] - 6);
        ctx.lineTo(hip[0] + 16 + flare, hip[1] + 19);
        ctx.quadraticCurveTo(hip[0], hip[1] + 25, hip[0] - 16 - flare, hip[1] + 19);
      }, C.shorts, 2);
      ctx.strokeStyle = C.shortsFar; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(hip[0] - 3, hip[1] - 4); ctx.lineTo(hip[0] - 6 - flare * .3, hip[1] + 20);
      ctx.moveTo(hip[0] + 6, hip[1] - 4); ctx.lineTo(hip[0] + 9 + flare * .4, hip[1] + 19); ctx.stroke();
      ctx.fillStyle = C.shortsLight; ctx.globalAlpha = .6;
      ctx.beginPath(); ctx.moveTo(hip[0] + 7, hip[1] - 5); ctx.lineTo(hip[0] + 12, hip[1] - 5); ctx.lineTo(hip[0] + 15 + flare, hip[1] + 18); ctx.lineTo(hip[0] + 10 + flare * .5, hip[1] + 19); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Neck and head, tilted a little with the run.
    seg(ctx, [neck, [hx - 3, hy + 12]], 8, C.skinShade, 1.6);
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(rad(headTilt)); ctx.translate(-hx, -hy);
    // Face
    blob(ctx, () => { ctx.ellipse(hx, hy, 17.5, 17, 0, 0, Math.PI * 2); }, C.skin, 2.2);
    // Ear, at the side of the head
    ctx.fillStyle = C.skinShade; ctx.beginPath(); ctx.ellipse(hx - 6, hy + 3, 3.4, 4.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(hx - 6, hy + 3, 3.4, rad(100), rad(300)); ctx.stroke();
    // Hair
    if (C.ponytail) {
      blob(ctx, () => {
        ctx.moveTo(hx - 17, hy + 6);
        ctx.bezierCurveTo(hx - 20, hy - 14, hx - 4, hy - 23, hx + 8, hy - 18);
        ctx.bezierCurveTo(hx + 17, hy - 14, hx + 19, hy - 6, hx + 16, hy - 2);
        ctx.quadraticCurveTo(hx + 10, hy - 9, hx + 3, hy - 9);     // fringe over the forehead
        ctx.quadraticCurveTo(hx - 4, hy - 8, hx - 8, hy - 3);
        ctx.quadraticCurveTo(hx - 11, hy + 1, hx - 12, hy + 7);
      }, C.hair, 2);
    } else {
      blob(ctx, () => {
        ctx.moveTo(hx - 17, hy + 5);
        ctx.bezierCurveTo(hx - 21, hy - 15, hx - 2, hy - 24, hx + 10, hy - 18);
        ctx.lineTo(hx + 7, hy - 21); ctx.lineTo(hx + 14, hy - 15); ctx.lineTo(hx + 13, hy - 19); ctx.lineTo(hx + 18, hy - 9);  // tufts
        ctx.quadraticCurveTo(hx + 11, hy - 9, hx + 6, hy - 6);
        ctx.lineTo(hx + 4, hy - 10); ctx.quadraticCurveTo(hx - 3, hy - 6, hx - 7, hy - 4);
        ctx.quadraticCurveTo(hx - 11, hy, hx - 12, hy + 6);
      }, C.hair, 2);
    }
    // A shine on the hair
    ctx.strokeStyle = C.hairShine; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(hx - 2, hy - 4, 13, rad(205), rad(250)); ctx.stroke();
    // Eye: blinks now and then when live.
    const blink = opts.live && (Date.now() % 3800) < 130;
    if (blink) { ctx.strokeStyle = C.eye; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hx + 7, hy + 1); ctx.lineTo(hx + 12, hy + 1); ctx.stroke(); }
    else {
      ctx.fillStyle = C.eye; ctx.beginPath(); ctx.ellipse(hx + 9.5, hy + 0.5, 2.6, 3.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + 10.4, hy - 0.8, 1, 0, Math.PI * 2); ctx.fill();
    }
    // Brow
    ctx.strokeStyle = C.hair; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(hx + 6, hy - 5); ctx.quadraticCurveTo(hx + 9.5, hy - 7, hx + 13, hy - 5.5); ctx.stroke();
    // Nose
    ctx.strokeStyle = C.skinShade; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hx + 16.5, hy + 2); ctx.quadraticCurveTo(hx + 18.5, hy + 5, hx + 15.5, hy + 6); ctx.stroke();
    // Cheek
    ctx.fillStyle = C.cheek; ctx.beginPath(); ctx.ellipse(hx + 7, hy + 8, 4, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    // Mouth: an open smile while running or jumping, a gentle one standing or bowing.
    if (pose === 'stand' || bowing) {
      ctx.strokeStyle = C.mouth; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx + 8.5, hy + 10); ctx.quadraticCurveTo(hx + 12, hy + 12.5, hx + 15, hy + 9.5); ctx.stroke();
      ctx.restore();
      arm(ctx, C, sh, phase, true, pose, lean);
      ctx.restore();
      return;
    }
    blob(ctx, () => {
      ctx.moveTo(hx + 8, hy + 9.5); ctx.quadraticCurveTo(hx + 12.5, hy + 10.5, hx + 15.5, hy + 9);
      ctx.quadraticCurveTo(hx + 14, hy + 15, hx + 10, hy + 13.5);
    }, C.mouth, 1.2);
    ctx.fillStyle = '#e8737a'; ctx.beginPath(); ctx.ellipse(hx + 11.5, hy + 12.6, 2.2, 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    arm(ctx, C, sh, phase, true, pose, lean);
    ctx.restore();
  }

  // ---------- facing the viewer, and bowing toward them ----------
  // A bow toward the viewer: the body folds forward, so the chest looks shorter, the head
  // comes down and forward, and the top of the head shows. The eyes close in the bow.
  function drawFront(ctx, C, opts = {}) {
    const k = Math.max(0, Math.min(1, opts.bow ?? 0)), cx = 60;
    const hipY = 101, shY = 70 + 20 * k, headY = 44 + 32 * k, headR = 17 + 1.5 * k;
    const skin = C.skin;
    // Legs and shoes
    for (const e of [-1, 1]) {
      seg(ctx, [[cx + e * 6, hipY], [cx + e * 7, 146]], 10, skin, 1.8);
      seg(ctx, [[cx + e * 7, 139], [cx + e * 7, 145]], 10.5, C.sock, 1.6);
      blob(ctx, () => { ctx.ellipse(cx + e * 8, 149, 8, 5, 0, Math.PI, 0); ctx.lineTo(cx + e * 8 + 8, 152); ctx.lineTo(cx + e * 8 - 8, 152); }, C.shoe, 1.8);
      ctx.fillStyle = C.sole; ctx.fillRect(cx + e * 8 - 8, 150.5, 16, 3);
      ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.strokeRect(cx + e * 8 - 8, 150.5, 16, 3);
    }

// On or off as the other Hnahsin games have it (hnahsin-audio), so one switch serves them all.
const SFX = (() => {
  let ctx = null;
  const on = () => { try { return JSON.parse(localStorage.getItem('hnahsin-audio') || '{}').enabled ?? true; } catch { return true; } };
  const set = v => { try { const s = JSON.parse(localStorage.getItem('hnahsin-audio') || '{}'); s.enabled = v; localStorage.setItem('hnahsin-audio', JSON.stringify(s)); } catch {} };
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (f, d, { type = 'sine', vol = .12, to = 0, at = 0 } = {}) => {
    if (!on()) return; const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
  };
  const thud = (d, vol) => {
    if (!on()) return; const c = ac(); if (!c) return;
    const b = c.createBuffer(1, Math.ceil(c.sampleRate * d), c.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / x.length) ** 2;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  };
  return {
    on, set, unlock: () => ac(),
    jump: () => tone(420, .12, { type: 'square', vol: .045, to: 700 }),
    jump2: () => tone(620, .1, { type: 'square', vol: .045, to: 1050 }),
    coin: () => { tone(1320, .07, { vol: .07 }); tone(1980, .12, { vol: .06, at: .06 }); },

    boss: () => [880, 1175, 1480].forEach((f, i) => tone(f, .28, { vol: .05, at: i * .09 })),
    finish: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .55 : .16, { type: 'triangle', vol: .12, at: i * .12 })),
    lose: () => [392, 330, 262].forEach((f, i) => tone(f, .3, { type: 'triangle', vol: .1, at: i * .17 })),
    combo: n => tone(880 * Math.pow(1.06, Math.min(n, 12)), .1, { type: 'square', vol: .035 }),
    click: () => tone(900, .04, { vol: .05 }),
    buy: () => [1320, 1760, 2093].forEach((f, i) => tone(f, .1, { vol: .07, at: i * .06 })),
  };
})();

// SHEET_PX pixels a box unit. Sixteen of the run, then going up, at the top and coming down, then the cheer
// and the stumble. Fetched now, so it is ready when a level starts; if it cannot be had, rova.js draws him.
const SHEET_URL = 'pics/rova-sheet.webp?v=08a54d4b', SHEET_PX = 3.2, SHEET_COLS = 5, SHEET_RUN = 16, SHEET_N = 21, CHEER = 19, STUMBLE = 20;
const rovaSheet = new Image();
rovaSheet.src = SHEET_URL;
// Draw at the phone's real pixels, not 720 × 1280 stretched: the canvas is made
// RES times bigger and the camera zooms by RES, so the game keeps its 720 × 1280 world.
// Tall phones get more sky above and ground below, so the game fills the screen.
const GH = Math.round(Math.min(1700, Math.max(1280, 720 * innerHeight / innerWidth)));
// Wider, shorter screens (a phone browser with its toolbars, a laptop) see more road
// sideways instead of dark bars: the world is still 1280 tall.
const GW = Math.round(Math.min(1280, Math.max(720, GH * innerWidth / innerHeight)));
const RES = (() => {
  const css = Math.min(innerWidth, innerHeight * GW / GH);
  return Math.min(3, Math.max(1, Math.round(css * (devicePixelRatio || 1) / GW * 4) / 4));
})();
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Text is drawn into its own image; give it the same sharpness.
const addText = Phaser.GameObjects.GameObjectFactory.prototype.text;
Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, text, style) {
  return addText.call(this, x, y, text, Object.assign({ resolution: RES }, style));
};
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ṭ/g, 't');
const senses = g => new Set(String(g || '').toLowerCase().replace(/\(.*?\)/g, ' ').split(/[;,/]|\bor\b/).map(s => s.trim().replace(/^to /, '')).filter(Boolean));
// a dictionary word's other Mizo senses, folded (one string, or the list of them)
const others7 = w => fold(Array.isArray(w[7]) ? w[7].join(' ') : String(w[7] || ''));

// A word where it stands as a whole word, and how many times it does in a sentence.
const wordRe = word => new RegExp('(^|[^\\p{L}])(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=$|[^\\p{L}])', 'giu');
const times = (s, word) => (String(s || '').match(wordRe(word)) || []).length;

// The example with the word left out. Only a word that is there once: one that is there
// twice would still show the answer (and “In in” may leave out the wrong one of the two).
function blank(example, word) {
  if (times(example, word) !== 1) return null;
  return example.replace(wordRe(word), (m, a) => a + '____');
}

// A word's picture: emoji (Twemoji), SVG (asset library), or category placeholder.
// Fallback chain: emoji → SVG → category placeholder
const isSvg = s => s && s.startsWith('public/assets/vocabulary/') && s.endsWith('.svg');
const isEmoji = s => s && !s.endsWith('.jpg') && !s.startsWith('public/');
const isJpg = s => s && s.endsWith('.jpg');
// a word with a picture that can be the question by itself: its Noto picture (w[8]), or one emoji
const isPic = w => !!w[8] || (isEmoji(w[5]) && [...w[5]].length <= 4);
// the same picture: two words that show it cannot both be at a picture door
const samePic = (a, b) => (!!a[8] && a[8] === b[8]) || (!!a[5] && a[5] === b[5]);

// Get category placeholder SVG path
const categoryPlaceholder = topic => {
  const map = {
    'thiltih': 'actions', 'nunphung': 'abstract', 'sikul': 'abstract', 'khawvel': 'nature',
    'nungcha': 'nature', 'chhungkua': 'household', 'dict-noun': 'abstract', 'dict-verb': 'actions',
    'dict-adj': 'abstract', 'dict-adv': 'abstract', 'emotions': 'emotions', 'occupations': 'occupations',
    'food': 'food', 'clothing': 'clothing', 'body-parts': 'body-parts', 'transportation': 'transportation',
    'technology': 'technology', 'sports': 'sports', 'fruits': 'fruits', 'vegetables': 'vegetables'
  };
  const cat = map[topic] || 'abstract';
  return `public/assets/vocabulary/${cat}/placeholder.svg`;
};

// emo() returns emoji if present, otherwise empty string (for text-only display)
const emo = w => isEmoji(w[5]) ? w[5] + ' ' : '';

// pic() returns the best available image: SVG > emoji > category placeholder
const pic = w => {
  // the word's Noto picture (as an emoji shows nowhere the same, and not at all on an older phone); its emoji if it cannot be fetched
  if (w[8]) return `<img class="photo noto" src="${w[8]}" alt="${w[5] || ''}" onerror="this.replaceWith(this.alt)">`;
  if (isSvg(w[5])) return `<img class="photo" src="${w[5]}" alt="${w[0]}">`;
  if (isEmoji(w[5])) return w[5] + ' ';
  if (isJpg(w[5])) return `<img class="photo" src="${w[5]}" alt="${w[0]}">`;
  // Fallback to category placeholder SVG
  return `<img class="photo" src="${categoryPlaceholder(w[4])}" alt="${w[0]}">`;
};

const asks = w => w[4] === 'dict-verb' ? 'to ' + w[1] : w[1];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------------------------------------------------------------- the doors' questions
// The words a place draws from: its band of word levels (or the dictionary's), and its topics if it has them.
function poolOf(cfg) {
  if (cfg.pool) return cfg.pool;
  const [lo, hi] = cfg.band, words = cfg.dict ? DICT : WORDS;
  return (cfg.pool = words.filter(w => w[3] >= lo && w[3] <= hi && w[0].length <= 16 && (!cfg.topics || cfg.topics.includes(w[4]))));
}
// What a door shows for a word: the Mizo word, or for “what does it mean?” its English
const doorText = (w, kind) => (kind === 'mz2en' ? asks(w) : w[0]);
const SHORT = 22;     // an English meaning short enough for a door

// Two wrong doors that do not look the same as each other (a few words are in the list twice).
const pair = (others, kind) => {
  const key = w => fold(doorText(w, kind));
  const second = others.find(w => key(w) !== key(others[0]));
  return second ? [others[0], second] : null;
};

// A question of the kind asked: the word to find and two others of its topic that mean something else and
// look different. Kinds: en2mz (which Mizo word means this?), mz2en (what does this Mizo word mean?), pic
// (which word is this picture?), gap (which word fills the gap in its example?). `used` holds the run's words
// so far (folded), so none comes twice; `forced` asks about that word (one to practise again).
function question(cfg, kind, used = new Set(), forced = null) {
  if (!forced && kind === 'count') return countQuestion(cfg, used) || question(cfg, 'en2mz', used);
  if (!forced && kind === 'odd') return oddQuestion(cfg, used) || question(cfg, 'en2mz', used);
  const words = cfg.dict ? DICT : WORDS, pool = poolOf(cfg);
  if (!pool.length) return null;
  const fallback = () => (kind === 'en2mz' ? null : question(cfg, 'en2mz', used, forced));
  for (let tries = 0; tries < (forced ? 1 : 200); tries++) {
    const target = forced || pick(pool);
    if (!forced && used.has(fold(target[0]))) continue;
    if (kind === 'pic' && !isPic(target)) { if (forced) return fallback(); continue; }
    if (kind === 'mz2en' && asks(target).length > SHORT) { if (forced) return fallback(); continue; }
    const gap = kind === 'gap' ? blank(target[2], target[0]) : null;
    if (kind === 'gap' && !gap) { if (forced) return fallback(); continue; }
    const mine = senses(target[6]), mean = fold(asks(target));
    const others = shuffle(words.filter(w => w !== target && w[4] === target[4] && w[0].length <= 16 &&
      fold(w[0]) !== fold(target[0]) && ![...senses(w[6])].some(s => mine.has(s)) &&
      !(gap && times(target[2], w[0])) &&
      !(kind === 'mz2en' && (asks(w).length > SHORT || fold(asks(w)) === mean)) &&
      !(kind === 'pic' && samePic(w, target)) &&
      // A dictionary word's other Mizo senses must not be a wrong door.
      !(cfg.dict && (others7(target).includes(fold(w[0])) || others7(w).includes(fold(target[0]))))));
    const two = others.length >= 2 && pair(others, kind);
    if (!two) { if (forced) return fallback(); continue; }
    return { target, options: shuffle([target, ...two]), gap, kind };
  }
  // Nothing found that the run has not had yet: a word may come again.
  if (!forced && used.size) return question(cfg, kind);
  return kind === 'en2mz' ? null : question(cfg, 'en2mz', used, forced);
}

// Counting in Mizo: so many things shown, and which number is it? (one to nine; to six at the first places)
const NUMBERS = ['pakhat', 'pahnih', 'pathum', 'pali', 'panga', 'paruk', 'pasarih', 'pariat', 'pakua'];
const NUM_EN = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
const THINGS = ['🍊', '🍌', '🐔', '🐟', '⚽', '🌸', '🥚', '🍎', '🐐', '🌽', '🎈', '⭐'];
function countQuestion(cfg, used) {
  const top = cfg.band[1] <= 2 ? 6 : 9, n = 1 + Math.floor(rand() * top);
  const entry = k => BY_FOLD.get(NUMBERS[k - 1]) || [NUMBERS[k - 1], NUM_EN[k - 1], '', 1, 'number', '', NUM_EN[k - 1], ''];
  const near = shuffle([n - 2, n - 1, n + 1, n + 2].filter(k => k >= 1 && k <= 9)).slice(0, 2);
  if (near.length < 2 || used.has(NUMBERS[n - 1])) return null;
  const thing = pick(THINGS);
  return { target: entry(n), options: shuffle([entry(n), ...near.map(entry)]), kind: 'count', things: Array.from({ length: n }, () => thing) };
}
// The odd one out, among animals: two animals and one thing that is not (which one is not an animal?), or two
// things and one animal (which one is an animal?). Only the animals (nungcha) are a topic clean enough to ask.
const ANIMAL_RE = /\b(dog|cat|cow|pig|hen|bird|goat|fish|horse|animal|chicken|duck|rat|mouse|monkey|tiger|snake|bee|ant|buffalo|sheep|elephant|deer|bear|frog|insect|fly|worm|calf|puppy)s?\b/i;
function oddQuestion(cfg, used) {
  const [lo, hi] = cfg.band, ok = w => w[3] >= lo && w[3] <= hi && w[0].length <= 16 && !used.has(fold(w[0]));
  // (the animals' topic also has a few words that are not one animal: a nest, a horn, milk, a sock, an ogress…)
  const animals = WORDS.filter(w => w[4] === 'nungcha' && ok(w) && !/milk|nest|ogress|horn|sock|\broc\b|creature|animal|meat|hide|sand/i.test(w[1])), things = WORDS.filter(w => w[4] === 'chhungkua' && ok(w) && !ANIMAL_RE.test(w[6] || w[1]) && (isPic(w) || (w[1].split(/\s+/).length <= 2 && w[1].length <= 14)));     // (things you can see)
  const some = (list, n) => { const out = []; for (const w of shuffle(list.slice())) if (out.length < n && !out.some(o => fold(o[0]) === fold(w[0]))) out.push(w); return out; };
  const not = rand() < .6;     // (more often: which one is not?)
  const many = some(not ? animals : things, 2), one = some(not ? things : animals, 1)[0];
  if (many.length < 2 || !one) return null;
  return { target: one, options: shuffle([one, ...many]), kind: not ? 'odd-not' : 'odd-is' };
}

// A boss door from the content's sentences: one of its words, from this band, left out.
function fromSentence(cfg, used) {
  const [lo, hi] = cfg.band;
  const byWord = new Map(WORDS.filter(w => w[3] >= lo && w[3] <= hi && !w[0].includes(' ')).map(w => [fold(w[0]), w]));
  for (const [mizo, english] of shuffle(SENTENCES.slice())) {
    // Only a word whose English meaning is in the sentence's English: “in” is house, but also drink.
    const eng = ' ' + english.toLowerCase().replace(/[^a-z' ]+/g, ' ') + ' ';
    const means = w => [...senses(w[6])].some(s => s.length > 2 && eng.includes(' ' + s.replace(/[^a-z' ]+/g, ' ').trim() + ' '));
    const hits = mizo.split(/\s+/).map(t => byWord.get(fold(t.replace(/[^\p{L}]/gu, '')))).filter(w => w && means(w) && !used.has(fold(w[0])));
    if (!hits.length) continue;
    const target = pick(hits);
    const gap = blank(mizo, target[0]);
    if (!gap) continue;
    const mine = senses(target[6]);
    const others = shuffle(WORDS.filter(w => w !== target && w[4] === target[4] && w[0].length <= 16 && !w[0].includes(' ') &&
      fold(w[0]) !== fold(target[0]) && ![...senses(w[6])].some(s => mine.has(s)) && !times(mizo, w[0])));
    const two = others.length >= 2 && pair(others, 'gap');
    if (!two) continue;
    return { target, options: shuffle([target, ...two]), gap, english, kind: 'gap' };
  }
  return null;
}

// A boss door for the dictionary places and home: what a saying means.
function saying() {
  const [text, meaning, wrong] = pick(SAYINGS);
  const target = [meaning, text];
  return { target, options: shuffle([target, ...shuffle(wrong.slice()).slice(0, 2).map(m => [m, text])]), saying: text, kind: 'saying' };
}

function bossQuestion(cfg, used) {
  if (cfg.dict || cfg.sayings) return saying();
  return (rand() < .6 && fromSentence(cfg, used)) || question(cfg, 'gap', used) || question(cfg, 'en2mz', used);
}

// ---------------------------------------------------------------- spelling on the run: a word in Mizo letters
// Mizo's letters (aw, ch, ng and ṭ are letters of their own); a word to spell has three to five of them.
const LETTER_RE = /aw|ch|ng|ṭ|[a-zâêîôû]/gi;
const ALPHABET = ['a', 'aw', 'b', 'ch', 'd', 'e', 'f', 'g', 'ng', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'r', 's', 't', 'ṭ', 'u', 'v', 'z'];
const lettersOf = s => String(s).toLowerCase().match(LETTER_RE) || [];
const spellable = w => { const l = lettersOf(w[0]); return l.join('') === w[0].toLowerCase() && l.length >= 3 && l.length <= 5; };

// ---------------------------------------------------------------- the sentence bridge
// The last doors of a place build a sentence, a word a door, in order: its English is the question, the words
// so far show, and each door offers the next word, another word of the sentence (the order is the test) and a
// word from elsewhere.
const wordsOf = s => s.split(/\s+/).map(t => t.replace(/[^\p{L}'’]/gu, '')).filter(Boolean);
function bridge(cfg, used) {
  const [lo, hi] = cfg.band, words = WORDS.filter(w => w[3] >= lo && w[3] <= hi && !w[0].includes(' ') && w[0].length <= 12);
  for (const [mizo, english] of shuffle(SENTENCES.slice())) {
    const ws = wordsOf(mizo);
    if (ws.length < 3 || ws.length > 6 || english.length > 70 || ws.some(t => t.length > 14)) continue;
    const n = Math.min(4, ws.length), prefix = ws.slice(0, ws.length - n), steps = ws.slice(ws.length - n);
    const B = { english, prefix, steps, built: [], ok: true }, out = [];
    for (let k = 0; k < n; k++) {
      const right = steps[k], seen = new Set([fold(right)]), wrong = [];
      for (const t of shuffle([...steps.slice(k + 1), ...prefix])) if (wrong.length < 1 && !seen.has(fold(t))) { seen.add(fold(t)); wrong.push(t); }
      for (let tries = 0; wrong.length < 2 && tries < 60; tries++) { const t = pick(words)[0]; if (!seen.has(fold(t)) && !ws.some(x => fold(x) === fold(t))) { seen.add(fold(t)); wrong.push(t); } }
      if (wrong.length < 2) break;
      const target = [right, english];
      out.push({ kind: 'bridge', bridge: B, step: k, target, options: shuffle([target, ...wrong.map(t => [t, ''])]), boss: true });
    }
    if (out.length === n) return out;
  }
  return null;
}

// ---------------------------------------------------------------- the word book, and each place's goals
// Every word met at a door: [times right, times wrong, the place first met (-1: the daily run, endless), spelled]
const BY_FOLD = (() => { const m = new Map(); for (const w of [...WORDS, ...DICT]) if (!m.has(fold(w[0]))) m.set(fold(w[0]), w); return m; })();
const book = {
  all: () => store.get('rj.album', {}),
  entry(a, w, place) { const f = fold(w[0]); return (a[f] ||= [0, 0, place, 0]); },
  met(w, right, place) { const a = this.all(), e = this.entry(a, w, place); e[right ? 0 : 1]++; if (e[2] < 0 && place >= 0) e[2] = place; store.set('rj.album', a); },
  spelled(w, place) { const a = this.all(), e = this.entry(a, w, place); e[3] = 1; store.set('rj.album', a); },
};
// how well a word is known: met, right twice, right four times and more
const mastery = e => (e[0] >= 4 ? 3 : e[0] >= 2 ? 2 : e[0] >= 1 ? 1 : 0);
const GOALS = [['✏️', 'Spell every word', 'Thumal zawng zawng ziak rawh'], ['🪙', 'Collect 30 coins', 'Pawisa 30 la khawm rawh'], ['🍃', 'No stumbles', 'Tlu lovin']];
const goalsOf = level => store.get('rj.goals', {})[level] || [false, false, false];

// ---------------------------------------------------------------- words to meet again
// A word missed at a door comes back at later doors of its place (and the whole app's practice, progress.js,
// adds the words it says are due again) until it is got right.
const BY_ID = new Map(WORDS.map(w => [w[7], w]));
const review = {
  all: () => store.get('rj.review', {}),
  miss(w) { const r = this.all(); r[fold(w[0])] = (r[fold(w[0])] || 0) + 1; store.set('rj.review', r); },
  hit(w) { const r = this.all(); if (fold(w[0]) in r) { delete r[fold(w[0])]; store.set('rj.review', r); } },
  targets(cfg, n) {
    const pool = poolOf(cfg), r = this.all(), byFold = new Map(pool.map(w => [fold(w[0]), w]));
    const out = Object.keys(r).map(f => byFold.get(f)).filter(Boolean);
    try {
      if (window.Progress && Progress._state && !cfg.dict) for (const d of Progress.getDueWords(40)) {
        const w = BY_ID.get(d.vocab_id);
        if (w && byFold.get(fold(w[0])) === w && !out.includes(w)) out.push(w);
      }
    } catch {}
    return shuffle(out).slice(0, n);
  },
};
// the progress.js id of a word met at a door (a Hnahsin word has its own; a dictionary word by its spelling)
const vocabId = w => (typeof w[7] === 'string' && /^[0-9a-f-]{36}$/.test(w[7]) ? w[7] : WORDS_MAP[fold(w[0])] || WORDS_MAP[w[0].toLowerCase()] || null);

// ---------------------------------------------------------------- the game fits the player
// A skill from -1 (finding it hard) to 1 (finding it easy), kept between runs: right doors raise it, wrong ones
// lower it more. It sets the pace (a tenth either way), how early a door's question shows, and which kinds of
// door come next (more pictures and counting when it is hard; more gaps and meanings when it is easy). The daily
// run is the same for everyone, so it leaves the daily run alone.
function fitMix(mix, skill) {
  const m = { ...mix }, k = (key, f) => { if (m[key]) m[key] *= f; };
  if (skill < -.25) { k('pic', 2); k('count', 1.5); k('en2mz', 1.3); k('gap', .4); k('mz2en', .6); k('odd', .5); }
  if (skill > .25) { k('gap', 1.6); k('mz2en', 1.4); k('odd', 1.4); k('pic', .6); k('count', .6); }
  return m;
}

};
const HELP = {
  heart: { price: 60, icon: '❤️', en: 'Extra heart', mz: 'Nunna belh', note: ['Start with four hearts', 'Nunna pali nen tan rawh'] },
  hint: { price: 50, icon: '💡', en: 'Hint', mz: 'Kaihhruaina', note: ['One wrong door fades at the first three doors', 'Kawngkhar thum hmasa-ah kawngkhar dik lo pakhat a dim ang'] },
  slow: { price: 40, icon: '🐢', en: 'Easy pace', mz: 'Muang zawk', note: ['Rova runs a little slower', 'Rova a tlan muang deuh ang'] },
};
const wallet = { get: () => store.get('rj.coins', 0), add(n) { store.set('rj.coins', Math.max(0, this.get() + n)); } };
const worn = () => store.get('rj.worn', {});
const owned = () => store.get('rj.owned', []);
// draw what Rova wears on a canvas, at frame f, with ctx in his box's units
function drawLooks(ctx, f, ids = Object.values(worn())) {
  const A = ANCHORS[f] || ANCHORS[0];
  for (const id of ids) {
    const it = LOOKS[id]; if (!it) continue;
    const [x, y] = A[it.at];
    ctx.save(); ctx.translate(x, y); ctx.rotate(A.tip * Math.PI / 180);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
    it.draw(ctx); ctx.restore();
  }
}

// ---------------------------------------------------------------- the game
class Play extends Phaser.Scene {
  constructor() { super('play'); }
  // data: { mode: level | daily | endless | practice, level, look (the place to look like), cfg (its words), words (to practise) }
  init(data) { this.data0 = data; this.mode = data.mode || 'level'; this.level = data.level ?? 0; }

  preload() {
    if (!this.textures.exists('rova3d') && !this.textures.exists('rova-sheet')) this.load.image('rova-sheet', SHEET_URL);
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xffffff); g.fillCircle(8, 8, 8); g.generateTexture('spark', 16, 16); g.clear();
    g.fillStyle(0xffc94a); g.fillCircle(22, 22, 22); g.fillStyle(0xffe08a); g.fillCircle(16, 16, 9);
    g.lineStyle(4, 0xf2a516); g.strokeCircle(22, 22, 20); g.generateTexture('coin', 44, 44); g.clear();
    g.fillStyle(0xffffff); g.fillCircle(41, 41, 39); g.lineStyle(7, 0x7a4bc2); g.strokeCircle(41, 41, 35); g.generateTexture('letter', 82, 82); g.clear();
    g.fillStyle(0xdff3ff, .85); g.fillCircle(48, 48, 46); g.lineStyle(6, 0x8fd3ff); g.strokeCircle(48, 48, 43); g.fillStyle(0xffffff, .8); g.fillCircle(31, 29, 10); g.generateTexture('power', 96, 96); g.clear();
    g.lineStyle(7, 0x8fd3ff, .9); g.strokeCircle(80, 80, 74); g.lineStyle(3, 0xffffff, .7); g.strokeCircle(80, 80, 66); g.generateTexture('shield', 160, 160); g.clear();
  }

  create() {
    const D = this.data0, look = D.look || LEVELS[this.level], cfg = this.cfg = D.cfg || LEVELS[this.level];
    const W = GW, H = 1280, extra = GH - H;
    this.look = look;
    this.groundY = 1100;
    this.relaxed = this.mode === 'practice' || store.get('rj.relaxed', false);
    // The daily run's doors and coins come from the day: the same for everyone.
    rand = D.seed ? seeded(D.seed) : Math.random;
    // The doors of the run: GATES doors and a boss, or the words to practise, or (endless) doors made as Rova goes.
    this.plan = [];
    const used = new Set();
    if (this.mode === 'practice') for (const w of D.words) this.plan.push(question(cfg, isPic(w) ? 'pic' : 'en2mz', used, w) || question(cfg, 'en2mz', used));
    else if (this.mode !== 'endless') {
      const again = this.mode === 'level' ? review.targets(cfg, 3) : [];
      // a word place ends on the sentence bridge (in place of its last door and the boss); the dictionary places
      // and home on a saying
      const span = !cfg.dict && !cfg.sayings ? bridge(cfg, used) : null;
      const doors = span ? GATES - 1 : GATES;
      // new words taught before the run come at their own doors (✨); in a place, a door's question is made as it
      // comes near, to fit how the player is doing then (the daily run's are all made now, from the day)
      const fresh = this.mode === 'level' ? (D.fresh || []) : [];
      const special = [...again.map(w => ({ w, review: true })), ...fresh.map(w => ({ w, fresh: true }))].slice(0, doors);
      const at = shuffle([...Array(doors).keys()]).slice(0, special.length);
      for (const sp of special) used.add(fold(sp.w[0]));
      for (let i = 0; i < doors; i++) {
        const sp = special[at.indexOf(i)];
        if (this.mode === 'level') { this.plan.push({ lazy: true, ...(sp || {}) }); continue; }
        const q = sp ? question(cfg, weighted(cfg.mix), used, sp.w) : question(cfg, weighted(cfg.mix), used);
        if (sp && q) q.review = true;
        this.plan.push(q);
        used.add(fold(q.target[0]));
      }
      if (span) this.plan.push(...span);
      else this.plan.push(Object.assign(bossQuestion(cfg, used), { boss: true }));
    }
    this.plan = this.plan.filter(Boolean);
    this.skill = this.mode === 'daily' ? 0 : store.get('rj.skill', 0);
    this.used = used;
    const n = this.mode === 'endless' ? 400 : this.plan.length;
    // The flag stands 700 past the last door; the road goes on a little after it.
    this.length = 1500 + n * GAP + 700 + 800;
    this.cameras.main.setOrigin(0, 0).setZoom(RES);
    this.cameras.main.scrollY = -extra; // the world's 1280 sits at the screen's bottom
    this.physics.world.setBounds(0, 0, this.length, H);

    // Sky, far hills and near hills: three layers moving at their own pace.
    // Sky, hills and city are painted once into pictures; redrawing them every
    // frame halved the frame rate on phones.
    const hex = n => '#' + n.toString(16).padStart(6, '0'), skyKey = 'sky' + look.sky.join('-');
    this.paint(skyKey, 4, GH, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, hex(look.sky[0])); g.addColorStop(1, hex(look.sky[1]));
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    });
    this.add.image(0, 0, skyKey).setOrigin(0).setDisplaySize(W, GH).setScrollFactor(0);
    if (look.stars) for (let i = 0; i < 40; i++) this.add.circle(Math.random() * W, Math.random() * 500, Math.random() * 2 + 1, 0xffffff, .8).setScrollFactor(0);
    else this.add.circle(W - 160, 210, 70, look.sun).setScrollFactor(0);
    this.far = this.makeHills(look.far, 0.15, 760, look.farH || 140);
    this.near = this.makeHills(look.hills[0], 0.4, 900, 110);
    if (look.city) this.makeCity();
    if (look.scene) this.makeScene(look);
    if (look.weather && !STILL) this.makeWeather(look.weather, W);

    // The ground: grass on earth, the whole way.
    const ground = this.add.rectangle(this.length / 2, this.groundY + (180 + extra) / 2, this.length, 180 + extra, look.hills[1]);
    this.add.rectangle(this.length / 2, this.groundY + 6, this.length, 14, 0x8bd16a);
    this.physics.add.existing(ground, true);

    // Rova: frames at the screen's sharpness (u pixels a unit of his 120 × 160 box), shown 1.25 times
    // the box. His body stays 50 × 112 in the world, with its foot at his feet (156 of 160 down the frame).
    const u = this.makeRova();
    this.rovaScale = 1.25 / u;
    const bw = 50 / this.rovaScale, bh = 112 / this.rovaScale, fw = 120 * u;
    this.rova = this.add.sprite(180, this.groundY - 100, this.rovaKey, 0).setScale(this.rovaScale).setDepth(5); // in front of the doors
    this.physics.add.existing(this.rova);
    this.rova.body.setSize(bw, bh, false).setOffset((fw - bw) / 2, 156 * u - bh).setGravityY(2400).setCollideWorldBounds(true);
    this.physics.add.collider(this.rova, ground, () => { if (this.air) this.land(); });
    this.jumps = 0; this.air = false; this.onGround = false;
    this.makeLooks();

    this.follow();

    // Effects.
    this.sparks = this.add.particles(0, 0, 'spark', { speed: { min: 140, max: 420 }, lifespan: 600, scale: { start: .9, end: 0 }, gravityY: 600, tint: [0xffc94a, 0xffffff, 0x8fd3ff, 0x6dbe5e], emitting: false });
    this.dust = this.add.particles(0, 0, 'spark', { speedX: { min: -160, max: -40 }, speedY: { min: -120, max: -20 }, lifespan: 380, scale: { start: .6, end: 0 }, tint: 0xd8c9a8, emitting: false });
    // the glow of a streak of right doors, trailing Rova
    this.glow = this.add.particles(0, 0, 'spark', { speedX: { min: -220, max: -120 }, speedY: { min: -40, max: 40 }, lifespan: 420, scale: { start: .7, end: 0 }, alpha: { start: .9, end: 0 }, tint: [0xffc94a, 0xffe08a, 0xffffff], frequency: 40, emitting: false }).setDepth(4);
    this.glow.startFollow(this.rova, 0, 10);

    // Gates and coins; and on the road between them (not when practising): letters to spell a word, things to
    // jump over, and now and then a power in a bubble.
    this.gates = [];
    this.coins = this.physics.add.group({ allowGravity: false, immovable: true });
    this.extras = this.mode !== 'practice';
    this.letters = this.physics.add.group({ allowGravity: false, immovable: true });
    this.rocks = this.physics.add.group({ allowGravity: false, immovable: true });
    this.powers = this.physics.add.group({ allowGravity: false, immovable: true });
    this.spells = []; this.spelledOk = 0; this.stumbles = 0;
    this.physics.add.overlap(this.rova, this.letters, (r, t) => this.takeLetter(t));
    this.physics.add.overlap(this.rova, this.rocks, (r, k) => this.hitRock(k));
    this.physics.add.overlap(this.rova, this.powers, (r, p) => this.takePower(p));
    if (this.mode === 'endless') { this.made = 0; while (this.gates.length < 3) this.addEndlessGate(); }
    else this.plan.forEach((q, i) => this.addGate(q, i));
    if (this.mode !== 'endless') {
      this.finishX = this.gates[this.gates.length - 1].x + 700;
      this.add.text(this.finishX, this.groundY - 160, '🏁', { fontSize: '120px' }).setOrigin(.5);
    } else this.finishX = Infinity;
    rand = Math.random;
    this.physics.add.overlap(this.rova, this.coins, (r, c) => this.coin(c));

    // The heads-up display.
    this.hearts = 3; this.coinsGot = 0; this.bonus = 0; this.right = 0; this.met = []; this.marks = []; this.streak = 0; this.bestStreak = 0; this.hints = 0;
    this.speed = look.speed * (this.relaxed ? .82 : 1);
    this.ahead = AHEAD + (this.relaxed ? 350 : 0);
    // help bought in the shop: used up by this run (not by practice)
    const ready = this.mode === 'practice' ? {} : store.get('rj.ready', {}), got = [];
    if (ready.heart) { this.hearts = 4; got.push('❤️+1'); }
    if (ready.hint) { this.hints = 3; got.push('💡'); }
    if (ready.slow) { this.speed *= .88; got.push('🐢'); }
    if (got.length) store.set('rj.ready', {});
    this.maxHearts = this.hearts;
    this.hud = this.add.text(24, 24, '', { fontFamily: 'Plus Jakarta Sans', fontSize: '34px', fontStyle: '800', color: '#ffffff', stroke: '#0d2a4a', strokeThickness: 8 }).setScrollFactor(0).setDepth(10);
    this.ask = this.add.text(W / 2, 88 + Math.max(0, extra - 120), '', { fontFamily: 'Plus Jakarta Sans', fontSize: '40px', fontStyle: '800', color: '#15213a', backgroundColor: '#ffffffee', padding: { x: 22, y: 10 }, align: 'center', wordWrap: { width: Math.min(W - 80, 760) } }).setOrigin(.5, 0).setScrollFactor(0).setDepth(10).setVisible(false);
    // a picture door's picture, big, under its question
    this.askPic = this.add.text(W / 2, 0, '', { fontSize: '92px', padding: { y: 6 } }).setOrigin(.5, 0).setScrollFactor(0).setDepth(10).setVisible(false);
    // (or the word's Noto picture, fetched when its door comes: the emoji stays if it cannot be)
    this.askImg = this.add.image(W / 2, 0, '__DEFAULT').setOrigin(.5, 0).setScrollFactor(0).setDepth(10).setVisible(false);
    this.spellHud = this.add.text(24, 84, '', { fontFamily: 'Plus Jakarta Sans', fontSize: '30px', fontStyle: '800', color: '#fff3b0', stroke: '#0d2a4a', strokeThickness: 7 }).setScrollFactor(0).setDepth(10).setVisible(false);
    this.ring = this.add.image(0, 0, 'shield').setDepth(6).setVisible(false);
    this.banner = this.add.text(W / 2, 330, '', { fontFamily: 'Plus Jakarta Sans', fontSize: '36px', fontStyle: '800', color: '#ffffff', stroke: '#0d2a4a', strokeThickness: 8, align: 'center', wordWrap: { width: 660 } }).setOrigin(.5).setScrollFactor(0).setDepth(10).setAlpha(0);
    this.updateHud();

    // Jump on tap, click, Space or Up.
    this.input.on('pointerdown', () => this.jump());
    this.input.keyboard.on('keydown-SPACE', () => this.jump());
    this.input.keyboard.on('keydown-UP', () => this.jump());
    this.started = false;
    this.time.delayedCall(500, () => (this.started = true));
    const title = this.mode === 'daily' ? `📅 ${L('Daily run', 'Ni tin tlan')}` : this.mode === 'endless' ? `♾️ ${L('Endless', 'Tawp lo')}`
      : this.mode === 'practice' ? `🔁 ${L('Practice', 'Zir nawnna')}` : `${look.emoji} ${placeName(look)}`;
    this.showBanner(title + (got.length ? `\n${got.join('  ')}` : '') + (this.relaxed && this.mode !== 'practice' ? `\n🌿 ${L('Relaxed', 'Muang takin')}` : ''), '#ffffff', 1600);
  }

  addGate(q, i) {
    const x = 1500 + i * GAP;
    this.gates.push({ x, q, boss: !!q.boss, done: false, built: false, i });
    if (q.boss) return;
    const endless = this.mode === 'endless';
    // after the second and fifth doors (endless: every sixth), a word to spell; elsewhere coins, a thing in the
    // way, and (third and seventh doors, endless every seventh) a power
    const word = this.extras && (endless ? i % 6 === 2 : i === 1 || i === 4) ? this.spellWord() : null;
    if (word) { this.placeWord(word, x + 380); return; }
    const arc = x + 520 + rand() * 200, lane = [0, 1, 2][i % 3];
    this.coinArc(arc, lane);
    if (this.extras && i % 2 === 0) this.placeSign(x + 1080);
    if (!this.extras) return;
    if (endless ? i % 7 === 3 : i === 2 || i === 6) this.placePower(arc - 170, this.lanes()[lane === 1 ? 0 : 1], pick(['magnet', 'shield', 'slow']));
    if (!this.relaxed && (endless ? i > 2 : this.mode !== 'level' || this.level > 0 || i % 2 === 1) && rand() < (this.mode === 'level' && this.level === 0 ? .5 : .8)) this.placeRock(x + 300);
  }

  // A word to spell: one of the place's words of three to five letters, not met yet this run.
  spellWord() {
    const pool = poolOf(this.mode === 'endless' ? this.endlessCfg : this.cfg).filter(w => spellable(w) && !this.used.has(fold(w[0])));
    if (!pool.length) return null;
    const w = pick(pool); this.used.add(fold(w[0]));
    return w;
  }

  // Its letters along the road, each in a bubble at one of three heights (on the ground, a jump up, a double
  // jump up), with another letter at another height beside it: Rova takes them in order.
  placeWord(w, x0) {
    const ls = lettersOf(w[0]), step = Math.min(230, 1000 / ls.length), Y = [this.groundY - 64, 770, 480];
    const sp = { w, ls, got: [], slots: [], failed: false, x0, done: false };
    ls.forEach((l, k) => {
      const x = x0 + k * step, at = Math.floor(rand() * 3), other = (at + 1 + Math.floor(rand() * 2)) % 3;
      let decoy = pick(ALPHABET); while (decoy === l) decoy = pick(ALPHABET);
      const slot = { x, l, done: false, toks: [] };
      slot.toks.push(this.letterBubble(x, Y[at], l, slot, true), this.letterBubble(x, Y[other], decoy, slot, false));
      sp.slots.push(slot);
    });
    for (const s of sp.slots) s.sp = sp;
    this.spells.push(sp);
  }

  letterBubble(x, y, l, slot, right) {
    const b = this.letters.create(x, y, 'letter').setDepth(4);
    b.body.setCircle(36, 5, 5);
    b.label = this.add.text(x, y, l, { fontFamily: 'Plus Jakarta Sans', fontSize: '42px', fontStyle: '800', color: '#4a2a8a' }).setOrigin(.5).setDepth(4);
    b.slot = slot; b.right = right; b.l = l;
    this.tweens.add({ targets: [b, b.label], y: y - 10, duration: 700 + rand() * 300, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    return b;
  }

  takeLetter(b) {
    const slot = b.slot; if (slot.done || b.popped) return;
    if (b.right) {
      slot.done = true; slot.sp.got.push(slot.l);
      this.sparks.explode(10, b.x, b.y); SFX.coin();
      slot.toks.forEach(t => this.popBubble(t));
      this.checkWord(slot.sp);
    } else {
      // the wrong letter: it bursts, and the right one is not taken this time
      this.popBubble(b); SFX.click(); this.floatText('✖', b.x, b.y - 40);
    }
    this.updateSpell();
  }

  popBubble(b) { if (!b.active || b.popped) return; b.popped = true; b.body.enable = false; this.tweens.killTweensOf([b, b.label]); this.tweens.add({ targets: [b, b.label], scale: 1.4, alpha: 0, duration: 200, onComplete: () => { b.label.destroy(); b.destroy(); } }); }

  checkWord(sp) {
    if (sp.done || sp.slots.some(s => !s.done)) return;
    sp.done = true;
    const w = sp.w, say = `${emo(w)}${w[0]} · ${asks(w)}`;
    if (!sp.failed) {
      this.spelledOk++; this.coinsGot += 10; this.floatText('+10 🪙', this.rova.x, this.rova.y - 160);
      this.showBanner(`✏️ ${say}`, '#fff3b0', 1800); SFX.right();
      book.spelled(w, this.mode === 'level' ? this.level : -1);
    } else this.showBanner(`✏️ ${say}`, '#ffd6e4', 1800);
    this.time.delayedCall(1600, () => this.updateSpell());
    this.updateHud();
  }

  // the word being spelled, at the top: its picture or meaning, and its letters as they come
  updateSpell() {
    const sp = this.spells.find(s => !s.done && s.x0 - this.rova.x < 1300) || this.spells.find(s => s.done && this.time.now - (s.at ||= this.time.now) < 1500);
    if (!sp) { this.spellHud.setVisible(false); return; }
    const shown = sp.ls.map((l, k) => (k < sp.got.length ? (sp.slots[k].missed ? '·' : l) : '_')).join(' ');
    this.spellHud.setText(`✏️ ${isPic(sp.w) ? sp.w[5] : `“${asks(sp.w)}”`}  ${shown}`).setVisible(true);
  }

  // Things in the way, on the ground: a rock, a log, a chicken. Run into one and Rova stumbles and drops two
  // coins (never a heart); jump over it.
  placeRock(x) {
    const kind = pick(['🪨', '🪵', '🐔']);
    const r = this.add.text(x, this.groundY + 6, kind, { fontSize: '86px', padding: { y: 10 } }).setOrigin(.5, 1).setDepth(3);
    this.rocks.add(r);
    r.body.setSize(54, 48).setOffset((r.width - 54) / 2, r.height - 62);
    if (kind === '🐔') this.tweens.add({ targets: r, scaleX: { from: 1, to: -1 }, duration: 900, yoyo: true, repeat: -1, ease: 'Stepped' });
  }

  hitRock(r) {
    if (r.hit || this.over) return;
    r.hit = true; this.stumbles++;
    const lost = Math.min(2, this.coinsGot); this.coinsGot -= lost;
    if (lost) this.floatText(`-${lost} 🪙`, this.rova.x, this.rova.y - 150);
    this.slowUntil = this.time.now + 900;
    this.pose(STUMBLE, 500); SFX.wrong();
    this.tweens.add({ targets: r, y: r.y - 60, angle: 40, alpha: 0, duration: 500 });
    this.updateHud();
  }

  // A power in a bubble: a magnet pulls the coins in, a shield forgives one wrong door, slow time gives longer to read.
  placePower(x, y, kind) {
    const p = this.powers.create(x, y, 'power').setDepth(4);
    p.body.setCircle(42, 6, 6);
    p.label = this.add.text(x, y, { magnet: '🧲', shield: '🛡️', slow: '⏳' }[kind], { fontSize: '54px', padding: { y: 6 } }).setOrigin(.5).setDepth(4);
    p.kind = kind;
    this.tweens.add({ targets: [p, p.label], y: y - 16, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
  }

  takePower(p) {
    if (!p.active || p.popped) return;
    const k = p.kind, now = this.time.now;
    this.popBubble(p); SFX.buy();
    if (k === 'magnet') this.magnetUntil = now + 8000;
    if (k === 'slow') this.calmUntil = now + 6000;
    if (k === 'shield') this.shield = true;
    this.showBanner({ magnet: `🧲 ${L('Magnet!', 'Magnet!')}`, shield: `🛡️ ${L('Shield: one wrong door is forgiven', 'Venna: kawngkhar dik lo pakhat a ngaihdam ang')}`, slow: `⏳ ${L('Slow time', 'Hun muang')}` }[k], '#e3f4ff', 1500);
    this.updateHud();
  }

  // Endless: the words grow harder every ten doors, and every tenth door is a boss.
  addEndlessGate() {
    const i = this.made++, step = Math.floor(i / 10), bands = [[1, 2], [2, 4], [3, 5], [4, 7]];
    const cfg = this.endlessCfg ||= {}, band = bands[Math.min(step, bands.length - 1)];
    if (!cfg.band || cfg.band[0] !== band[0]) { cfg.band = band; cfg.pool = null; cfg.mix = { pic: 2, en2mz: 4, mz2en: 3, gap: 1, count: 1, odd: 1 }; }
    const boss = i % 10 === 9;
    let q = boss ? Object.assign(bossQuestion(cfg, this.used) || question(cfg, 'en2mz', this.used), { boss: true }) : question(cfg, weighted(fitMix(cfg.mix, this.skill)), this.used);
    if (!q) { this.used.clear(); q = question(cfg, 'en2mz', this.used); }
    this.used.add(fold(q.target[0]));
    this.addGate(q, i);
  }

  // Rova's frames, made once: from the Blender sheet, scaled down to the screen's sharpness (or kept at
  // the sheet's own on the sharpest screens), else drawn by rova.js. Returns the pixels a box unit.
  makeRova() {
    const u3 = Math.min(1.25 * RES, SHEET_PX);
    if (this.textures.exists('rova3d') || this.textures.exists('rova-sheet')) {
      this.rovaKey = 'rova3d'; this.rovaRun = SHEET_RUN; this.sheet3d = true;
      this.rovaAir = vy => SHEET_RUN + (vy < -350 ? 0 : vy < 350 ? 1 : 2);
      if (this.textures.exists('rova3d')) { this.frames3d = this.textures.get('rova3d').frameTotal - 1; return u3; }
      const img = this.textures.get('rova-sheet').getSourceImage();

  // What Rova wears (the shop's), each a picture at the screen's sharpness, kept on his head as he runs.

  placeLooks(f) {

  // A strip that repeats every TILE pixels, slid along at its own pace.

    t.setTileScale(1 / RES);

  makeHills(colour, factor, baseY, height) {
    const TILE = 2048, top = Math.floor(baseY - height - 4), key = `hills-${colour}-${baseY}-${height}`;

  // The three doors' middles. The top one sits low enough to leave room above it for a
  // long boss question; a double jump still takes Rova well into it.
  lanes() { return [this.groundY - 70, this.groundY - 420, this.groundY - 720]; }

  coinArc(x, lane) {
    const y = this.lanes()[lane];
    for (let i = 0; i < 5; i++) {

      const c = this.coins.create(x + i * 70, y - Math.sin(i / 4 * Math.PI) * (lane === 2 ? 50 : 120), 'coin');

    if (!q) q = question(cfg, 'en2mz', this.used) || question(cfg, 'en2mz');
    if (p.review) q.review = true;
    if (p.fresh) q.fresh = true;
    this.used.add(fold(q.target[0]));

  buildGate(gate) {

    if (faded >= 0) this.hints--;
    gate.doors = q.options.map((opt, lane) => {
      const y = ys[lane];
      const c = this.add.container(gate.x, y);
      const frame = this.add.rectangle(0, 0, 230, 190, gate.boss ? 0x7a4bc2 : q.review ? 0x2f6b22 : q.fresh ? 0x00897b : 0x8a5a33).setStrokeStyle(8, gate.boss ? 0xffc94a : q.review ? 0x1d4a14 : q.fresh ? 0xffd54f : 0x5a3a20);
      const glow = this.add.rectangle(0, 0, 196, 160, 0xfff6dd);

      const size = text.length > 34 ? 19 : text.length > 16 ? 23 : text.length > 11 ? 26 : text.length > 8 ? 32 : 40;
      const label = this.add.text(0, 0, text, { fontFamily: 'Plus Jakarta Sans', fontSize: size + 'px', fontStyle: '800', color: '#15213a', align: 'center', wordWrap: { width: 186 } }).setOrigin(.5);

  passGate(gate) {
    gate.done = true;

    const t = gate.q.target, B = gate.q.bridge, word = gate.q.saying || B ? null : t;
    this.met.push({ w: gate.q.saying ? [t[1], t[0]] : t, right, kind: gate.q.kind });
